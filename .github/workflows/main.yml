          .list::-webkit-scrollbar-thumb{background:rgba(148,163,184,.18);border-radius:99px}
          .row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;margin:2px 0;border:1px solid transparent;transition:.15s}
          .row:hover{background:rgba(148,163,184,.06)}
          .row.sel{background:rgba(45,212,191,.07);border-color:rgba(45,212,191,.22)}
          .row input{accent-color:var(--acc);width:16px;height:16px;flex:none;cursor:pointer}
          .vend{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(139,92,246,.14);color:#c4b5fd;flex:none;font-family:var(--mono)}
          .name{flex:1;font-size:13px;font-family:var(--mono);word-break:break-all}
          .tbtn{background:rgba(148,163,184,.08);color:#9fb3c8;border:1px solid var(--line);border-radius:9px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;flex:none;font-family:inherit;transition:.2s}
          .tbtn:hover{border-color:var(--acc);color:var(--acc);background:rgba(45,212,191,.08)}
          .lat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;flex:none;white-space:nowrap;font-family:var(--mono)}
          .lat.ok{background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
          .lat.bad{background:rgba(248,113,113,.1);color:var(--bad);border:1px solid rgba(248,113,113,.3);cursor:help}
          .lat.tst{background:rgba(251,191,36,.1);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
          .skel{height:38px;border-radius:12px;margin:6px 4px;background:linear-gradient(90deg,rgba(148,163,184,.06) 25%,rgba(148,163,184,.14) 50%,rgba(148,163,184,.06) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
          @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
          footer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(7,10,18,.88);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
          .prog{height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;transition:width .3s}
          .fin{display:flex;gap:12px;align-items:center;padding:13px 26px;max-width:860px;margin:0 auto}
          .info{flex:1;color:var(--dim);font-size:13px}
          .info b{color:var(--txt);font-family:var(--mono)}
          .btn{border:0;border-radius:12px;padding:13px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
          .btn.primary{background:linear-gradient(135deg,var(--acc),#14b8a6);color:#032620;box-shadow:0 10px 26px rgba(45,212,191,.3)}
          .btn.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
          .btn.ghost{background:rgba(148,163,184,.08);color:var(--txt);border:1px solid var(--line)}
          .btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
          #toasts{position:fixed;top:70px;right:20px;z-index:9;display:flex;flex-direction:column;gap:10px}
          .toast{background:rgba(19,25,39,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-left:3px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:13px;max-width:380px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
          .toast.bad{border-left-color:var(--bad)}
          @keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
          </style></head><body>
          <div class="orb o1"></div><div class="orb o2"></div>
          <nav>
            <div class=logo>&#9884;</div>
            <div><h1>Hermes Command Deck</h1><div class=crumb>model pool &middot; litellm router</div></div>
            <div class=pill><span class=dot></span><span id=sub>Loading catalog...</span></div>
          </nav>
          <div class=wrap>
            <div class=grid id=stats>
              <div class=skel></div><div class=skel></div><div class=skel></div><div class=skel></div>
            </div>
            <div class=card style="margin-bottom:18px">
              <div class=chead>
                <h2>&#128225; NVIDIA NIM Catalog</h2><span class=badge id=cntN>&ndash;</span>
                <button class=chip id=selchip onclick="selOnlyTgl()">Selected only</button>
              </div>
              <div class=sbox><span class=ico>&#128269;</span>
                <input class=search placeholder="Filter models... try 'instruct' or 'llama'" oninput="filt(this.value)"></div>
              <div class=list id=nvidia>
                <div class=skel></div><div class=skel></div><div class=skel></div><div class=skel></div><div class=skel></div>
              </div>
            </div>
            <div class=card>
              <div class=chead>
                <h2>&#127756; Mistral Catalog</h2><span class=badge id=cntM>&ndash;</span>
              </div>
              <div class=list id=mistral style="max-height:34vh">
                <div class=skel></div><div class=skel></div>
              </div>
            </div>
          </div>
          <footer>
            <div class=prog id=prog></div>
            <div class=fin>
              <div class=info id=info><b>0</b> models selected</div>
              <button class="btn ghost" onclick="testSelected()">&#9889; Test selected</button>
              <button class="btn primary" onclick="applyPool()">Apply pool &rarr;</button>
            </div>
          </footer>
          <div id=toasts></div>
          <script>
          let catN=[],catM=[],pool=new Map(),results={},filter='',selOnly=false,keys={};
          function toast(m,bad){const w=document.getElementById('toasts');
            const t=document.createElement('div');t.className='toast'+(bad?' bad':'');
            t.textContent=(bad?'\u2715 ':'\u2713 ')+m;w.appendChild(t);
            setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';setTimeout(()=>t.remove(),400)},5600)}
          function renderStats(){
            const rows=Object.entries(keys).map(([p,n])=>`
              <div class=stat><div class=bar style="background:linear-gradient(90deg,${n>0?'var(--ok)':'var(--bad)'},transparent)"></div>
                <div class=k><span class="dot ${n>0?'on':'off'}"></span>${p}</div>
                <div class=v>${n}</div><div class=s>API key${n===1?'':'s'} loaded</div></div>`).join('');
            document.getElementById('stats').innerHTML=rows+`
              <div class=stat><div class=bar style="background:linear-gradient(90deg,var(--acc2),transparent)"></div>
                <div class=k>Catalog</div><div class=v>${catN.length+catM.length}</div><div class=s>models available</div></div>
              <div class=stat><div class=bar style="background:linear-gradient(90deg,var(--acc),transparent)"></div>
                <div class=k>Active pool</div><div class=v id=poolstat>${pool.size}</div><div class=s>rotating via pool-auto</div></div>`;
          }
          fetch('/api/models').then(r=>r.json()).then(d=>{
            catN=d.nvidia;catM=d.mistral||[];keys=d.keys||{};
            d.pool.forEach(x=>{const cat=(x.provider==='mistral')?catM:catN;
              if(!cat.length||cat.includes(x.id))pool.set(x.id,x.provider||'nvidia')});
            renderStats();render();info();
            document.getElementById('sub').textContent=d.errors.length?d.errors.join(' | ')
              :'Live \u00b7 catalog loaded';
            if(d.errors.length)toast(d.errors.join(' | '),true);
          });
          function rowHtml(m,p){
            const r=results[m],sel=pool.has(m),v=p==='mistral'?'mistral':(m.includes('/')?m.split('/')[0]:'nim');
            const chip=!r?'':r.loading?'<span class="lat tst">testing\u2026</span>'
              :r.ok?`<span class="lat ok">${r.ms} ms</span>`
              :`<span class="lat bad" title="${(r.msg||'').replace(/"/g,'&quot;')}">\u2715 ${(r.msg||'fail').slice(0,24)}</span>`;
            return `<div class="row ${sel?'sel':''}">
              <input type=checkbox ${sel?'checked':''} onchange="tog('${m}','${p}')">
              <span class=vend>${v}</span>
              <span class=name>${m}</span>${chip}
              <button class=tbtn onclick="testModel('${m}','${p}')">Test</button></div>`;
          }
          function render(){
            const f=filter.toLowerCase();
            let items=catN.filter(m=>m.toLowerCase().includes(f));
            if(selOnly)items=items.filter(m=>pool.has(m));
            document.getElementById('cntN').textContent=catN.length;
            document.getElementById('nvidia').innerHTML=items.map(m=>rowHtml(m,'nvidia')).join('')
              ||'<div style="padding:22px;color:#8b98ad;text-align:center">No models match</div>';
            document.getElementById('cntM').textContent=catM.length;
            let mitems=catM.filter(m=>m.toLowerCase().includes(f));
            if(selOnly)mitems=mitems.filter(m=>pool.has(m));
            document.getElementById('mistral').innerHTML=catM.length
              ?(mitems.map(m=>rowHtml(m,'mistral')).join('')
                ||'<div style="padding:22px;color:#8b98ad;text-align:center">No models match</div>')
              :'<div style="padding:22px;color:#8b98ad;text-align:center">No MISTRAL_KEYS secret configured \u2014 add it to enable this section</div>';
          }
          function filt(v){filter=v;render()}
          function selOnlyTgl(){selOnly=!selOnly;document.getElementById('selchip').classList.toggle('on',selOnly);render()}
          function tog(m,p){pool.has(m)?pool.delete(m):pool.set(m,p);render();info();
            const el=document.getElementById('poolstat');if(el)el.textContent=pool.size}
          function info(){document.getElementById('info').innerHTML='<b>'+pool.size+'</b> model'+(pool.size===1?'':'s')+' in rotating pool'}
          function prog(p){document.getElementById('prog').style.width=p+'%'}
          async function testModel(m,p){
            results[m]={loading:true};render();
            const r=await fetch('/api/test',{method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({id:m,provider:p})}).then(x=>x.json())
              .catch(e=>({ok:false,ms:0,msg:'timeout / connection dropped'}));
            results[m]=r;render();
            toast(m+' \u2014 '+(r.ok?r.ms+' ms':r.msg),!r.ok);
            return r;
          }
          async function testSelected(){
            const items=[...pool.entries()];
            if(!items.length)return toast('Nothing selected',true);
            toast('Testing '+items.length+' model(s)\u2026');
            let ok=0,done=0;
            for(const [m,p] of items){const r=await testModel(m,p);if(r.ok)ok++;done++;prog(Math.round(done/items.length*100))}
            toast('Done: '+ok+'/'+items.length+' working',ok<items.length);
            setTimeout(()=>prog(0),1500);
          }
          function applyPool(){
            const sel=[...pool.entries()].map(([id,provider])=>({provider,id}));
            if(!sel.length)return toast('Select at least 1 model',true);
            toast('Applying pool\u2026');prog(60);
            fetch('/api/pool',{method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({pool:sel})}).then(r=>r.json())
              .then(d=>{prog(100);toast('Pool saved ('+d.count+'). Router restarting ~10s. All '+d.count+' models now auto-rotate via pool-auto \u2014 no manual switching needed.');setTimeout(()=>prog(0),1500)})
              .catch(e=>{prog(0);toast('Failed: '+e,true)});
          }
          </script></body></html>"""

          @app.route("/")
          def home():
              return (HTML, 200) if authed() else (LOGIN, 200)

          @app.route("/login", methods=["POST"])
          def login():
              now = time.time()
              if now < FAILS["until"]:
                  return jsonify({"ok": False, "msg": "Too many attempts — wait 60s"})
              pw = (request.get_json(silent=True) or {}).get("password", "")
              if hmac.compare_digest(pw, TOKEN):
                  FAILS["n"] = 0
                  r = make_response(jsonify({"ok": True}))
                  r.set_cookie("s", SESSION, httponly=True, secure=True,
                               samesite="Lax", max_age=6 * 3600)
                  return r
              FAILS["n"] += 1
              if FAILS["n"] >= 5:
                  FAILS["until"] = now + 60
                  FAILS["n"] = 0
              time.sleep(1)
              return jsonify({"ok": False, "msg": "Wrong password"})

          @app.route("/api/models")
          def models():
              if not authed(): return deny()
              out = {"nvidia": [], "mistral": [], "errors": [], "pool": load_pool(),
                     "keys": {"NVIDIA NIM": len(KEY_NAMES),
                              "Mistral": len(MISTRAL_KEY_NAMES)}}
              if KEY_NAMES:
                  # live catalog from NVIDIA NIM API
                  try: out["nvidia"] = fetch_models(BASE, KEY_NAMES[0])
                  except Exception as e: out["errors"].append("nvidia: " + str(e))
              else:
                  out["errors"].append("no NVIDIA keys configured")
              if MISTRAL_KEY_NAMES:
                  # live catalog from Mistral API; fall back to built-in list
                  try: out["mistral"] = fetch_models("https://api.mistral.ai/v1", MISTRAL_KEY_NAMES[0])
                  except Exception as e:
                      out["mistral"] = MISTRAL_MODELS
                      out["errors"].append("mistral: " + str(e) + " (showing built-in list)")
              return jsonify(out)

          @app.route("/api/test", methods=["POST"])
          def test_model():
              if not authed(): return deny()
              data = request.get_json()
              mid = data["id"]
              provider = data.get("provider", "nvidia")
              if provider == "mistral":
                  base, keys = "https://api.mistral.ai/v1", MISTRAL_KEY_NAMES
              else:
                  base, keys = BASE, KEY_NAMES
              if not keys:
                  return jsonify({"ok": False, "ms": 0, "msg": "no API keys for " + provider})
              body = json.dumps({"model": mid, "max_tokens": 5,
                  "messages": [{"role": "user", "content": "Say OK"}]}).encode()
              req = urllib.request.Request(base + "/chat/completions", data=body,
                  headers={"Authorization": "Bearer " + os.environ[keys[0]],
                           "Content-Type": "application/json"})
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      json.load(r)
                  return jsonify({"ok": True, "ms": int((time.time()-t0)*1000), "msg": "works"})
              except urllib.error.HTTPError as e:
                  try:
                      err = json.loads(e.read().decode())
                      msg = (err.get("error") or {}).get("message") or err.get("title") or str(err)
                  except Exception:
                      msg = "HTTP %d" % e.code
                  return jsonify({"ok": False, "ms": int((time.time()-t0)*1000), "msg": str(msg)[:200]})
              except Exception as e:
                  return jsonify({"ok": False, "ms": int((time.time()-t0)*1000), "msg": str(e)[:200]})

          @app.route("/api/pool", methods=["POST"])
          def set_pool():
              if not authed(): return deny()
              pool = [x for x in request.get_json()["pool"] if x.get("provider") in ("nvidia", "mistral")]
              if not pool:
                  return jsonify({"ok": False, "count": 0})
              save_pool(pool)
              write_config(pool)
              # fire-and-forget restart: respond immediately, don't block the request
              subprocess.Popen(["docker", "restart", "-t", "2", "litellm"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              return jsonify({"ok": True, "count": len(pool)})

          if __name__ == "__main__":
              if "--init" in sys.argv:
                  pool, removed = prune_pool(load_pool())
                  if removed:
                      save_pool(pool)
                      print("pruned dead/EOL models: " + ", ".join(removed))
                  write_config(pool); sys.exit(0)
              import threading
              threading.Thread(target=auto_prune_loop, daemon=True).start()
              app.run(host="0.0.0.0", port=7000, threaded=True)
          PYEOF

          # sanitize pool: drop any old ollama entries from backup; default if empty
          python3 - <<'PY'
          import json, os
          home = os.environ.get("HERMES_HOME", "/home/runner/.hermes")
          p = os.path.join(home, "pool.json")
          try:
              pool = [x for x in json.load(open(p)) if x.get("provider") in ("nvidia", "mistral")]
          except Exception:
              pool = []
          # NO hardcoded default model — pool stays empty until YOU pick one
          os.makedirs(home, exist_ok=True)
          json.dump(pool, open(p, "w"), indent=1)
          print("pool:", [x["id"] for x in pool] or "EMPTY (waiting for panel selection)")
          PY

      # ── 6. Start LiteLLM router + panel + tunnel ──
      - name: Start LiteLLM router and control panel
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          NVIDIA_KEYS: ${{ secrets.NVIDIA_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          # ── hard fail if PANEL_TOKEN is missing or too short ──
          if [ -z "$PANEL_TOKEN" ] || [ ${#PANEL_TOKEN} -lt 8 ]; then
            echo "::error::PANEL_TOKEN secret is missing or shorter than 8 chars — set it in Settings → Secrets"
            exit 1
          fi

          # ── split + VALIDATE bulk NVIDIA_KEYS (one per line; commas also OK) ──
          # every key is auth-checked against the live API; keys that return
          # 401/403 (revoked/banned/typo) are DROPPED so they never poison the
          # rotation pool. 429/timeouts do NOT drop a key (fail-open).
          : > /tmp/litellm.env
          n=0; bad_n=0
          while IFS= read -r k; do
            k=$(echo "$k" | tr -d ' \r')
            [ -z "$k" ] && continue
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${k}" https://integrate.api.nvidia.com/v1/models)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              bad_n=$((bad_n+1))
              echo "::warning::Dropping NVIDIA key #$((n+bad_n)) — auth check failed (HTTP $code)"
            else
              n=$((n+1))
              echo "NVIDIA_KEY_${n}=${k}" >> /tmp/litellm.env
            fi
            sleep 1
          done < <(printf '%s\n' "$NVIDIA_KEYS" | tr ',' '\n')
          echo "NVIDIA keys: $n valid, $bad_n dropped"
          if [ "$bad_n" -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              --data-urlencode text="🚨 Hermes: ${bad_n} NVIDIA key(s) dead (auth failed) - ${n} still working" > /dev/null || true
          fi
          if [ "$n" -eq 0 ]; then
            echo "::error::No working NVIDIA key — secret is empty or every key failed the auth check"
            exit 1
          fi

          # ── split + VALIDATE bulk MISTRAL_KEYS (one per line; commas also OK; optional) ──
          m=0; bad_m=0
          while IFS= read -r k; do
            k=$(echo "$k" | tr -d ' \r')
            [ -z "$k" ] && continue
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${k}" https://api.mistral.ai/v1/models)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              bad_m=$((bad_m+1))
              echo "::warning::Dropping Mistral key #$((m+bad_m)) — auth check failed (HTTP $code)"
            else
              m=$((m+1))
              echo "MISTRAL_KEY_${m}=${k}" >> /tmp/litellm.env
            fi
            sleep 1
          done < <(printf '%s\n' "$MISTRAL_KEYS" | tr ',' '\n')
          echo "Mistral keys: $m valid, $bad_m dropped"
          if [ "$bad_m" -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              --data-urlencode text="🚨 Hermes: ${bad_m} Mistral key(s) dead (auth failed) - ${m} still working" > /dev/null || true
          fi

          # make the split keys visible to this shell + panel process
          set -a; source /tmp/litellm.env; set +a

          # start control panel FIRST (inherits this step's env)
          nohup python3 /tmp/panel/app.py > /tmp/panel.log 2>&1 &
          sleep 3
          # verify panel is up (login page must load)
          curl -fs http://localhost:7000/ >/dev/null || { cat /tmp/panel.log; exit 1; }

          # cloudflare quick tunnel for the panel
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:7000 > /tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "Tunnel failed"; cat /tmp/tunnel.log; exit 1; fi
          PANEL_URL="${URL}"
          echo "PANEL_URL=$PANEL_URL" >> "$GITHUB_ENV"

          # ── NO default model: if no pool saved yet, WAIT for your selection ──
          POOL_FILE="$HERMES_HOME/pool.json"
          pool_ok() { python3 -c "import json,sys; sys.exit(0 if json.load(open('$POOL_FILE')) else 1)" 2>/dev/null; }
          if ! pool_ok; then
            echo "::warning::No model pool saved — open the panel and apply a pool: $PANEL_URL"
            TG_API="https://api.telegram.org"
            curl -s -X POST "${TG_API}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              --data-urlencode text="⚠️ No model pool selected yet. Open the panel, tick your models and press Apply: ${PANEL_URL} (password = PANEL_TOKEN secret). Waiting up to 60 min..." > /dev/null || true
            for i in $(seq 1 240); do
              pool_ok && break
              sleep 15
            done
            pool_ok || { echo "::error::No model pool selected within 60 minutes"; exit 1; }
            echo "Pool selected via panel."
          fi

          # generate litellm config from YOUR pool (nothing hardcoded)
          # --init also PRUNES models the provider has retired (HTTP 410 EOL)
          python3 /tmp/panel/app.py --init
          if ! pool_ok; then
            echo "::warning::All saved models are dead/EOL — pick a fresh pool: $PANEL_URL"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              --data-urlencode text="⚠️ All your saved models were retired by the provider — pool auto-cleaned. Open the panel and apply a fresh pool: ${PANEL_URL}" > /dev/null || true
            for i in $(seq 1 240); do
              pool_ok && break
              sleep 15
            done
            pool_ok || { echo "::error::No model pool selected within 60 minutes"; exit 1; }
            python3 /tmp/panel/app.py --init
          fi

          docker rm -f litellm 2>/dev/null || true
          # --num_workers 4: each router worker caps at ~32 concurrent
          # requests ("Worker local total request limit reached"). Agentic
          # retry bursts can exceed one worker's cap, so run 4 workers
          # (GitHub runners have 4 vCPUs) = ~128 concurrent requests.
          docker run -d --name litellm --network host \
            --env-file /tmp/litellm.env \
            -v /tmp/litellm.yaml:/app/config.yaml \
            ghcr.io/berriai/litellm:main-stable \
            --config /app/config.yaml --port 4000 --num_workers 4

          rm -f /tmp/litellm.env   # keys now live only in container/process env

          echo "Waiting for LiteLLM..."
          for i in $(seq 1 30); do
            curl -fs http://localhost:4000/v1/models >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fs http://localhost:4000/v1/models || { docker logs litellm; exit 1; }

          echo "=================================================="
          echo "🎛️  MODEL POOL CONTROL PANEL:"
          echo ""
          echo "    $PANEL_URL"
          echo ""
          echo "    (password = your PANEL_TOKEN secret)"
          echo "=================================================="
          echo "::notice title=🎛️ Model Pool Panel::$PANEL_URL (password = PANEL_TOKEN secret)"

      # ── 7. Write .env (Telegram + Slack) ──
      - name: Write .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p "$HERMES_HOME"
          cat > "$HERMES_HOME/.env" <<EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=${TELEGRAM_USER_ID}
          SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
          SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
          SLACK_ALLOWED_USERS=${SLACK_USER_ID}
          SEARXNG_URL=http://localhost:8080
          CAMOUFOX_URL=ws://127.0.0.1:9222/hermes
          GROQ_API_KEY=${GROQ_API_KEY}
          EOF
          # Hermes official Camofox mode - routes built-in browser_* tools
          # through the anti-detect server (flag written in step 4 on success)
          if [ -f /tmp/camofox_url ]; then
            echo "CAMOFOX_URL=$(cat /tmp/camofox_url)" >> "$HERMES_HOME/.env"
            # fix48: pin built-in browser tools to the SAME Camofox identity
            # the user watches + logs into (the keepalive placeholder
            # session "boss-view"). Hermes docs "Externally managed Camofox
            # sessions": setting user_id makes Hermes share that window,
            # profile and cookie jar, skip destructive cleanup and never
            # DELETE the session. Without it Hermes invents a RANDOM
            # ephemeral userId per task = fresh logged-out WINDOW each time
            # (the "multiple windows" + "ignores my logins" complaints).
            # session_key stays UNSET on purpose: Hermes opens its OWN tab
            # per task instead of adopting the placeholder tab. (Keepalive
            # auto-refresh is REMOVED - fix51 - no tab is ever reloaded.)
            echo "CAMOFOX_USER_ID=boss-view" >> "$HERMES_HOME/.env"
            echo "CAMOFOX_URL set - built-in browsing is anti-detect (shared boss-view session)"
          fi

      # ── 8. Standing instructions for the agent (auto save-to-file) ──
      - name: Write agent instructions
        run: |
          mkdir -p "$HERMES_HOME/work"
          cat > "$HOME/AGENTS.md" <<'EOF'
          # Standing instructions
          - For any long or multi-step task (scraping, research, data
            collection, comparisons), IMMEDIATELY append each intermediate
            result to a file under ~/.hermes/work/ as you go. Never keep
            results only in the conversation.
          - Use one file per task, named by date and topic
            (e.g. ~/.hermes/work/2026-07-25-price-scrape.md).
          - When the task finishes, tell the user the file path.
          - These files are backed up automatically; treat them as the
            source of truth for task results.
          - CRITICAL: THIS MACHINE IS WIPED after every run. ONLY files under
            ~/.hermes/ survive (they are pushed to a private GitHub repo).
            Put ALL projects, code, downloads and generated files under
            ~/.hermes/work/ — NEVER in ~, /tmp, /var or anywhere else.
          - If the user sends you a file, IMMEDIATELY copy it into
            ~/.hermes/work/ before doing anything else with it.
            Platform uploads land in a temporary cache that gets auto-deleted;
            the ~/.hermes/work/ copy is the only one that survives.
          - ALWAYS VOICE-REPLY ON TELEGRAM & SLACK: for EVERY reply you send
            over Telegram or Slack, send your normal text answer first and
            then ALSO speak it - every single time, not only when the incoming
            message was a voice note. Speak it by running:
              curl -s -X POST http://localhost:7777/voicereply \
                -H "X-Token: $PANEL_TOKEN" -H 'Content-Type: application/json' \
                -d '{"text":"<your reply text>","chat_id":"<telegram chat id>"}'
            For Slack use "channel":"<channel id>" instead of chat_id. Omit
            chat_id to use the default Telegram chat. Keep spoken replies short
            (2-4 sentences) and skip code blocks and URLs. The endpoint speaks
            with the Supertonic on-device model (Bangla automatically uses the
            Edge Bangla voice). This voice service runs locally on
            127.0.0.1:7777; the old Jarvis web panel has been removed.
          - SENDING FILES TO THE BOSS (screenshots, video, any file): any
            file you save is delivered inline into the Telegram/Slack chat. Whenever the
            user asks you for a screenshot, recording, report, export or ANY
            file, you MUST save it into the outbox folder:
              ~/.hermes/work/outputs/
            Everything you write there during a task is delivered into the
            chat automatically - images and video appear as inline previews
            with a download button. Use clear filenames.
            For a full-desktop screenshot use the visible display :99:
              DISPLAY=:99 import -window root ~/.hermes/work/outputs/shot.png
              (or: DISPLAY=:99 scrot ~/.hermes/work/outputs/shot.png)
            To push a file into the chat immediately, without waiting for
            your reply to finish, run:
              curl -s -X POST http://localhost:7777/share \
                -H "X-Token: $PANEL_TOKEN" -H 'Content-Type: application/json' \
                -d '{"path":"/home/runner/.hermes/work/outputs/shot.png","text":"Screenshot, Boss."}'
            Always MENTION the file path in your reply text too. Never tell
            the user you cannot send files - save it to the outbox instead.
            Files are served only from ~/.hermes/work, ~/Desktop, ~/Pictures,
            ~/Videos, ~/Downloads and /tmp, so keep outputs in those places.
          - BROWSER: your built-in browser_* tools run through Camofox - an
            anti-detect Camoufox browser (Firefox with C++-level fingerprint
            spoofing), so sites cannot detect or track your automation. It
            renders on its OWN virtual display, NOT the main :99 desktop:
            the user watches and controls it via the dedicated "Camofox
            browser" noVNC link from the start message. A keepalive keeps
            the engine awake with a placeholder tab under userId
            "boss-view" - NEVER close that tab or its session. Your browser
            tools are PINNED to that SAME identity (CAMOFOX_USER_ID
            boss-view): every tab you open lives in the user's ONE Camofox
            window, sharing ONE profile and ONE cookie jar with their tabs,
            so their logins (Facebook etc.) are ALREADY yours. USE YOUR
            BUILT-IN browser_* TOOLS BY DEFAULT for EVERY website task -
            visiting, logging in, posting, scraping, forms - never ask the
            user which browser to use and never open a separate browser for
            a job the built-in tools can do. When a task is done, CLOSE the
            tabs you opened - but NEVER the placeholder tab or tabs the
            user is using. The user can take the
            mouse there to
            log into accounts, solve captchas or step in - then you continue
            in that SAME browser with their logged-in session. Logins persist
            in ~/.hermes/data/camofox-profiles and survive across runs. If a
            page needs the user's login or a captcha, OPEN a tab on that page
            and KEEP it open (the window closes when no tabs are open), ASK
            the user to log in via the Camofox browser link, wait for their
            confirmation, then continue.
            Writing your OWN browser scripts is a LAST RESORT for jobs the
            built-in tools truly cannot do - that is a DIFFERENT browser
            with NONE of the user's logins. If you must: connect
            playwright/camoufox to ws://127.0.0.1:9222/hermes or ALWAYS pass
            headless=False - NEVER headless=True or headless='virtual' - so
            windows show on the shared display :99 (the main live desktop -
            unlike the built-in Camofox tools). The visible Chrome
            (CDP http://127.0.0.1:9223) is a last resort for CDP-only work;
            assume sites can detect it.
          - CAMOFOX "NOT RUNNING"? CHECK, NEVER GUESS: your built-in browser
            tools' Camofox window lives on its OWN private display (the
            "Camofox browser" noVNC :6081 link) - it is NEVER visible on the
            main :99 desktop. A Camoufox window that IS visible on the live
            desktop is the SEPARATE script browser (ws://127.0.0.1:9222) - a
            different process, so it proves NOTHING about the built-in
            backend. Never conclude "camoufox is not running" from a failed
            tool call or from looking at any desktop. Check the real backend:
              curl -s http://127.0.0.1:9377/health   (or /tabs)
            If it answers: Camofox IS running - retry your built-in
            browser_* tool (e.g. open https://gmail.com with it directly).
            If it does NOT answer: restart it yourself, then retry:
              bash /tmp/camofox-restart.sh   (wait ~30s, re-check /health)
            Only if the restart + health check BOTH still fail, tell the
            user Camofox is down and fall back to a playwright/camoufox
            script on ws://127.0.0.1:9222/hermes (headless=False) or, as a
            LAST resort, Chrome CDP :9223. NEVER launch your own new
            Chrome/Chromium/browser-use instance for a task the built-in
            browser tools can do.
          - TYPING INTO WEB APPS (Facebook, Messenger, WhatsApp Web,
            Instagram, X, Gmail, etc): NEVER inject text with CDP or
            JavaScript (element.value=..., execCommand, innerHTML, synthetic
            events). Rich chat boxes are React/contenteditable editors: the
            injected text is NOT registered in the app's draft state, so the
            send silently fails or sends empty. ALWAYS type like a human:
            prefer your built-in browser tools (Camofox delivers REAL
            keyboard/mouse events through Firefox's native input path), or
            in your own scripts: page.click() the input first, then
            page.keyboard.type(text, delay=80) - character-by-character -
            then press Enter or click the app's real send button.
          - VERIFY AFTER ACTING: after any send/submit/post, wait 2-3
            seconds and CHECK the page - did the message appear in the chat
            history? did the form advance? If not, retry ONCE with the
            alternate submit path (Enter key vs send button). If it still
            fails, take a screenshot, report exactly what you see, and ask
            the user to step into the live desktop to unblock you. NEVER
            claim success without seeing the result on the page, and NEVER
            retry in a loop.
          - ELEMENT MASTERY (work with ANY element on ANY website): be
            methodical, not lucky.
            1) SEE FIRST: take an accessibility/DOM snapshot (or a
               screenshot) before acting. Target elements by their ROLE +
               visible name / label / placeholder / aria-label - never by
               guessed or brittle absolute coordinates.
            2) WAIT FOR IT: modern sites (React/Vue/Angular) render late and
               re-render. Wait until the element actually EXISTS, is VISIBLE
               and STABLE before you act. Never act on the first paint.
            3) CLEAR THE PATH: dismiss cookie banners, consent modals,
               newsletter popups and overlays FIRST - they silently
               intercept clicks. Then scroll the target into view.
            4) GO DEEP: if the element is inside an IFRAME (checkouts,
               captchas, embedded widgets) switch into that frame; if it is
               in a SHADOW DOM, pierce the shadow root. Do not give up just
               because a top-level query missed.
            5) LADDER OF STRATEGIES: try role -> visible text -> label ->
               placeholder -> aria-label -> nearby-label -> CSS/XPath. If
               ALL selectors fail, FALL BACK TO VISION: screenshot, locate
               the element visually, and click by its on-screen coordinates.
            6) CONFIRM EACH STEP: after every click/type, check the page
               actually changed (element appeared/disappeared, URL/route
               moved) before the next step. Log what you did to the task
               file so you can recover if interrupted.
          - DESKTOP / PC CONTROL (drive ANY app in the live desktop, display
            :99): you have real GUI-automation tools installed - xdotool
            (mouse + keyboard), wmctrl (list/activate/move windows), scrot &
            ImageMagick "import" (screenshots), tesseract-ocr (READ text off
            the screen), and pyautogui (Python). ALWAYS export DISPLAY=:99.
            Professional loop: SCREENSHOT -> locate the target (vision, or
            tesseract OCR when you need exact on-screen text) -> ACT
            (wmctrl -a "<window>" to focus, xdotool mousemove/click, xdotool
            type --delay 80 "text", xdotool key ctrl+s / Return / Tab) ->
            SCREENSHOT again to CONFIRM it worked. Prefer reliable keyboard
            shortcuts over hunting through menus. Move deliberately (small
            waits between actions) so the UI keeps up and the Boss can follow
            on the live desktop. If you get stuck, screenshot, explain what
            you see, and ask the Boss to step in via the live desktop.

          # Persona: JARVIS-style professional assistant
          - Your name is "Agent". Never call yourself JARVIS.
          - You are a JARVIS-style professional personal assistant: calm,
            precise, proactive and lightly witty. Address the user as "Boss".
            Be confident and to the point — no rambling, no filler.
          - INSTANT ACKNOWLEDGE: the moment you receive a task, reply with ONE
            short line confirming what you are about to do ("On it, Boss —
            opening YouTube and starting the song."), THEN start working.
          - LIVE UPDATES: for any task that takes more than ~1 minute, send a
            SHORT progress message at every milestone: started → key finding →
            blocker (if any) → done. Never go silent for more than a few
            minutes in the middle of a long task.
          - COMPLETION REPORT: end every task with a crisp 2-3 line summary —
            what was done, where the results are saved (file path), and any
            follow-up you recommend.
          - FAILURES: report like a professional — what broke, what you tried,
            what you will do next. Never give up silently and never dump raw
            error logs without a one-line explanation.
          - VOICE: when the user asks you to speak / talk / send voice, use
            the text_to_speech tool and send the audio as your reply. Keep
            spoken replies shorter than written ones.
          - PROACTIVITY: if you notice something the user should know while
            working (a better approach, a risk, a broken credential), mention
            it in one line — don't wait to be asked.
          EOF
          echo "Agent instructions written to $HOME/AGENTS.md"

      # ── 9. Configure Hermes (active model comes ONLY from YOUR pool) ──
      - name: Configure Hermes
        run: |
          hermes config unset providers.nvidia.base_url || true
          hermes config unset providers.nvidia.api_key_env || true
          hermes config unset providers.nim.base_url || true
          hermes config unset providers.nim.api_key_env || true
          hermes config set model.provider custom
          hermes config set model.base_url "http://localhost:4000/v1"
          hermes config set model.api_key "sk-local"
          # ★ default = "pool-auto": the router alias that auto-rotates across
          #   ALL models YOU selected in the panel (never a hardcoded model)
          hermes config set model.default "pool-auto"
          echo "Active model: pool-auto (rotates across your whole selected pool)"
          hermes config set model.context_length 65536
          # more API retries — pool rotation sometimes needs several attempts
          hermes config set agent.api_max_retries 8
          hermes config set web.search_backend searxng
          # Built-in browser tools: Camofox anti-detect mode when the server
          # came up (CAMOFOX_URL in .env routes ALL browser_* tools through
          # it). Otherwise fall back to the visible Chrome over CDP.
          if [ -f /tmp/camofox_url ]; then
            # fix49: UNSET the Chrome CDP pin FIRST. hermes config persists
            # in the data repo across runs, so ONE bad run that fell back to
            # Chrome left browser.cdp_url set FOREVER: every later run then
            # drove Chrome (or errored on the dead :9223 port - "browser is
            # not running / unable to start") even while Camofox was up and
            # visible. Same stale-config trap as the providers.* unsets above.
            hermes config unset browser.cdp_url || true
            # fix48: same shared identity in config.yaml too (the .env var
            # takes precedence; this covers direct hermes runs/doctor)
            hermes config set browser.camofox.user_id boss-view
            echo "Built-in browser tools: Camofox anti-detect (no CDP beacons) - shared boss-view session"
          else
            # mirror-image cleanup: drop the camofox identity so built-in
            # tools never sit waiting on a dead :9377 server in fallback mode
            hermes config unset browser.camofox.user_id || true
            hermes config set browser.cdp_url "http://127.0.0.1:9223"
            echo "Built-in browser tools: visible Chrome fallback (CDP :9223)"
          fi
          # edge-tts CLI is needed by the tts toolset (free Microsoft voices).
          # ALWAYS upgrade to the latest release: Microsoft periodically breaks
          # old edge-tts versions (auth/DRM token changes), which surfaces as
          # "NoAudioReceived" from the built-in text_to_speech tool. The hermes
          # venv is restored from CACHE with its own stale edge_tts copy that
          # the built-in tool imports, so upgrade BOTH copies every run.
          pip install -q -U edge-tts || true
          "$HERMES_HOME/hermes-agent/venv/bin/pip" install -q -U edge-tts \
            && echo "edge-tts upgraded inside hermes venv: $("$HERMES_HOME/hermes-agent/venv/bin/pip" show edge-tts 2>/dev/null | awk '/^Version/{print $2}')" \
            || echo "::warning::could not upgrade edge-tts inside hermes venv - built-in TTS may fail with NoAudioReceived"
          hermes config set tts.provider edge

          hermes config set toolsets '["terminal","files","web","browser","code","vision","tts","memory","skills","delegation","cron"]'
          hermes doctor || true
          echo "── Final model config ──"
          hermes config get model || true

      # ── 10. Hermes WebUI (visual chat panel, password-protected) ──
      - name: Start Hermes WebUI
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          # community panel with built-in password auth — safe behind a public tunnel
          git clone --depth 1 https://github.com/nesquena/hermes-webui.git /tmp/hermes-webui \
            || { echo "::warning::Hermes WebUI clone failed — skipping visual panel"; exit 0; }
          cd /tmp/hermes-webui
          export HERMES_WEBUI_PASSWORD="$PANEL_TOKEN"   # same password as model panel
          export HERMES_WEBUI_PORT=8787
          export HERMES_WEBUI_HOST=127.0.0.1
          export HERMES_WEBUI_AUTO_INSTALL=1
          ./ctl.sh start \
            || { echo "::warning::Hermes WebUI failed to start — skipping"; tail -n 50 "$HERMES_HOME/webui.log" 2>/dev/null || true; exit 0; }
          for i in $(seq 1 20); do
            curl -fs http://localhost:8787/ >/dev/null 2>&1 && break
            sleep 3
          done

          # second cloudflare quick tunnel just for the WebUI
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8787 > /tmp/webui-tunnel.log 2>&1 &
          WEBUI_URL=""
          for i in $(seq 1 30); do
            WEBUI_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/webui-tunnel.log | head -n1 || true)
            [ -n "$WEBUI_URL" ] && break
            sleep 2
          done
          if [ -z "$WEBUI_URL" ]; then
            echo "::warning::WebUI tunnel failed — panel only reachable inside runner"
            exit 0
          fi
          echo "WEBUI_URL=$WEBUI_URL" >> "$GITHUB_ENV"
          echo "=================================================="
          echo "🖥️  HERMES WEBUI (visual chat panel):"
          echo ""
          echo "    $WEBUI_URL"
          echo ""
          echo "    (password = your PANEL_TOKEN secret)"
          echo "=================================================="
          echo "::notice title=🖥️ Hermes WebUI::$WEBUI_URL (password = PANEL_TOKEN secret)"

      # ── 10b. Voice reply service (Telegram / Slack TTS + file delivery) ──
      # Redesigned interface: professional dark HUD with a layered animated arc
      # reactor, smart end-of-speech detection (auto-sends when you stop
      # talking), barge-in interrupt (speak over the agent to cut it off),
      # pause / resume / replay controls for the agent's voice, a task
      # interrupt button, and drag-and-drop file uploads saved into
      # ~/.hermes/work/uploads/ (persisted) so the agent can work on them.
      # Every command runs the FULL Hermes agent via `hermes chat -q`.
      # Voice replies use FREE Microsoft Edge neural TTS (no key needed);
      # pick + preview voices in the VOICE MODEL panel. Protected by PANEL_TOKEN.
      - name: Start Hermes Dashboard
        run: |
          # Official Nous management dashboard (settings, API keys, session
          # monitor). Behind a public tunnel it MUST have auth: a non-loopback
          # bind engages the built-in auth gate, and we feed it the bundled
          # username/password provider (password = PANEL_TOKEN, like the rest).
          # An auth-free loopback dashboard must NEVER be tunneled - it can
          # read and write the .env secrets file.
          DASH_SECRET=$(openssl rand -base64 32)
          {
            echo "HERMES_DASHBOARD_BASIC_AUTH_USERNAME=boss"
            echo "HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${PANEL_TOKEN}"
            echo "HERMES_DASHBOARD_BASIC_AUTH_SECRET=${DASH_SECRET}"
          } >> "$HERMES_HOME/.env"
          chmod 600 "$HERMES_HOME/.env" || true
          nohup "$HOME/.local/bin/hermes" dashboard --no-open --host 0.0.0.0 --port 9119 \
            > /tmp/dashboard.log 2>&1 &
          ok=0
          for i in $(seq 1 20); do
            curl -fs http://localhost:9119/api/status >/dev/null 2>&1 && { ok=1; break; }
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Hermes dashboard did not come up - skipping it this run"
            tail -n 30 /tmp/dashboard.log 2>/dev/null || true
            exit 0
          fi
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:9119 > /tmp/dash-tunnel.log 2>&1 &
          DASHBOARD_URL=""
          for i in $(seq 1 30); do
            DASHBOARD_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/dash-tunnel.log | head -n1 || true)
            [ -n "$DASHBOARD_URL" ] && break
            sleep 2
          done
          if [ -z "$DASHBOARD_URL" ]; then
            echo "::warning::Dashboard tunnel failed - dashboard only reachable inside the runner"
            exit 0
          fi
          echo "DASHBOARD_URL=$DASHBOARD_URL" >> "$GITHUB_ENV"
          echo "::notice title=Hermes Dashboard::$DASHBOARD_URL (user: boss / password = PANEL_TOKEN secret)"
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
      - name: Start voice reply service
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          mkdir -p /tmp/jarvis
          cat > /tmp/jarvis/index.html <<'HUDHTML'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
          <title>AGENT HUD</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
          <style>
          :root{
            --bg:#06090f;--panel:rgba(13,20,31,.72);--panel2:rgba(17,26,40,.86);
            --line:rgba(96,165,250,.13);--line2:rgba(96,165,250,.28);
            --text:#dce8f5;--dim:#7d8fa5;--faint:#54657a;
            --accent:#38bdf8;--accent-soft:rgba(56,189,248,.12);
            --green:#34d399;--green-soft:rgba(52,211,153,.12);
            --amber:#fbbf24;--amber-soft:rgba(251,191,36,.12);
            --red:#f87171;--red-soft:rgba(248,113,113,.12);
          }
          *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          button,select,input,.vrow{touch-action:manipulation}
          html,body{height:100%}
          body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100dvh;overflow:hidden;font-size:15px;line-height:1.5}
          body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
            background:radial-gradient(900px 600px at 22% 30%,rgba(56,189,248,.07),transparent 60%),radial-gradient(700px 500px at 85% 80%,rgba(34,211,238,.05),transparent 60%)}
          #grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
            background-image:linear-gradient(rgba(96,165,250,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.045) 1px,transparent 1px);
            background-size:44px 44px;
            -webkit-mask:radial-gradient(ellipse 90% 80% at 50% 40%,#000 30%,transparent 100%);
            mask:radial-gradient(ellipse 90% 80% at 50% 40%,#000 30%,transparent 100%)}
          #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
          #wrap{position:relative;z-index:2;display:grid;grid-template-rows:auto 1fr;height:100dvh;padding:10px;gap:10px}
          @media(min-width:920px){#wrap{grid-template-columns:400px 1fr;grid-template-rows:1fr;padding:20px;gap:20px}}

          /* ---------- LEFT : reactor console ---------- */
          #left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px)}
          #brand{text-align:center}
          h1{font-family:Orbitron,monospace;font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:.42em;padding-left:.42em;color:#e8f6ff;text-shadow:0 0 24px rgba(56,189,248,.55)}
          #sub{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.32em;color:var(--faint);margin-top:6px;text-transform:uppercase}
          #sub b{color:var(--green);font-weight:500}

          #reactor{position:relative;width:clamp(150px,26vmin,240px);aspect-ratio:1;margin:8px 0}
          #reactor .halo{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.16) 0%,transparent 62%);animation:breath 4s ease-in-out infinite}
          #reactor .ring{position:absolute;border-radius:50%}
          #reactor .r-arc{inset:0;border:2px solid transparent;border-top-color:var(--accent);border-bottom-color:rgba(56,189,248,.35);animation:spin 7s linear infinite}
          #reactor .r-arc2{inset:5.5%;border:1px solid transparent;border-left-color:rgba(34,211,238,.7);border-right-color:rgba(34,211,238,.25);animation:spin 5s linear infinite reverse}
          #reactor .r-ticks{inset:11%;background:repeating-conic-gradient(rgba(125,211,252,.85) 0deg 1.6deg,transparent 1.6deg 7.5deg);-webkit-mask:radial-gradient(farthest-side,transparent 86%,#000 87%);mask:radial-gradient(farthest-side,transparent 86%,#000 87%);animation:spin 22s linear infinite}
          #reactor .r-dash{inset:19%;border:1px dashed rgba(56,189,248,.45);animation:spin 3.2s linear infinite reverse}
          #reactor .r-seg{inset:25%;background:conic-gradient(var(--accent) 0deg 40deg,transparent 40deg 120deg,rgba(56,189,248,.6) 120deg 160deg,transparent 160deg 250deg,rgba(34,211,238,.8) 250deg 290deg,transparent 290deg 360deg);-webkit-mask:radial-gradient(farthest-side,transparent 82%,#000 83%);mask:radial-gradient(farthest-side,transparent 82%,#000 83%);animation:spin 9s linear infinite}
          #core{position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle at 42% 38%,#f0fbff 0%,#7dd9ff 34%,#0ea5e9 62%,#082f49 100%);box-shadow:0 0 34px rgba(56,189,248,.7),0 0 90px rgba(56,189,248,.28),inset 0 0 18px rgba(255,255,255,.5);animation:pulse 2.6s ease-in-out infinite}
          #core:after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px solid rgba(255,255,255,.55);opacity:.7}
          #orbit{position:absolute;inset:2.5%;border-radius:50%;animation:spin 4.5s linear infinite}
          #orbit i{position:absolute;top:-3px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#bae6fd;box-shadow:0 0 10px #7dd3fc}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.05);filter:brightness(1.18)}}
          @keyframes breath{0%,100%{opacity:.7}50%{opacity:1}}

          /* state theming */
          body.listen #core{background:radial-gradient(circle at 42% 38%,#f0fff8 0%,#6ee7b7 34%,#059669 62%,#022c22 100%);box-shadow:0 0 34px rgba(52,211,153,.75),0 0 90px rgba(52,211,153,.3),inset 0 0 18px rgba(255,255,255,.5)}
          body.listen .r-arc{border-top-color:var(--green)}
          body.think .r-arc{animation-duration:1.4s;border-top-color:var(--amber)}
          body.think .r-arc2{animation-duration:.9s}
          body.think .r-dash{animation-duration:.7s}
          body.think .r-seg{animation-duration:1.8s}
          body.think #core{background:radial-gradient(circle at 42% 38%,#fffbeb 0%,#fcd34d 34%,#d97706 62%,#451a03 100%);box-shadow:0 0 34px rgba(251,191,36,.7),0 0 90px rgba(251,191,36,.26),inset 0 0 18px rgba(255,255,255,.5)}
          body.speak #core{animation-duration:.75s}
          body.speak .r-seg{animation-duration:2.5s}

          #state{display:flex;align-items:center;gap:9px;font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.3em;color:#a5d8f5;text-transform:uppercase;padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(8,14,22,.6)}
          #state i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:none;animation:breath 1.6s ease-in-out infinite}
          body.listen #state{color:#b6f3dc;border-color:rgba(52,211,153,.3)} body.listen #state i{background:var(--green);box-shadow:0 0 8px var(--green)}
          body.think #state{color:#fde9b8;border-color:rgba(251,191,36,.3)} body.think #state i{background:var(--amber);box-shadow:0 0 8px var(--amber)}

          #bars{display:flex;gap:3px;height:26px;align-items:center;visibility:hidden}
          body.speak #bars,body.listen #bars{visibility:visible}
          #bars span{width:3px;border-radius:2px;background:linear-gradient(180deg,#7dd3fc,#0ea5e9);animation:eq .8s ease-in-out infinite}
          body.listen #bars span{background:linear-gradient(180deg,#6ee7b7,#059669)}
          #bars span:nth-child(2n){animation-delay:.12s}#bars span:nth-child(3n){animation-delay:.26s}#bars span:nth-child(5n){animation-delay:.4s}
          @keyframes eq{0%,100%{height:5px}50%{height:24px}}

          #mic{width:clamp(62px,9vmin,78px);aspect-ratio:1;border-radius:50%;background:linear-gradient(180deg,rgba(24,38,58,.9),rgba(10,18,30,.9));border:1px solid var(--line2);color:#9ddcfb;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(2,6,12,.5)}
          #mic:hover{border-color:var(--accent);box-shadow:0 0 22px rgba(56,189,248,.35)}
          #mic svg{width:44%;height:44%}
          #mic.on{background:linear-gradient(180deg,rgba(6,46,34,.95),rgba(3,22,16,.95));border-color:var(--green);color:#8df0c8;box-shadow:0 0 26px rgba(52,211,153,.5);animation:pulse 1.3s ease-in-out infinite}
          #interrupt{display:none;align-items:center;gap:8px;background:var(--red-soft);border:1px solid rgba(248,113,113,.4);color:#fca5a5;border-radius:999px;padding:8px 18px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.24em;cursor:pointer;text-transform:uppercase}
          #interrupt:hover{background:rgba(248,113,113,.22);box-shadow:0 0 14px rgba(248,113,113,.3)}
          body.think #interrupt,body.speak #interrupt{display:inline-flex}

          #opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
          select{background:rgba(8,14,22,.8);color:#9fd6f2;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:Inter,sans-serif}
          .tog{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:11px;letter-spacing:.14em;color:var(--dim);font-family:"JetBrains Mono",monospace;text-transform:uppercase}
          .tog input{appearance:none;width:30px;height:16px;border-radius:999px;background:#1b2838;border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s}
          .tog input:before{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#5d7288;transition:.2s}
          .tog input:checked{background:rgba(56,189,248,.3);border-color:var(--accent)}
          .tog input:checked:before{left:16px;background:#7dd3fc}
          #engine{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.18em;color:var(--faint);text-align:center;text-transform:uppercase}

          /* ---------- RIGHT : conversation ---------- */
          #right{display:flex;flex-direction:column;min-height:0;gap:10px}
          #top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;backdrop-filter:blur(10px)}
          #top .tl{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
          #top .tl i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
          #clock{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.14em}
          #log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;backdrop-filter:blur(10px);scroll-behavior:smooth}
          #log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-thumb{background:#1e2f44;border-radius:8px}
          #empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--faint);text-align:center}
          #empty .t{font-family:Orbitron,monospace;letter-spacing:.3em;font-size:13px;color:#3f5b75}
          #empty .d{font-size:12.5px;max-width:340px;color:#48596c}
          .msg{margin-bottom:16px;max-width:86%;animation:rise .25s ease}
          @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
          .msg .meta{display:flex;gap:8px;align-items:baseline;margin-bottom:5px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
          .msg .meta b{color:#67c4ee;font-weight:500}
          .msg .body{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px 12px 12px 12px;padding:11px 14px}
          .msg pre{white-space:pre-wrap;word-break:break-word;font-family:Inter,sans-serif;font-size:14.5px;color:#d7e6f4;line-height:1.55}
          .msg.YOU{margin-left:auto}
          .msg.YOU .meta{justify-content:flex-end}.msg.YOU .meta b{color:#f0c987}
          .msg.YOU .body{border-left:1px solid var(--line);border-right:2px solid var(--amber);border-radius:12px 4px 12px 12px;background:rgba(30,26,15,.55)}
          .msg .att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
          .msg .att span{display:inline-flex;gap:6px;align-items:center;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:#9fd6f2;background:var(--accent-soft);border:1px solid var(--line2);border-radius:6px;padding:3px 8px}
          #live{min-height:20px;font-style:italic;color:#67c4ee;padding:0 8px;font-size:13.5px;font-family:Inter,sans-serif}

          /* playback bar */
          #pbar{display:none;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;backdrop-filter:blur(10px)}
          #pbar.show{display:flex}
          #pbar .lbl{display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;flex:none}
          #pbar .lbl i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
          #pbTrack{flex:1;height:4px;border-radius:4px;background:#16283c;overflow:hidden}
          #pbFill{height:100%;width:0%;background:linear-gradient(90deg,#0ea5e9,#7dd3fc);border-radius:4px;transition:width .25s linear}
          .icon{width:34px;height:34px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:rgba(8,14,22,.8);border:1px solid var(--line);border-radius:8px;color:#9fd6f2;cursor:pointer;font-size:14px;transition:.15s}
          .icon:hover{border-color:var(--accent);color:#d6f1ff;box-shadow:0 0 10px rgba(56,189,248,.25)}

          /* composer */
          #chips{display:none;flex-wrap:wrap;gap:7px;padding:0 4px}
          #chips.show{display:flex}
          .chip{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-family:"JetBrains Mono",monospace;font-size:11px;color:#a8def7}
          .chip .sz{color:var(--faint)}
          .chip em{font-style:normal;color:var(--amber)}
          .chip button{background:none;border:none;color:#7d8fa5;cursor:pointer;font-size:13px;padding:0}
          .chip button:hover{color:var(--red)}
          #inrow{display:flex;gap:8px;align-items:stretch}
          #txt{flex:1;min-width:0;background:rgba(8,14,22,.85);border:1px solid var(--line);color:#cfe6f7;padding:12px 14px;border-radius:10px;font-family:Inter,sans-serif;font-size:15px;transition:border .15s}
          #txt:focus{outline:none;border-color:var(--line2);box-shadow:0 0 0 3px rgba(56,189,248,.08)}
          #txt::placeholder{color:#48596c}
          button.act{background:rgba(8,14,22,.85);color:#9fd6f2;border:1px solid var(--line);border-radius:10px;padding:0 16px;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;transition:.15s}
          button.act:hover{border-color:var(--accent);color:#d6f1ff;box-shadow:0 0 12px rgba(56,189,248,.25)}
          #sendb{background:linear-gradient(180deg,rgba(14,116,168,.55),rgba(7,63,94,.55));border-color:var(--line2);color:#d6f1ff}
          #attach{font-size:15px}

          #toast.info{background:rgba(8,30,42,.95);border-color:rgba(95,220,255,.45);color:#bfeaff}
          #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(48,14,20,.95);border:1px solid rgba(248,113,113,.5);color:#fecdd3;padding:10px 18px;border-radius:10px;z-index:30;display:none;max-width:92vw;font-size:13.5px;backdrop-filter:blur(6px)}
          #drop{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(3,7,12,.82);border:2px dashed var(--accent);backdrop-filter:blur(4px)}
          #drop div{font-family:Orbitron,monospace;letter-spacing:.3em;color:#7dd3fc;font-size:15px}
          #gate{position:fixed;inset:0;background:rgba(2,4,8,.94);display:flex;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(8px)}
          #gatebox{border:1px solid var(--line2);border-radius:14px;padding:34px 38px;text-align:center;background:var(--panel2);box-shadow:0 0 60px rgba(56,189,248,.12)}
          #gatebox h2{font-family:Orbitron,monospace;letter-spacing:.34em;font-size:14px;margin-bottom:6px;color:#a8def7}
          #gatebox p{font-size:11.5px;color:var(--faint);margin-bottom:16px;letter-spacing:.06em}
          #gatebox input{background:rgba(8,14,22,.9);border:1px solid var(--line);color:#cfe6f7;padding:11px 13px;border-radius:9px;margin-bottom:12px;width:250px;font-family:"JetBrains Mono",monospace;letter-spacing:.1em}
          #gatebox button{width:250px;padding:11px}
          #vmb{background:rgba(8,14,22,.7);border:1px solid var(--line);color:#9fd8f2;padding:8px 12px;border-radius:9px;font-family:Orbitron,monospace;font-size:10px;letter-spacing:.18em;cursor:pointer;transition:.2s}
          #vmb:hover{border-color:rgba(95,220,255,.5);color:#dff4ff;box-shadow:0 0 14px rgba(95,220,255,.15)}
          #vmask{position:fixed;inset:0;background:rgba(2,8,16,.72);backdrop-filter:blur(6px);z-index:40;display:none;align-items:center;justify-content:center}
          #vmask.show{display:flex}
          #vpanel{width:min(580px,94vw);max-height:82vh;display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 0 80px rgba(56,189,248,.14);overflow:hidden}
          #vhead{padding:15px 18px;border-bottom:1px solid var(--line);font-family:Orbitron,monospace;letter-spacing:.24em;font-size:12px;color:#a8def7;display:flex;justify-content:space-between;align-items:center}
          #vlist{overflow-y:auto;padding:8px 10px}
          .vgroup{font-family:Orbitron,monospace;font-size:9.5px;letter-spacing:.3em;color:var(--faint);padding:14px 10px 5px}
          .vrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid transparent;border-radius:10px;cursor:pointer;transition:.15s}
          .vrow:hover{background:rgba(95,220,255,.05)}
          .vrow.sel{border-color:rgba(95,220,255,.45);background:rgba(95,220,255,.08)}
          .vrow .vn{font-size:14px;color:#dbeafe}
          .vrow.sel .vn{color:#eaffff}
          .vrow .vm{font-size:11px;color:var(--faint);letter-spacing:.06em;margin-top:2px}
          .vrow .prev{margin-left:auto}
          #vfoot{padding:11px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);letter-spacing:.08em}
          /* ---------- MOBILE ---------- */
          @media(max-width:919px){
            #wrap{padding:8px;gap:8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom))}
            /* compact console: brand strip, then reactor + state + mic in one row */
            #left{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding:10px 12px 12px}
            #brand{width:100%}
            h1{font-size:19px;letter-spacing:.34em;padding-left:.34em}
            #sub{font-size:8.5px;letter-spacing:.26em;margin-top:3px}
            #reactor{width:clamp(84px,24vw,110px);margin:0}
            #state{font-size:9.5px;letter-spacing:.2em;padding:7px 13px}
            #mic{width:58px}
            #bars{display:none}#top{display:none}#engine{display:none}
            #interrupt{padding:10px 16px;min-height:44px}
            /* options: full-width row with comfortable touch sizes */
            #opts{width:100%;gap:10px 14px}
            select{padding:10px 12px;font-size:14px;min-height:42px}
            .tog{font-size:10px;min-height:42px}
            .tog input{width:36px;height:20px}
            .tog input:before{width:14px;height:14px}
