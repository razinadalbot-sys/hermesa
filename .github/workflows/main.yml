          function boot(){fetch('/config',{headers:{'X-Token':tok}}).then(function(r){if(r.status===401){lsSet('jtok','');tok='';el('gate').style.display='flex';el('gerr').textContent='Saved token was rejected — enter your PANEL_TOKEN again.';return null;}return r.json();}).then(function(j){if(!j){return;}elTTS=!!j.tts;srvSTT=!!j.stt;el('engine').textContent='VOICE: '+(elTTS?'EDGE NEURAL':'BROWSER')+' · EARS: '+(srvSTT?'SERVER + BROWSER':'BROWSER ONLY');}).catch(function(){});}
