          fi

          # ── fix49 MID-RUN RECOVERY: if Camofox did NOT come up at boot,
          # keep retrying in the background instead of dooming the whole
          # 5.5h run to the Chrome fallback. On success it re-points .env +
          # hermes config at Camofox, kills the fallback Chrome and starts
          # the keepalive - the agent returns to anti-detect browsing
          # without a restart.
