            sleep 120
            [ -f /tmp/camofox_url ] && exit 0
            bash /tmp/camofox-restart.sh >/dev/null 2>&1
            sleep 40
            if curl -sf http://127.0.0.1:9377/health >/dev/null 2>&1 \
               || curl -sf http://127.0.0.1:9377/tabs >/dev/null 2>&1; then
              echo "http://127.0.0.1:9377" > /tmp/camofox_url
              if [ -f "$HERMES_HOME/.env" ] && ! grep -q '^CAMOFOX_URL=' "$HERMES_HOME/.env"; then
                echo "CAMOFOX_URL=http://127.0.0.1:9377" >> "$HERMES_HOME/.env"
                echo "CAMOFOX_USER_ID=boss-view" >> "$HERMES_HOME/.env"
              fi
              hermes config unset browser.cdp_url >/dev/null 2>&1 || true
              hermes config set browser.camofox.user_id boss-view >/dev/null 2>&1 || true
              pkill -f 'remote-debugging-port=9223' 2>/dev/null || true
              curl -s --max-time 30 -X POST http://127.0.0.1:9377/start -H 'Content-Type: application/json' -d '{}' >/dev/null 2>&1 || true
              CAMOFOX_STATE_FILE="$HERMES_HOME/data/camofox-profiles/boss-view-storage.json" nohup python3 /tmp/camofox-keepalive.py > /tmp/camofox-keepalive.log 2>&1 &
              echo "$(date) camofox recovered - switched agent back from Chrome fallback"
              exit 0
            fi
          done
          echo "$(date) camofox never came up - staying on Chrome fallback"
          EORECOV
            chmod +x /tmp/camofox-recover.sh
            nohup bash /tmp/camofox-recover.sh > /tmp/camofox-recover.log 2>&1 &
            echo "camofox recovery watchdog started (retries every ~2.5 min)"
          fi

          # ── LIVE DESKTOP VIEW: watch the agent work, from your browser ──
          # x11vnc mirrors display :99, noVNC serves a browser-based viewer on
