          def extract_reply(out):
              # `hermes chat` prints a full CLI dump (banner, "Query:", box art,
              # session stats). Only the text inside the Hermes reply box(es)
              # is the assistant actually speaking — extract just that.
              boxes = []
              cur = None
              for ln in out.split("\n"):
                  s = ln.strip()
                  if cur is None and s.startswith("\u256d") and "Hermes" in s:
                      cur = []
                  elif cur is not None and s.startswith("\u2570"):
                      boxes.append("\n".join(cur).strip())
                      cur = None
                  elif cur is not None:
                      if s.startswith("\u2502"):
                          s = s.strip("\u2502").strip()
                      cur.append(s)
              if cur:
                  boxes.append("\n".join(cur).strip())
              boxes = [b for b in boxes if b]
              if boxes:
                  return "\n\n".join(boxes)
              # Fallback (box style changed): drop known noise lines instead.
              noise = ("Query:", "Initializing", "Resume this session",
                       "hermes --resume", "Session:", "Duration:",
                       "Messages:", "Tokens:", "Cost:")
              box_chars = set("\u2500\u256d\u256e\u2570\u256f\u2502\u2550 \t")
              keep = []
              for ln in out.split("\n"):
                  s = ln.strip()
                  if not s or s.startswith(noise) or set(s) <= box_chars:
                      continue
                  keep.append(s)
              return "\n".join(keep).strip() or out

          def run_job(jid, text):
              env = dict(os.environ, NO_COLOR="1", TERM="dumb", DISPLAY=":99")
              try:
                  p = subprocess.run(
                      ["hermes", "chat", "-q", text, "--source", "tool"],
                      capture_output=True, text=True, timeout=1800, env=env)
                  out = ANSI.sub("", (p.stdout or "")).strip()
                  if not out:
                      out = ANSI.sub("", (p.stderr or "")).strip() or "(no output)"
                  JOBS[jid] = {"done": True, "reply": extract_reply(out)[-6000:]}
              except subprocess.TimeoutExpired:
                  JOBS[jid] = {"done": True, "reply": "Task timed out after 30 minutes, Boss."}
              except Exception as e:
                  JOBS[jid] = {"done": True, "reply": "Error: %s" % e}

          @app.route("/")
          def home():
              return Response(HTML, mimetype="text/html")

          @app.route("/config")
          def config():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              return jsonify(tts=bool(shutil.which("edge-tts")), stt=bool(GROQ), voice=cur_voice())

          @app.route("/tts", methods=["POST"])
          def tts_route():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              j = request.get_json(silent=True) or {}
              text = (j.get("text") or "").strip()
              if not text:
                  return jsonify(error="empty"), 400
              audio = edge_tts(text, j.get("voice"))
              if audio:
                  return Response(audio, mimetype="audio/mpeg")
              return jsonify(error="tts unavailable"), 503

          @app.route("/stt", methods=["POST"])
          def stt_route():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              blob = request.get_data()
              if not blob or len(blob) < 1000:
                  return jsonify(error="no audio received"), 400
              text = do_stt(blob, request.headers.get("Content-Type", "audio/webm"),
                            request.args.get("lang", "en-US"))
              if text:
                  return jsonify(text=text)
              return jsonify(error="transcription unavailable (add GROQ_API_KEY secret)"), 503

          @app.route("/upload", methods=["POST"])
          def upload():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify({"error": "bad token"}), 403
              name = request.headers.get("X-Filename", "file.bin")
              name = re.sub(r"[^A-Za-z0-9._-]", "_", name)[-80:] or "file.bin"
              blob = request.get_data()
              if not blob:
                  return jsonify({"error": "empty file"}), 400
              os.makedirs(UP_DIR, exist_ok=True)
              path = os.path.join(UP_DIR, uuid.uuid4().hex[:6] + "_" + name)
              with open(path, "wb") as f:
                  f.write(blob)
              return jsonify({"path": path, "size": len(blob)})

          @app.route("/file")
          def getfile():
              if request.args.get("token", "") != TOKEN and request.headers.get("X-Token", "") != TOKEN:
                  return jsonify({"error": "bad token"}), 403
              p = os.path.realpath(request.args.get("p", ""))
              if not p.startswith(os.path.realpath(WORK_DIR)) or not os.path.isfile(p):
                  return jsonify({"error": "not found"}), 404
              with open(p, "rb") as f:
                  data = f.read()
              mt = mimetypes.guess_type(p)[0] or "application/octet-stream"
              return Response(data, mimetype=mt, headers={"Content-Disposition": "attachment; filename=" + os.path.basename(p)})

          @app.route("/ask", methods=["POST"])
          def ask():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              text = ((request.get_json(silent=True) or {}).get("text") or "").strip()
              if not text:
                  return jsonify(error="empty command"), 400
              jid = uuid.uuid4().hex
              JOBS[jid] = {"done": False}
              threading.Thread(target=run_job, args=(jid, text), daemon=True).start()
              return jsonify(job=jid)

          @app.route("/poll")
          def poll():
              if request.headers.get("X-Token", "") != TOKEN:
                  return jsonify(error="bad token"), 401
              j = JOBS.get(request.args.get("id", ""))
              if not j:
                  return jsonify(error="unknown job"), 404
              return jsonify(**j)

          app.run(host="0.0.0.0", port=7777, threaded=True)
