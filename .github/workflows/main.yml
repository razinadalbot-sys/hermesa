name: Hermes Agent — Telegram + Slack + NVIDIA/Mistral Pool

on:
  workflow_dispatch:
    inputs:
      run_hours:
        description: "Run duration in HOURS (e.g. 0.5, 1, 3). Leave empty for the full 5.5h"
        required: false
        default: ""

# actions:write lets the last step dispatch the NEXT run (24/7 chaining)
# using the built-in GITHUB_TOKEN - no extra secret needed.
permissions:
  contents: read
  actions: write

concurrency:
  group: hermes-agent
  cancel-in-progress: false

env:
  RUN_MINUTES: 330
  # optional manual-run override, raw hours string (may be empty)
  RUN_HOURS_INPUT: ${{ github.event.inputs.run_hours }}
  HERMES_HOME: /home/runner/.hermes
  DATA_REPO: jahid12525/harmesprivatestorage

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ── 1. Pull persisted data from private repo ──
      - name: Pull data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          date +%s > /tmp/job_start
          mkdir -p "$HERMES_HOME"
          git clone --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/data || true
          # ── RESTORE FROM BACKUP BRANCH TOO ──
          # 30-min backups go to the `backup` branch; the final push goes to
          # `main`. If the previous run crashed or was cancelled, `backup` is
          # NEWER than `main` — overlay it so nothing since the last final
          # push is lost.
          git clone --depth 1 -b backup "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/databk 2>/dev/null || true
          if [ -d /tmp/databk/.git ] && [ -d /tmp/data/.git ]; then
            MAIN_TS=$(git -C /tmp/data log -1 --format=%ct 2>/dev/null || echo 0)
            BK_TS=$(git -C /tmp/databk log -1 --format=%ct 2>/dev/null || echo 0)
            if [ "$BK_TS" -gt "$MAIN_TS" ]; then
              echo "backup branch is newer — overlaying it onto main restore"
              rsync -a --exclude='.git' /tmp/databk/ /tmp/data/ || true
            fi
          fi
          # ── `hot` branch: 5-min critical saves + cancel-time emergency save.
          # Almost always the freshest copy of skills / brain / tasks, so it is
          # overlaid last when it is newer than what we already restored.
          git clone --depth 1 -b hot "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/datahot 2>/dev/null || true
          if [ -d /tmp/datahot/.git ] && [ -d /tmp/data/.git ]; then
            CUR_TS=$(git -C /tmp/data log -1 --format=%ct 2>/dev/null || echo 0)
            [ -d /tmp/databk/.git ] && BK2=$(git -C /tmp/databk log -1 --format=%ct 2>/dev/null || echo 0) || BK2=0
            [ "$BK2" -gt "$CUR_TS" ] && CUR_TS=$BK2
            HOT_TS=$(git -C /tmp/datahot log -1 --format=%ct 2>/dev/null || echo 0)
            if [ "$HOT_TS" -ge "$CUR_TS" ]; then
              echo "hot branch is freshest — overlaying skills/brain/tasks"
              rsync -a --exclude='.git' /tmp/datahot/ /tmp/data/ || true
            fi
          elif [ -d /tmp/datahot/.git ]; then
            mkdir -p /tmp/data
            rsync -a --exclude='.git' /tmp/datahot/ /tmp/data/ || true
          fi
          if [ -d /tmp/data ]; then
            rm -f /tmp/data/.env
            rsync -a --exclude='.git' /tmp/data/ "$HERMES_HOME/" || true
            find "$HERMES_HOME" -name "*.gh-chunk.000" | while read -r first; do
              base="${first%.gh-chunk.000}"
              cat "${base}".gh-chunk.* > "$base"
              rm -f "${base}".gh-chunk.*
              echo "Reassembled: $base"
            done
          fi

          # ── Put restored OUTSIDE-tree Hermes state back in place ──
          # The backup loop mirrors ~/.config/hermes*, ~/.local/share/hermes*
          # and ~/.local/state/hermes* into ~/.hermes/xdg-mirror/. Restore them
          # to their real homes so skills/brain/config are live again.
          for pair in "config:.config" "share:.local/share" "state:.local/state"; do
            srcd="$HERMES_HOME/xdg-mirror/${pair%%:*}"
            dstd="$HOME/${pair##*:}"
            if [ -d "$srcd" ] && [ -n "$(ls -A "$srcd" 2>/dev/null)" ]; then
              mkdir -p "$dstd"
              rsync -a "$srcd/" "$dstd/"
              echo "Restored $dstd from backup"
            fi
          done

      # ── 1b. Preinstalled environment cache ──
      # The runner VM is WIPED after every run, so nothing can be truly
      # "pre-installed". This cache is the next best thing: a snapshot of
      # installed Hermes + all pip wheels + the Camoufox browser binary,
      # restored in seconds at the start of each run instead of being
      # re-downloaded. The first run builds it; every later run refreshes
      # it automatically (rolling key).
      - name: Restore preinstalled Hermes environment (cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.cache/pip
            ~/.cache/camoufox
          key: hermes-env-v1-${{ github.run_id }}
          restore-keys: |
            hermes-env-v1-

      # ── 2. Install Hermes Agent (skipped when restored from cache) ──
      - name: Install Hermes Agent
        run: |
          # Stash any user state sitting in the agent dir BEFORE wiping it
          # (belt-and-braces: normally agent-state/ already holds a copy).
          KEEP=/tmp/hermes-keep; rm -rf "$KEEP"; mkdir -p "$KEEP"
          if [ -d "$HERMES_HOME/hermes-agent" ]; then
            for d in skills skill brain brains memory memories tasks task knowledge notes sessions session prompts plugins agents config configs data db; do
              [ -e "$HERMES_HOME/hermes-agent/$d" ] && cp -a "$HERMES_HOME/hermes-agent/$d" "$KEEP/" || true
            done
          fi
          rm -rf "$HERMES_HOME/hermes-agent"
          # ~/.local/bin/hermes is only a SHIM that execs
          # $HERMES_HOME/hermes-agent/venv/bin/python. The Actions cache
          # restores the shim but NOT the venv (we wiped it just above),
          # so "shim exists => skip install" left a launcher pointing at
          # nothing: every hermes call died with "No such file or
          # directory" and exit 127. Install whenever the venv is gone.
          if [ -x "$HOME/.local/bin/hermes" ] && [ -x "$HERMES_HOME/hermes-agent/venv/bin/python" ]; then
            echo "Hermes launcher + venv both present — skipping download/install"
          else
            echo "Installing Hermes (venv missing after wipe / first run)..."
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          fi
          # ── KEEP HERMES CURRENT: self-update on EVERY run ──
          # Cache restores can be days old; update to the latest release
          # before anything is configured. Time-boxed and non-fatal: a
          # flaky network must never kill the run, and the sanity check
          # below reinstalls cleanly if an update leaves things broken.
          echo "Running hermes update..."
          if ! timeout 600 "$HOME/.local/bin/hermes" update; then
            echo "::warning::hermes update failed or timed out - forcing a clean reinstall so we never run a mixed-version tree"
            rm -rf "$HERMES_HOME/hermes-agent"
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          fi
          # ── MERGE BACKED-UP USER STATE into the fresh agent dir ──
          # skills / brain / tasks / memory added in earlier sessions come back
          # from ~/.hermes/agent-state (pulled from the privatestorage repo).
          if [ -d "$HERMES_HOME/agent-state" ] && [ -n "$(ls -A "$HERMES_HOME/agent-state" 2>/dev/null)" ]; then
            mkdir -p "$HERMES_HOME/hermes-agent"
            rsync -a --ignore-existing --exclude='venv' --exclude='.venv' "$HERMES_HOME/agent-state/" "$HERMES_HOME/hermes-agent/"
            echo "Restored agent state: $(ls "$HERMES_HOME/agent-state" | tr '\n' ' ')"
          fi
          if [ -n "$(ls -A "$KEEP" 2>/dev/null)" ]; then
            mkdir -p "$HERMES_HOME/hermes-agent"
            rsync -a --ignore-existing --exclude='venv' --exclude='.venv' "$KEEP/" "$HERMES_HOME/hermes-agent/"
          fi
          # ── SANITY CHECK: hermes must actually be runnable ──
          # Catch a broken install HERE with a clear message (and one
          # self-heal attempt) instead of exit 127 five steps later.
          if [ ! -x "$HERMES_HOME/hermes-agent/venv/bin/python" ] || ! "$HOME/.local/bin/hermes" --help >/dev/null 2>&1; then
            echo "Hermes launcher broken — forcing one clean reinstall"
            rm -rf "$HERMES_HOME/hermes-agent"
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
            if [ -d "$HERMES_HOME/agent-state" ] && [ -n "$(ls -A "$HERMES_HOME/agent-state" 2>/dev/null)" ]; then
              mkdir -p "$HERMES_HOME/hermes-agent"
              rsync -a --ignore-existing --exclude='venv' --exclude='.venv' "$HERMES_HOME/agent-state/" "$HERMES_HOME/hermes-agent/"
            fi
            if [ -n "$(ls -A "$KEEP" 2>/dev/null)" ]; then
              mkdir -p "$HERMES_HOME/hermes-agent"
              rsync -a --ignore-existing --exclude='venv' --exclude='.venv' "$KEEP/" "$HERMES_HOME/hermes-agent/"
            fi
          fi
          if [ ! -x "$HERMES_HOME/hermes-agent/venv/bin/python" ] || ! "$HOME/.local/bin/hermes" --help >/dev/null 2>&1; then
            echo "::error::Hermes install is broken (venv python missing or launcher fails). Failing fast so the chain does not spam failed runs."
            exit 1
          fi
          # DEEP IMPORT CHECK: a stale code dir restored from backup can mix
          # versions (old tools/registry.py + new model_tools.py) - every chat
          # message then dies with ImportError. Catch and heal it HERE.
          if ! (cd "$HERMES_HOME/hermes-agent" && timeout 120 ./venv/bin/python -c "import model_tools" >/dev/null 2>/tmp/impcheck.err); then
            echo "::warning::Agent code failed the import check - forcing one clean reinstall. $(tail -c 200 /tmp/impcheck.err 2>/dev/null || true)"
            rm -rf "$HERMES_HOME/hermes-agent"
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
            if [ -d "$HERMES_HOME/agent-state" ] && [ -n "$(ls -A "$HERMES_HOME/agent-state" 2>/dev/null)" ]; then
              rsync -a --ignore-existing --exclude='venv' --exclude='.venv' "$HERMES_HOME/agent-state/" "$HERMES_HOME/hermes-agent/"
            fi
            if [ -n "$(ls -A "$KEEP" 2>/dev/null)" ]; then
              rsync -a --ignore-existing --exclude='venv' --exclude='.venv' "$KEEP/" "$HERMES_HOME/hermes-agent/"
            fi
            if ! (cd "$HERMES_HOME/hermes-agent" && timeout 120 ./venv/bin/python -c "import model_tools" >/dev/null 2>&1); then
              echo "::error::Agent code still fails to import after a clean reinstall. Failing fast."
              exit 1
            fi
          fi
          echo "Hermes launcher verified OK"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── 3. Start SearXNG (free web search) ──
      - name: Start SearXNG
        run: |
          mkdir -p /tmp/searxng
          cat > /tmp/searxng/settings.yml <<'EOF'
          use_default_settings: true
          server:
            secret_key: "hermes-searxng-secret"
            limiter: false
          search:
            formats:
              - html
              - json
          EOF
          docker run -d --name searxng -p 8080:8080 \
            -v /tmp/searxng:/etc/searxng \
            searxng/searxng:latest
          echo "Waiting for SearXNG..."
          for i in $(seq 1 30); do
            if curl -s "http://localhost:8080/search?q=test&format=json" | grep -q results; then
              echo "SearXNG is ready"; exit 0
            fi
            sleep 2
          done
          echo "SearXNG failed to start"; exit 1

      # ── 4. Start Camoufox (stealth browser, NON-headless via virtual display) ──
      - name: Start Camoufox
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          # Shared virtual display :99 — the browser AND all the agent's GUI
          # work render here, so the LIVE VIEW (below) shows everything.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11vnc novnc websockify fluxbox xterm pcmanfm mousepad xdotool wmctrl scrot imagemagick tesseract-ocr python3-tk
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb99.log 2>&1 &
          sleep 2
          export DISPLAY=:99

          # A bare Xvfb display renders PURE BLACK when idle — looks broken in
          # the live view. Fluxbox = real desktop (background, taskbar, window
          # titlebars), and the status xterm keeps something moving on screen
          # at all times so you can SEE the machine is alive.
          # Right-click launcher menu for manual work (file manager, terminal,
          # editor). Fluxbox reads it at startup, so write it BEFORE starting.
          mkdir -p "$HOME/.fluxbox"
          cat > "$HOME/.fluxbox/menu" <<'EOF'
          [begin] (Hermes Desktop)
            [exec] (File Manager) {pcmanfm}
            [exec] (Terminal) {xterm -fg white -bg black -geometry 110x28}
            [exec] (Text Editor) {mousepad}
            [restart] (Restart Fluxbox)
          [end]
          EOF
          fluxbox > /tmp/fluxbox.log 2>&1 &
          sleep 1
          cat > /tmp/status.sh <<'EOF'
          #!/bin/bash
          while true; do
            clear
            echo "============================================"
            echo "  HERMES AGENT — LIVE DESKTOP  (display :99)"
            echo "============================================"
            date
            echo
            echo "Running services:"
            pgrep -a -f 'hermes|camoufox|litellm|searxng|cloudflared' | cut -c1-105
            echo
            echo "NOTE: the Camofox browser is NOT on this desktop!"
            echo "Open the 'Camofox browser' link from the Telegram start"
            echo "message to watch/control it (noVNC :6081, same password)."
            echo "Here you only see: fallback Chrome + your own script windows."
            sleep 2
          done
          EOF
          chmod +x /tmp/status.sh
          xterm -geometry 130x20+30+30 -fg green -bg black -T "Hermes Agent — status" -e /tmp/status.sh &

          # Chrome is NOT started here by default anymore. Camofox is the
          # browser; a visible Chrome launches ONLY as a fallback below, and
          # ONLY if the Camofox server fails - so on a normal run NO browser
          # window opens on the desktop by itself.
          pip install -U "camoufox[geoip]" pyvirtualdisplay pyautogui
          # fetch skips the ~200MB browser download when restored from cache
          python3 -m camoufox fetch
          mkdir -p "$HERMES_HOME/browser-profile"
          nohup python3 -c "
          from camoufox.server import launch_server
          launch_server(
              headless=False,  # real headed browser on the shared :99 display
              port=9222, ws_path='hermes',
              persistent_context=True,
              user_data_dir='/home/runner/.hermes/browser-profile',
              os='windows',
          )
          " > /tmp/camoufox.log 2>&1 &
          echo "Waiting for Camoufox (headed/virtual)..."
          for i in $(seq 1 30); do
            if grep -q 'ws://' /tmp/camoufox.log 2>/dev/null; then
              echo 'Camoufox ready (non-headless, virtual display)'; break
            fi
            sleep 3
          done
          cat /tmp/camoufox.log || true

          # ── CAMOFOX SERVER: anti-detect backend for the BUILT-IN browser
          # tools. Hermes routes ALL browser_* tools through it when
          # CAMOFOX_URL is set: Camoufox = Firefox fork with C++-level
          # fingerprint spoofing, so sites cannot detect/track agentic work
          # (no CDP automation beacons like Chrome).
          # VISIBLE VIA ITS OWN VNC: the camofox server subprocess STRIPS
          # DISPLAY (lib/config.js serverEnv), so the browser can never render
          # on our :99 desktop - camoufox-js spawns its OWN private Xvfb.
          # Official fix = bundled VNC plugin (ENABLE_VNC=1): it resizes that
          # private Xvfb to 1920x1080, attaches x11vnc on :5901 and serves
          # noVNC on :6081 (our own desktop owns :5900/:6080). Log into your
          # accounts THERE - the agent works in that SAME browser and
          # inherits your logged-in sessions.
          # LAZY LAUNCH (tamed by fix44/46): engine warm-starts at boot, a
          # placeholder tab keeps a window rendered, and idle/session/tab
          # timeouts are raised to 24h so nothing dies between uses.
          # PERSISTENT LOGINS (fix47): the server NEVER writes cookies to
          # disk by itself (contexts are in-memory), so the keepalive
          # exports boss-view cookies every 2 min (GET /sessions/boss-view/
          # storage_state) into ~/.hermes/data/camofox-profiles - pushed to
          # the data repo by the backup loop - and re-imports them (POST
          # /sessions/boss-view/cookies) after every engine start/restart,
          # so logins survive runs AND mid-run restarts.
          # Fail-soft: without it, Configure falls back to visible Chrome.
          git clone --depth 1 https://github.com/jo-inc/camofox-browser /tmp/camofox-browser 2>/dev/null || true
          if [ -d /tmp/camofox-browser ]; then
            mkdir -p "$HERMES_HOME/data/camofox-profiles"
            ( cd /tmp/camofox-browser && timeout 600 npm install > /tmp/camofox-npm.log 2>&1 ) \
              || { echo "npm install failed - retrying once"; \
                   ( cd /tmp/camofox-browser && timeout 600 npm install >> /tmp/camofox-npm.log 2>&1 ) \
                   || echo "::warning::camofox-browser npm install failed twice - see /tmp/camofox-npm.log"; }
            # fix49: ONE canonical, idempotent launcher for the :9377 server.
            # diagnostic: print the restart/idle knobs THIS clone actually
            # reads, so a silent upstream rename shows up in the run log
            grep -n "RESTART_THRESHOLD\|IDLE_TIMEOUT\|INACTIVITY" /tmp/camofox-browser/lib/config.js 2>/dev/null | head -20 || true
            # Reused by this boot start, the mid-run recovery watchdog below
            # and the agent itself (AGENTS.md tells it to run this script
            # instead of claiming "camoufox is not running").
            cat > /tmp/camofox-restart.sh <<EOSTART
          #!/bin/bash
          if curl -sf http://127.0.0.1:9377/health >/dev/null 2>&1 \\
             || curl -sf http://127.0.0.1:9377/tabs >/dev/null 2>&1; then
            echo "camofox already up on :9377"; exit 0
          fi
          pkill -f "node.*camofox-browser" 2>/dev/null; sleep 2
          cd /tmp/camofox-browser || exit 1
          # fix50: NEVER stop/restart the browser mid-run:
          #  - BROWSER_IDLE_TIMEOUT_MS=0 -> idle kill fully OFF (0 = never, per docs)
          #  - session/tab inactivity raised to 7 days (longer than any run)
          #  - memory-pressure restart thresholds set unreachably high
          #  - MAX_OLD_SPACE_SIZE=2048 -> Node heap cannot OOM while VNC streams
          CAMOFOX_PORT=9377 \\
            CAMOFOX_BIND_HOST=127.0.0.1 \\
            CAMOFOX_PROFILE_DIR="$HERMES_HOME/data/camofox-profiles" \\
            ENABLE_VNC=1 VNC_RESOLUTION=1920x1080 \\
            VNC_PASSWORD="${PANEL_TOKEN:-hermes99}" \\
            VNC_PORT=5901 NOVNC_PORT=6081 \\
            SESSION_TIMEOUT_MS=604800000 TAB_INACTIVITY_MS=604800000 \\
            BROWSER_IDLE_TIMEOUT_MS=0 \\
            NATIVE_MEM_RESTART_THRESHOLD_MB=999999 \\
            BROWSER_RSS_RESTART_THRESHOLD_MB=999999 \\
            MAX_OLD_SPACE_SIZE=2048 \\
            nohup npm start >> /tmp/camofox-srv.log 2>&1 &
          echo "camofox (re)start issued on :9377"
          EOSTART
            chmod +x /tmp/camofox-restart.sh
            bash /tmp/camofox-restart.sh
            # first boot can be slow (big npm tree + engine warm-up):
            # wait up to 4 minutes, not 2, before declaring it down.
            for i in $(seq 1 80); do
              if curl -sf http://127.0.0.1:9377/health > /dev/null 2>&1 \
                 || curl -sf http://127.0.0.1:9377/tabs > /dev/null 2>&1; then
                echo "http://127.0.0.1:9377" > /tmp/camofox_url
                echo "Camofox ready on :9377 - browser visible on its OWN noVNC :6081 (warm-started at boot)"
                break
              fi
              sleep 3
            done
            if [ ! -f /tmp/camofox_url ]; then
              echo "── Camofox did NOT come up - dumping logs for debugging ──"
              tail -n 40 /tmp/camofox-npm.log 2>/dev/null || true
              tail -n 60 /tmp/camofox-srv.log 2>/dev/null || true
            fi
          fi
          # fix43: WARM START the browser engine NOW + keep it alive, so the
          # noVNC view on :6081 is actually connectable from minute 1.
          # fix46: loadConfig() reads process.env DIRECTLY when npm start
          # runs the server (the serverEnv allowlist only filters env when
          # the OpenClaw plugin spawns it), so the launch line raises
          # session/tab/idle timeouts to 24h and the auto-restart
          # thresholds (native-mem 300MB -> 2GB, browser RSS 1.5GB -> 4GB)
          # that were closing ALL windows mid-login (the Facebook vanish).
          # The keepalive (python) ONLY revives the engine if it is truly
          # down, and opens ONE placeholder tab (userId boss-view) a single
          # time so a window is ALWAYS rendered (no black screen - the
          # display has no window manager so no-window = black). It NEVER
          # refreshes or reloads anything (fix51): timers are fully off, so
          # the browser stays exactly as it was left.
          # fix47: it also exports boss-view cookies to the data-repo dir
          # every cycle and re-imports them into fresh sessions, so logins
          # survive engine restarts AND whole machine runs.
          cat > /tmp/camofox-keepalive.py <<'PYKA'
          #!/usr/bin/env python3
          # Keep the Camofox engine AND one placeholder tab alive so the
          # noVNC view always shows a browser window (no black screen) and
          # x11vnc never dies from the 5-min idle shutdown (no disconnects).
          import json, os, subprocess, time, urllib.request

          BASE = "http://127.0.0.1:9377"
          STATE = (os.environ.get("CAMOFOX_STATE_FILE") or
                   "/home/runner/.hermes/data/camofox-profiles/boss-view-storage.json")
          IDLE_PAGE = ("data:text/html,<body style='background:%23111;color:%23ddd;"
                       "font-family:sans-serif;display:flex;align-items:center;"
                       "justify-content:center;height:100vh;text-align:center'>"
                       "<div><h1>&%23128058; Camofox is awake</h1>"
                       "<p>This placeholder tab keeps the browser alive.<br>"
                       "The agent browses in tabs of this SAME window, with your logins.<br>"
                       "To log in yourself: use the agent's window, or open a new tab"
                       " with the %2B button - do NOT use this tab.</p></div></body>")

          def req(method, path, body=None, timeout=20):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(BASE + path, data=data, method=method,
                                         headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(r, timeout=timeout) as f:
                  raw = f.read().decode() or "{}"
              try:
                  return json.loads(raw)
              except Exception:
                  return {}

          def restore_cookies():
              # Fresh engine/session starts with ZERO cookies - re-import the
              # saved logins so the user never has to log in again.
              try:
                  with open(STATE) as f:
                      cookies = (json.load(f) or {}).get("cookies") or []
              except Exception:
                  return
              for i in range(0, len(cookies), 400):
                  try:
                      req("POST", "/sessions/boss-view/cookies",
                          {"cookies": cookies[i:i + 400]}, timeout=30)
                  except Exception:
                      pass

          def save_cookies():
              # Export boss-view cookies+localStorage into the data-repo dir;
              # the backup loop pushes it, so logins survive machine runs.
              try:
                  st = req("GET", "/sessions/boss-view/storage_state", timeout=30)
              except Exception:
                  return
              if not isinstance(st, dict) or not st.get("cookies"):
                  return
              try:
                  os.makedirs(os.path.dirname(STATE), exist_ok=True)
                  tmp = STATE + ".tmp"
                  with open(tmp, "w") as f:
                      json.dump(st, f)
                  os.replace(tmp, STATE)
              except Exception:
                  pass

          def engine_up():
              # Trust the same /tabs health check the restart script uses.
              # A mis-shaped /vnc/status reply must NEVER trigger /start
              # spam (that showed up as "the browser restarts every minute").
              try:
                  req("GET", "/tabs", timeout=8)
                  return True
              except Exception:
                  pass
              try:
                  st = req("GET", "/vnc/status", timeout=8)
                  return bool(st.get("running") or st.get("active") or st.get("up"))
              except Exception:
                  return False

          tab = None
          while True:
              try:
                  if not engine_up():
                      # engine (or whole server) truly down -> revive it,
                      # then warm-start the browser. NEVER restart when up.
                      try:
                          subprocess.call(["bash", "/tmp/camofox-restart.sh"], timeout=180)
                      except Exception:
                          pass
                      try:
                          req("POST", "/start", {}, timeout=40)
                      except Exception:
                          pass
