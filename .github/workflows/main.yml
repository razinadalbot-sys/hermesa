                  # placeholder tab is created ONCE (below) and never touched
                  # again; every page stays EXACTLY as you or the agent left it.
                  if not tab:
                      for target in (IDLE_PAGE, "about:blank"):
                          try:
                              resp = req("POST", "/tabs", {"userId": "boss-view",
                                         "sessionKey": "view", "url": target}, timeout=60)
                              tab = (resp.get("id") or resp.get("tabId") or
                                     (resp.get("tab") or {}).get("id"))
                              if tab:
                                  break
                          except Exception:
                              continue
                      if tab:
                          restore_cookies()
                  save_cookies()
              except Exception:
                  pass
              time.sleep(60)
          PYKA
          if [ -f /tmp/camofox_url ]; then
            curl -s --max-time 30 -X POST http://127.0.0.1:9377/start \
              -H 'Content-Type: application/json' -d '{}' \
              > /tmp/camofox-warmstart.log 2>&1 || true
            CAMOFOX_STATE_FILE="$HERMES_HOME/data/camofox-profiles/boss-view-storage.json" nohup python3 /tmp/camofox-keepalive.py > /tmp/camofox-keepalive.log 2>&1 &
            echo "Camofox warm start sent; keepalive keeps engine + placeholder tab alive (no more idle shutdown)"
          fi
          [ -f /tmp/camofox_url ] || echo "::warning::Camofox not reachable - built-in tools fall back to visible Chrome"
          # FALLBACK ONLY: launch a visible Chrome (with CDP) if and only if
          # the Camofox server did NOT come up, so the built-in tools still
          # have a browser to drive. Otherwise NO Chrome opens.
