           </div>
          </div>
          <div id="vmask"><div id="vpanel"><div id="vhead"><span>VOICE MODEL · EDGE NEURAL</span><button class="icon" id="vclose" title="Close">&#10005;</button></div><div id="vlist"></div><div id="vfoot">Tap &#9654; to hear a preview · tap a row to select · saved on this device</div></div></div>
          <div id="gate"><div id="gatebox"><h2>ACCESS TOKEN</h2><p id="gatep">Enter your PANEL_TOKEN secret to engage</p><input id="tok" type="password" placeholder="PANEL_TOKEN"><br><button class="act" id="tokb">ENGAGE</button></div></div>
          <script>
          function el(id){return document.getElementById(id);}
          var tok=localStorage.getItem('jtok')||'';
