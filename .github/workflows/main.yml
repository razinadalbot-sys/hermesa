            #empty .d{max-width:260px}
            #live{font-size:13px;min-height:18px}
            /* composer: 16px input stops iOS zoom-on-focus; 46px touch targets */
            #inrow{gap:7px}
            #txt{font-size:16px;padding:12px 13px}
            button.act{min-height:46px;padding:0 15px}
            #attach{min-width:46px;font-size:17px}
            .icon{width:44px;height:44px;font-size:15px}
            .chip{padding:7px 11px;font-size:11.5px}
            .chip button{font-size:16px;padding:2px 5px}
            /* playback bar: drop the label, keep track + big controls */
            #pbar{gap:8px;padding:8px 10px}
            #pbar .lbl{display:none}
            /* voice model panel becomes a bottom sheet */
            #vmask{align-items:flex-end}
            #vpanel{width:100%;max-width:none;max-height:80dvh;border-radius:18px 18px 0 0;border-bottom:none}
            #vhead{padding:14px 16px}
            .vrow{padding:12px;gap:10px}
            .vrow .prev{width:44px;height:44px}
            #vfoot{padding:11px 16px;padding-bottom:max(11px,env(safe-area-inset-bottom))}
            /* token gate fits small screens */
            #gatebox{margin:0 16px;padding:26px 22px;width:100%;max-width:360px}
            #gatebox input,#gatebox button{width:100%}
          }
          .outs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
          .out{border:1px solid rgba(0,229,255,.28);border-radius:10px;overflow:hidden;background:rgba(0,20,30,.45);max-width:100%}
          .out img,.out video{display:block;max-width:340px;max-height:260px;width:auto;cursor:zoom-in;background:#000}
          .out audio{display:block;width:300px;max-width:100%;margin:8px}
          .obar{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:11px;letter-spacing:.06em}
          .onm{flex:1;color:#cfefff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
          .osz{color:#5c8ea3}
          .odl{color:#00e5ff;text-decoration:none;border:1px solid rgba(0,229,255,.45);border-radius:6px;padding:3px 8px;font-size:10px}
          .odl:hover{background:rgba(0,229,255,.14)}
          @media(max-width:680px){.out img,.out video{max-width:100%;max-height:200px}.outs{gap:8px}}
          </style></head>
          <body class="idle">
