          var Q=[],QI=0,QURL=[],QSEQ=0,QDONE=false;
          var pushSince=0;
          var files=[];
          var hist=[];

          var VOICES=[],VDEF={},lastNote='',stStatus='',stErr='',PREFS={};
          function savePrefs(o){for(var k in o){PREFS[k]=o[k];}
            fetch('/prefs',{method:'POST',headers:{'Content-Type':'application/json','X-Token':tok},body:JSON.stringify(o)}).catch(function(){});}
          function applyConfig(j){elTTS=!!j.tts;srvSTT=!!j.stt;VOICES=j.voices||[];VDEF=j.defaults||{};stStatus=j.st||'';stErr=j.sterr||'';
            PREFS=j.prefs||{};
            if(PREFS.voice){localStorage.setItem('jvoice',PREFS.voice);}
            if(PREFS.lang){el('lang').value=PREFS.lang;}
            if(typeof PREFS.speak==='boolean'){el('voice').checked=PREFS.speak;}
            if(typeof PREFS.autoEar==='boolean'){el('auto').checked=PREFS.autoEar;}el('engine').textContent='VOICE '+(elTTS?'EDGE NEURAL · FREE':'BROWSER')+' · EARS '+(srvSTT?'SERVER+BROWSER':'BROWSER');if(j.st==='loading'){stPoll(0);}}
          function boot(){fetch('/config',{headers:{'X-Token':tok}}).then(function(r){if(r.status===401){lockOut();return null;}return r.json();}).then(function(j){if(j){applyConfig(j);}}).catch(function(){});}
          function stPoll(n){if(n>20){return;}setTimeout(function(){fetch('/config',{headers:{'X-Token':tok}}).then(function(r){return r.json();}).then(function(j){if(j.voices&&j.voices.length>VOICES.length){VOICES=j.voices;toast('Supertonic on-device voices are ready — open the voice panel to try them.',1);}else if(j.st==='loading'){stPoll(n+1);}}).catch(function(){});},20000);}
          function gateMsg(m,bad){var p=el('gatep');p.textContent=m;p.style.color=bad?'#fda4af':'';}
          function lockOut(m){localStorage.removeItem('jtok');tok='';VOICES=[];el('gate').style.display='';el('tok').value='';gateMsg(m||'Token rejected \u2014 re-enter your PANEL_TOKEN secret',true);}
          function tryToken(t,fromGate){
            el('tokb').disabled=true;if(fromGate){gateMsg('Verifying\u2026');}
            return fetch('/config',{headers:{'X-Token':t}}).then(function(r){
              if(r.status===401){throw new Error('bad');}
              return r.json();
            }).then(function(j){
              el('tokb').disabled=false;tok=t;localStorage.setItem('jtok',t);el('gate').style.display='none';applyConfig(j);
            }).catch(function(e){
              el('tokb').disabled=false;
              if(e&&e.message==='bad'){lockOut('Wrong token \u2014 use the exact PANEL_TOKEN secret from your repo');}
              else{gateMsg('Cannot reach the agent \u2014 is the run still alive? Retry.',true);el('gate').style.display='';}
            });
          }
          if(tok){tryToken(tok,false);}
          el('tokb').onclick=function(){var v=el('tok').value.trim();if(!v){gateMsg('Enter your PANEL_TOKEN secret',true);return;}tryToken(v,true);};
          el('tok').addEventListener('keydown',function(e){if(e.key==='Enter'){el('tokb').onclick();}});

          function toast(m,info){var t=el('toast');t.className=info?'info':'';t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(function(){t.style.display='none';},6000);}
          function setState(s,l){document.body.className=s;el('stateTxt').textContent=l;}
          function fmtSz(n){if(n>1048576){return (n/1048576).toFixed(1)+' MB';}if(n>1024){return Math.round(n/1024)+' KB';}return n+' B';}
          function addMsg(who,text,att,outs){var e=el('empty');if(e){e.remove();}
            var d=document.createElement('div');d.className='msg '+who;
            var m=document.createElement('div');m.className='meta';var b=document.createElement('b');b.textContent=(who==='YOU'?'YOU':'AGENT');var tm=document.createElement('span');tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            if(who==='YOU'){m.appendChild(tm);m.appendChild(b);}else{m.appendChild(b);m.appendChild(tm);}
            var bd=document.createElement('div');bd.className='body';var p=document.createElement('pre');p.textContent=text;bd.appendChild(p);
            if(att&&att.length){var a=document.createElement('div');a.className='att';for(var i=0;i<att.length;i++){var s=document.createElement('span');s.textContent='\u{1F4CE} '+att[i];a.appendChild(s);}bd.appendChild(a);}
            if(outs&&outs.length){bd.appendChild(renderOuts(outs));}
            d.appendChild(m);d.appendChild(bd);el('log').appendChild(d);el('log').scrollTop=el('log').scrollHeight;
            return d;}
          function drainPushed(j){
            if(j&&j.now){pushSince=j.now;}
            if(!j||!j.pushed||!j.pushed.length){return;}
            j.pushed.forEach(function(x){
              addMsg('AGENT',x.text||'Here you go, Boss.',null,x.files);
            });
          }
          function fileURL(f,dl){return f.url+'&t='+encodeURIComponent(tok)+(dl?'&dl=1':'');}
          function renderOuts(outs){
            var w=document.createElement('div');w.className='outs';
            outs.forEach(function(f){
              var c=document.createElement('div');c.className='out '+f.kind;
              if(f.kind==='image'){
                var im=document.createElement('img');im.src=fileURL(f,0);im.alt=f.name;im.loading='lazy';
                im.onclick=function(){window.open(fileURL(f,0),'_blank');};
                im.onerror=function(){im.remove();};
                c.appendChild(im);
              }else if(f.kind==='video'){
                var vd=document.createElement('video');vd.src=fileURL(f,0);vd.controls=true;vd.preload='metadata';vd.playsInline=true;c.appendChild(vd);
              }else if(f.kind==='audio'){
                var au=document.createElement('audio');au.src=fileURL(f,0);au.controls=true;au.preload='metadata';c.appendChild(au);
              }
              var bar=document.createElement('div');bar.className='obar';
              var nm=document.createElement('span');nm.className='onm';nm.textContent=f.name;bar.appendChild(nm);
              var sz=document.createElement('span');sz.className='osz';sz.textContent=fmtSz(f.size);bar.appendChild(sz);
              var dl=document.createElement('a');dl.className='odl';dl.href=fileURL(f,1);dl.textContent='DOWNLOAD';
              dl.setAttribute('download',f.name);bar.appendChild(dl);
              c.appendChild(bar);w.appendChild(c);
            });
            return w;}
          function clean(t){return t.replace(/```[\s\S]*?```/g,' code block ').replace(/(?:~|\.?\/)[^\s"'`)\]<>,;]+\.[A-Za-z0-9]{1,5}/g,' the file ').replace(/https?:\S+/g,' link ').replace(/[*_#`>|]/g,' ').replace(/\s+/g,' ').trim();}


          /* ---------- voice model panel (free Microsoft Edge neural voices) ---------- */
          var pvA=null,pvBtn=null;
          function curVoice(){var v=localStorage.getItem('jvoice')||PREFS.voice;if(v){return v;}return VDEF[el('lang').value]||'en-US-GuyNeural';}
          function stopPreview(){if(pvA){try{pvA.pause();}catch(e){}pvA=null;}if(pvBtn){pvBtn.innerHTML='&#9654;';pvBtn=null;}}
          function buildVoices(){
            var L=el('vlist');L.innerHTML='';var sel=curVoice(),lastG='';
            if(stStatus==='loading'){var s1=document.createElement('div');s1.className='vgroup';s1.textContent='SUPERTONIC 3 \u00b7 LOADING\u2026 VOICES APPEAR WHEN READY';L.appendChild(s1);}
            else if(stStatus==='error'||stStatus==='missing'){var s2=document.createElement('div');s2.className='vgroup';s2.textContent='SUPERTONIC 3 UNAVAILABLE \u00b7 '+(stErr||'').toUpperCase().slice(0,60);L.appendChild(s2);}
            if(!VOICES.length){L.innerHTML='<div class="vgroup">VOICE LIST UNAVAILABLE — RELOADING…</div>';boot();return;}
            VOICES.forEach(function(v){
              if(v.group!==lastG){lastG=v.group;var g=document.createElement('div');g.className='vgroup';g.textContent=v.group;L.appendChild(g);}
              var r=document.createElement('div');r.className='vrow'+(v.id===sel?' sel':'');
              var t=document.createElement('div');
              var n=document.createElement('div');n.className='vn';n.textContent=v.name;
              var m=document.createElement('div');m.className='vm';m.textContent=v.meta;
              t.appendChild(n);t.appendChild(m);
              var p=document.createElement('button');p.className='icon prev';p.innerHTML='&#9654;';p.title='Preview this voice';
              p.onclick=function(ev){ev.stopPropagation();preview(v,p);};
              r.appendChild(t);r.appendChild(p);
              r.onclick=function(){localStorage.setItem('jvoice',v.id);savePrefs({voice:v.id});var rows=L.querySelectorAll('.vrow');for(var i=0;i<rows.length;i++){rows[i].className='vrow';}r.className='vrow sel';toast('Agent voice set to '+v.name+', Boss.',1);};
              L.appendChild(r);
            });
          }
          function preview(v,btn){
            if(pvBtn===btn){stopPreview();return;}
            stopPreview();stopVoice();
            btn.innerHTML='&#8987;';pvBtn=btn;
            fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json','X-Token':tok},body:JSON.stringify({text:v.sample||'Hello Boss. I am online and ready for your orders.',voice:v.id})})
            .then(function(r){if(!r.ok){throw new Error('tts');}return r.blob();})
            .then(function(b){if(pvBtn!==btn){return;}pvA=new Audio(URL.createObjectURL(b));btn.innerHTML='&#9632;';pvA.onended=function(){stopPreview();};pvA.play().catch(function(){stopPreview();toast('Preview blocked by the browser — tap once more.');});})
            .catch(function(){stopPreview();toast('Preview failed — Edge TTS unreachable right now.');});
          }
          el('lang').addEventListener('change',function(){savePrefs({lang:el('lang').value});});
          el('voice').addEventListener('change',function(){savePrefs({speak:el('voice').checked});});
          el('auto').addEventListener('change',function(){savePrefs({autoEar:el('auto').checked});});
          el('vmb').onclick=function(){buildVoices();el('vmask').className='show';};
          el('vclose').onclick=function(){stopPreview();el('vmask').className='';};
          el('vmask').addEventListener('click',function(e){if(e.target===el('vmask')){stopPreview();el('vmask').className='';}});

          /* ---------- clock ---------- */
          setInterval(function(){var c=el('clock');if(c){c.textContent=new Date().toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}).toUpperCase();}},1000);

          /* ---------- microphone / smart endpointing ---------- */
          function micOff(){listening=false;el('mic').classList.remove('on');}
          function ensureStream(cb){
            if(stream){cb();return;}
            if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('This browser cannot access the microphone. Use Chrome or Edge over HTTPS.');return;}
            navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(st){stream=st;cb();}).catch(function(){toast('Microphone blocked. Click the lock icon in the address bar, allow Microphone, then tap MIC again.');});
          }
          function micClick(){
            if(listening){stopListen(true);return;}
            stopVoice();
            ensureStream(function(){if(SR&&!SRbroken){startSR();}else if(srvSTT){startRec();}else{toast('No speech engine available: this browser lacks speech recognition and no GROQ_API_KEY secret is set.');}});
          }
          function startSR(){
            rec=new SR();rec.lang=el('lang').value;rec.interimResults=true;rec.continuous=false;srLast='';
            listening=true;el('mic').classList.add('on');setState('listen','LISTENING');el('live').textContent='';
            function bump(txt){srLast=txt;clearTimeout(srT);srT=setTimeout(function(){
              /* smart end-of-speech: 1.3s of no new words -> send what we heard */
              if(listening&&srLast.trim()){micOff();try{rec.stop();}catch(e){}el('live').textContent='';send(srLast.trim());}
            },1300);}
            rec.onresult=function(ev){var fin='',inter='';for(var i=0;i<ev.results.length;i++){if(ev.results[i].isFinal){fin+=ev.results[i][0].transcript;}else{inter+=ev.results[i][0].transcript;}}
              el('live').textContent=inter||fin;
              if(fin.trim()){clearTimeout(srT);micOff();try{rec.stop();}catch(e){}el('live').textContent='';send(fin.trim());}
              else if(inter.trim()){bump(inter);}};
            rec.onerror=function(ev){clearTimeout(srT);micOff();
              if(ev.error==='no-speech'){if(el('auto').checked&&!busy){setTimeout(startSR,300);}else{setState('idle','STANDBY');}}
              else if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){toast('Mic permission denied — allow Microphone for this site.');setState('idle','STANDBY');}
              else if(ev.error==='network'){if(srvSTT){SRbroken=true;toast('Using server ears — just speak, it auto-sends when you pause.',1);startRec();}else{toast('Speech service unreachable. Use Chrome desktop/Android, or add GROQ_API_KEY for server transcription.');setState('idle','STANDBY');}}
              else{toast('Mic error: '+ev.error);setState('idle','STANDBY');}};
            rec.onend=function(){if(listening){micOff();if(el('auto').checked&&!busy){setTimeout(startSR,300);}else{setState('idle','STANDBY');}}};
            try{rec.start();}catch(e){toast('Could not start mic: '+e);}
          }
          function stopVad(){if(vadT){clearInterval(vadT);vadT=null;}if(actx){try{actx.close();}catch(e){}actx=null;}}
          function startRec(){
            if(!stream){return;}
            var chunks=[];recSpoke=false;recVoiced=0;
            try{mrec=new MediaRecorder(stream);}catch(e){toast('Audio recording not supported in this browser.');return;}
            mrec.ondataavailable=function(e){chunks.push(e.data);};
            mrec.onstop=function(){stopVad();el('live').textContent='';var b=new Blob(chunks,{type:mrec.mimeType||'audio/webm'});
              /* ONLY send when the meter actually heard voice. Silent clips used to
                 slip through on size alone — and Whisper HALLUCINATES phrases like
                 “Thank you!” on silence, which got auto-sent as fake user messages. */
              if(recSpoke&&b.size>2000){sendSTT(b,recVoiced);}
              else{setState('idle','STANDBY');if(el('auto').checked&&!busy){setTimeout(startRec,150);}}};
            mrec.start();listening=true;el('mic').classList.add('on');setState('listen','LISTENING — SPEAK');
            t0=Date.now();
            try{
              actx=new (window.AudioContext||window.webkitAudioContext)();
              if(actx.state==='suspended'){actx.resume();}
              var src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();an.fftSize=512;src.connect(an);
              var data=new Uint8Array(an.fftSize),quiet=0,nf=0,ticks=0,flat=0;
              vadT=setInterval(function(){
                an.getByteTimeDomainData(data);
                var m=0;for(var i=0;i<data.length;i++){var v=Math.abs(data[i]-128);if(v>m){m=v;}}
                ticks++;
                if(ticks<=4){nf=Math.max(nf,m);return;} /* first 400ms: learn the room's noise floor */
                if(m===0){flat+=100;}else{flat=0;}
                if(flat>=2000){ /* analyser returns silence (privacy shields) -> timed mode */
                  clearInterval(vadT);vadT=null;recSpoke=true;recVoiced=15000;
                  el('live').textContent='● voice meter blocked by browser shields — recording 15s then sending';
                  setTimeout(function(){if(mrec&&mrec.state==='recording'){stopListen(false);}},Math.max(300,15000-(Date.now()-t0)));
                  return;}
                var th=Math.max(6,Math.min(20,nf*1.8+3)); /* adaptive: just above the noise floor */
                if(m>th){if(!recSpoke||quiet>=1200){el('live').textContent='● hearing you — pause when done and I will send';}recSpoke=true;recVoiced+=100;quiet=0;}
                else if(recSpoke){quiet+=100;if(quiet===1200){el('live').textContent='● finishing… keep talking to add more';}}
                if((recSpoke&&quiet>=2200)||Date.now()-t0>60000){stopListen(false);}
              },100);
            }catch(e){recSpoke=true;recVoiced=15000;setTimeout(function(){if(mrec&&mrec.state==='recording'){stopListen(false);}},15000);}
          }
          function stopListen(user){
            clearTimeout(srT);
            if(rec){micOff();try{rec.stop();}catch(e){}}
            if(mrec&&mrec.state==='recording'){if(user){recSpoke=true;}micOff();mrec.stop();return;}
            if(user){setState('idle','STANDBY');}
          }
          var HALL=['thank you','thanks','thank you very much','thanks for watching','thank you for watching','thank you so much','bye','goodbye','you','okay','ok','hmm','yeah','so','the end','subscribe','please subscribe','ধন্যবাদ','धन्यवाद','नमस्ते'];
          function isHallucination(t,vms){
            var n=t.toLowerCase().replace(/[!?.।,…"“”]+/g,' ').replace(/\s+/g,' ').trim();
            if(!n){return true;}
            /* Whisper's classic silence-fillers only count when almost no real voice was heard */
            if(vms<1500&&HALL.indexOf(n)>-1){return true;}
            if(vms<600&&n.split(' ').length<=2){return true;}
            return false;}
          function sendSTT(b,vms){if(vms===undefined){vms=99999;}setState('think','TRANSCRIBING');fetch('/stt?lang='+el('lang').value,{method:'POST',headers:{'X-Token':tok,'Content-Type':b.type||'audio/webm'},body:b}).then(function(r){return r.json();}).then(function(j){if(j.text){if(isHallucination(j.text,vms)){toast('(ignored background noise: “'+j.text.trim()+'”)',1);setState('idle','STANDBY');if(el('auto').checked&&!busy){setTimeout(startRec,300);}return;}send(j.text);}else if(j.error){toast(j.error);setState('idle','STANDBY');}else{toast('I heard audio but no clear words — speak a little closer, Boss.',1);setState('idle','STANDBY');if(el('auto').checked&&!busy){setTimeout(startRec,500);}}}).catch(function(){toast('Transcription request failed');setState('idle','STANDBY');});}

          /* ---------- barge-in: speak to interrupt agent voice ---------- */
          function stopBarge(){if(bargeT){clearInterval(bargeT);bargeT=null;}}
          function startBarge(){
            stopBarge();
            if(!stream||!el('auto').checked){return;}
            try{
              var bctx=new (window.AudioContext||window.webkitAudioContext)();
              var src=bctx.createMediaStreamSource(stream),an=bctx.createAnalyser();an.fftSize=512;src.connect(an);
              var data=new Uint8Array(an.fftSize),hot=0,bt0=Date.now();
              bargeT=setInterval(function(){
                if(document.body.className!=='speak'){clearInterval(bargeT);bargeT=null;try{bctx.close();}catch(e){}return;}
                if(Date.now()-bt0<900){return;} /* grace period: ignore playback onset echo */
                an.getByteTimeDomainData(data);
                var m=0;for(var i=0;i<data.length;i++){var v=Math.abs(data[i]-128);if(v>m){m=v;}}
                if(m>26){hot+=90;}else{hot=0;} /* louder + sustained speech only, echo stays below this */
                if(hot>=720){ /* sustained voice -> interrupt and listen */
                  clearInterval(bargeT);bargeT=null;try{bctx.close();}catch(e){}
                  stopVoice();toast('Interrupted — listening, Boss.');
                  if(SR&&!SRbroken){startSR();}else if(srvSTT){startRec();}
                }
              },90);
            }catch(e){}
          }

          /* ---------- speech output + pause / replay controls ---------- */
          function pbShow(on){el('pbar').className=on?'show':'';}
          function pbIcon(){el('pbPause').innerHTML=paused?'&#9654;':'&#10074;&#10074;';}
          function after(){busy=false;paused=false;stopBarge();setState('idle','STANDBY');
            if(el('auto').checked){setTimeout(function(){ /* 600ms: let the speaker's echo tail fade before the ear opens */
              if(busy||listening){return;}
              if(SR&&!SRbroken&&stream){startSR();}else if(srvSTT&&stream){startRec();}else if(!stream){setState('idle','TAP MIC TO TALK');}
            },600);}}
          function scriptLang(t){if(/[\u0980-\u09FF]/.test(t)){return 'bn';}if(/[\u0900-\u097F]/.test(t)){return 'hi';}return 'en';}
          function voiceFor(t){var sl=scriptLang(t),v=curVoice();if(v.indexOf('st:')===0){if(sl!=='bn'){return v;}return VDEF['bn-BD']||'bn-BD-PradeepNeural';}if(v.indexOf(sl)===0){return v;}if(sl==='bn'){return VDEF['bn-BD']||'bn-BD-PradeepNeural';}if(sl==='hi'){return VDEF['hi-IN']||'hi-IN-MadhurNeural';}return v;}
          function browserSpeak(t){var msg=clean(t).slice(0,600);curU=new SpeechSynthesisUtterance(msg);var sl=scriptLang(msg);curU.lang=sl==='bn'?'bn-BD':(sl==='hi'?'hi-IN':el('lang').value);var vs=speechSynthesis.getVoices();for(var i=0;i<vs.length;i++){if(vs[i].lang.indexOf(curU.lang.split('-')[0])===0){curU.voice=vs[i];break;}}
            setState('speak','SPEAKING');pbShow(true);paused=false;pbIcon();el('pbFill').style.width='100%';startBarge();
            var done=false;function fin(){if(!done){done=true;pbShow(false);after();}}
            curU.onend=fin;curU.onerror=fin;setTimeout(fin,4000+msg.length*90);
            speechSynthesis.cancel();speechSynthesis.speak(curU);}
          function playUrl(url,onDone){
