          #!/usr/bin/env python3
          """
          Hermes live voice call bridge
          =============================

          Makes the Hermes agent joinable as a real participant in an Agent Ai voice
          call, so the user can *talk* to Hermes and hear it answer, live.

          How it fits together
          --------------------
          1. In the app the user opens a bot chat and taps the call button. The app
             creates a WebRTC room and publishes an invite:

                 hermesCalls/{botId} = {roomId, botId, userId, userName, status, createdAt}

          2. This bridge polls that node. When an invite appears it joins the very same
             room using the app's existing Firebase signalling layout:

                 rtc/{roomId}/participants/{id}          {id, name, avatar, joinedAt}
                 rtc/{roomId}/links/{a}__{b}/offer       written by the lower id
                 rtc/{roomId}/links/{a}__{b}/answer      written by the higher id
                 rtc/{roomId}/links/{a}__{b}/cand_{id}/  trickle ICE candidates
                 rtc/{roomId}/state                      accepted | declined | ended

          3. Inbound Opus audio -> 16 kHz PCM -> Groq Whisper (speech to text).
          4. The transcript goes to Hermes (`hermes chat -q`, or the local model pool).
          5. The answer goes through edge-tts -> 48 kHz PCM -> back into the call.

          Requirements
          ------------
              pip install aiortc av requests
              ffmpeg and edge-tts on PATH (both already present in the Hermes workflow)

          Environment
          -----------
              HERMES_DB_URL     Firebase Realtime Database URL (same one the app uses)
              HERMES_DB_TOKEN   optional ?auth= token when your rules require it
              HERMES_AGENT_NAME display name shown in the call        (default "Hermes")
              GROQ_API_KEY      speech to text
              HERMES_STT_MODEL  default whisper-large-v3-turbo
              HERMES_TTS_VOICE_EN  English voice   (default en-US-AriaNeural)
              HERMES_TTS_VOICE_BN  Bangla voice    (default bn-BD-NabanitaNeural)
              HERMES_PIPER_MODEL   local Piper .onnx used for English when present
              HERMES_CHAT_CMD   default "hermes chat -q"
              HERMES_POOL_URL   fallback chat endpoint (default http://localhost:4000/v1)
              HERMES_POOL_MODEL default pool-auto
          """

          import argparse
          import asyncio
          import audioop
          import collections
          import fractions
          import io
          import json
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import os
          import shlex
          import shutil
          import subprocess
          import sys
          import time
          import uuid
          import re
          import wave
          from datetime import datetime, timedelta
          try:
              from zoneinfo import ZoneInfo
          except Exception:  # pragma: no cover - very old python
              ZoneInfo = None

          import av
          import requests
          from aiortc import (
              RTCConfiguration,
              RTCIceServer,
              RTCPeerConnection,
              RTCSessionDescription,
              MediaStreamTrack,
          )
          from aiortc.sdp import candidate_from_sdp

          # --------------------------------------------------------------------------
          # configuration
          # --------------------------------------------------------------------------

          DB_URL = os.environ.get("HERMES_DB_URL", "https://shawall-default-rtdb.firebaseio.com").rstrip("/")
          # Who Hermes rings when no user id is supplied. Set HERMES_USER_ID to pin
          # it; otherwise the bridge finds the account by itself the first time.
          DEFAULT_USER_ID = (os.environ.get("HERMES_USER_ID", "").strip()
                             or os.environ.get("AGENT_AI_USER", "").strip())
          DB_TOKEN = os.environ.get("HERMES_DB_TOKEN", "").strip()
          AGENT_NAME = os.environ.get("HERMES_AGENT_NAME", "Hermes")
          # Which bot this bridge is. Several people share the app, and each of
          # them runs their own Hermes, so a bridge must answer only the invites
          # addressed to its own bot and ignore everybody else's.
          BOT_ID = os.environ.get("HERMES_BOT_ID", "hermes").strip()
          # True when the bot id was pinned by hand. Otherwise the bridge reads
          # the owner's bots out of the database and answers for those.
          BOT_ID_PINNED = bool(os.environ.get("HERMES_BOT_ID", "").strip())
          # Set to 1 only for a shared Hermes that should answer any bot id.
          ACCEPT_ANY_BOT = os.environ.get("HERMES_ACCEPT_ANY_BOT", "") == "1"
          # Optional extra lock: a comma separated list of user ids allowed to
          # call this bridge. Empty means the bot id check is the only gate.
          OWNER_IDS = set(
              part.strip()
              for part in os.environ.get("HERMES_OWNER_IDS", "").split(",")
              if part.strip()
          )
          GROQ_KEY = os.environ.get("GROQ_API_KEY", "").strip()
          STT_MODEL = os.environ.get("HERMES_STT_MODEL", "whisper-large-v3-turbo")
          TTS_VOICE = os.environ.get("HERMES_TTS_VOICE", "en-US-AriaNeural")

          # ---- language aware voices ----------------------------------------------
          # English is spoken by a local Piper neural voice. It runs on the CPU with
          # no network round trip, so the first syllable lands in a fraction of the
          # time a cloud voice needs - that is what keeps the call feeling live.
          # Bangla has no good local voice, so it uses the Microsoft Bangla female
          # voice through edge-tts. Switching happens per sentence, so a mixed
