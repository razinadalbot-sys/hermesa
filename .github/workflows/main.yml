          function clean(t){return t.replace(/```[\s\S]*?```/g,' code block ').replace(/https?:\S+/g,' link ').replace(/[*_#`>|]/g,' ').replace(/\s+/g,' ').trim();}
          function micOff(){listening=false;el('mic').classList.remove('on');}
          function micClick(){
            if(listening){stopListen(true);return;}
            if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('This browser cannot access the microphone. Use Chrome or Edge over HTTPS.');return;}
            navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){stream=st;if(SR&&!SRbroken){startSR();}else if(srvSTT){startRec();}else{toast('No speech engine available: this browser lacks speech recognition and no GROQ_API_KEY secret is set for server transcription.');}}).catch(function(){toast('Microphone blocked. Click the lock icon in the address bar, allow Microphone, then tap MIC again.');});
          }
          function startSR(){
            rec=new SR();rec.lang=el('lang').value;rec.interimResults=true;rec.continuous=false;
            listening=true;el('mic').classList.add('on');setState('listen','LISTENING');el('live').textContent='';
            rec.onresult=function(ev){var fin='',inter='';for(var i=0;i<ev.results.length;i++){if(ev.results[i].isFinal){fin+=ev.results[i][0].transcript;}else{inter+=ev.results[i][0].transcript;}}el('live').textContent=inter||fin;if(fin.trim()){micOff();try{rec.stop();}catch(e){}el('live').textContent='';send(fin.trim());}};
            rec.onerror=function(ev){micOff();
              if(ev.error==='no-speech'){if(el('auto').checked&&!busy){setTimeout(startSR,300);}else{setState('idle','STANDBY');}}
              else if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){toast('Mic permission denied — allow Microphone for this site.');setState('idle','STANDBY');}
              else if(ev.error==='network'){if(srvSTT){SRbroken=true;toast('Browser speech service unreachable — switched to server ears. Just speak; it auto-sends when you pause.');startRec();}else{toast('Speech service unreachable. Use Chrome desktop/Android, or add GROQ_API_KEY for server transcription.');setState('idle','STANDBY');}}
              else{toast('Mic error: '+ev.error);setState('idle','STANDBY');}};
            rec.onend=function(){if(listening){micOff();if(el('auto').checked&&!busy){setTimeout(startSR,300);}else{setState('idle','STANDBY');}}};
            try{rec.start();}catch(e){toast('Could not start mic: '+e);}
          }
          function stopVad(){if(vadT){clearInterval(vadT);vadT=null;}if(actx){try{actx.close();}catch(e){}actx=null;}}
          function startRec(){
            if(!stream){return;}
            var chunks=[];recSpoke=false;
            try{mrec=new MediaRecorder(stream);}catch(e){toast('Audio recording not supported in this browser.');return;}
            mrec.ondataavailable=function(e){chunks.push(e.data);};
            mrec.onstop=function(){stopVad();var b=new Blob(chunks,{type:mrec.mimeType||'audio/webm'});if(recSpoke&&b.size>2000){sendSTT(b);}else{setState('idle','STANDBY');if(el('auto').checked&&!busy){setTimeout(startRec,400);}}};
            mrec.start();listening=true;el('mic').classList.add('on');setState('listen','LISTENING — SPEAK NOW');
            t0=Date.now();
            try{
              actx=new (window.AudioContext||window.webkitAudioContext)();
              var src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();an.fftSize=512;src.connect(an);
              var data=new Uint8Array(an.fftSize),quiet=0;
              vadT=setInterval(function(){
                an.getByteTimeDomainData(data);
                var m=0;for(var i=0;i<data.length;i++){var v=Math.abs(data[i]-128);if(v>m){m=v;}}
                if(m>10){recSpoke=true;quiet=0;}else if(recSpoke){quiet+=100;}
                if((recSpoke&&quiet>=1500)||Date.now()-t0>25000){stopListen(false);}
              },100);
            }catch(e){recSpoke=true;}
          }
          function stopListen(user){
            if(rec){micOff();try{rec.stop();}catch(e){}}
            if(mrec&&mrec.state==='recording'){if(user){recSpoke=true;}micOff();mrec.stop();return;}
            if(user){setState('idle','STANDBY');}
          }
          function sendSTT(b){setState('think','TRANSCRIBING');fetch('/stt?lang='+el('lang').value,{method:'POST',headers:{'X-Token':tok,'Content-Type':b.type||'audio/webm'},body:b}).then(function(r){return r.json();}).then(function(j){if(j.text){send(j.text);}else{toast(j.error||'Transcription failed');setState('idle','STANDBY');}}).catch(function(){toast('Transcription request failed');setState('idle','STANDBY');});}
          function after(){busy=false;setState('idle','STANDBY');if(el('auto').checked){if(SR&&!SRbroken&&stream){startSR();}else if(srvSTT&&stream){startRec();}else if(!stream){setState('idle','TAP MIC TO TALK');}}}
          function browserSpeak(t){var msg=clean(t).slice(0,600);curU=new SpeechSynthesisUtterance(msg);curU.lang=el('lang').value;var vs=speechSynthesis.getVoices();for(var i=0;i<vs.length;i++){if(vs[i].lang.indexOf(curU.lang.split('-')[0])===0){curU.voice=vs[i];break;}}setState('speak','SPEAKING');var done=false;function fin(){if(!done){done=true;after();}}curU.onend=fin;curU.onerror=fin;setTimeout(fin,3000+msg.length*80);speechSynthesis.cancel();speechSynthesis.speak(curU);}
          function speak(t){
            if(!el('voice').checked){after();return;}
            if(curA){try{curA.pause();}catch(e){}}
            if(elTTS){setState('speak','SPEAKING');
              fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json','X-Token':tok},body:JSON.stringify({text:clean(t).slice(0,1200)})})
              .then(function(r){if(!r.ok){throw new Error('tts');}return r.blob();})
              .then(function(b){curA=new Audio(URL.createObjectURL(b));curA.onended=after;curA.onerror=function(){browserSpeak(t);};curA.play().catch(function(){browserSpeak(t);});})
              .catch(function(){browserSpeak(t);});
            }else{browserSpeak(t);}
          }
          function poll(id){fetch('/poll?id='+id,{headers:{'X-Token':tok}}).then(function(r){return r.json();}).then(function(j){if(j.done){addMsg('AGENT',j.reply);speak(j.reply);}else{setTimeout(function(){poll(id);},2500);}}).catch(function(){setTimeout(function(){poll(id);},4000);});}
          function send(text){
            if(!text){return;}
            if(busy){toast('Previous task still running, Boss.');return;}
            if(att.length){var ps=[];for(var i=0;i<att.length;i++){ps.push(att[i].path);}text+='\n\n[Attached files on your machine: '+ps.join(', ')+' \u2014 open and use them for this task]';att=[];drawAtt();}
            busy=true;stopListen(false);addMsg('YOU',text);setState('think','PROCESSING');
            fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json','X-Token':tok},body:JSON.stringify({text:text})}).then(function(r){return r.json();}).then(function(j){if(j.job){poll(j.job);}else{busy=false;addMsg('AGENT',j.error||'request failed');setState('idle','STANDBY');}}).catch(function(e){busy=false;addMsg('AGENT','Connection error: '+e);setState('idle','STANDBY');});
          }
          var att=[];
          function drawAtt(){var h='';for(var i=0;i<att.length;i++){h+='<span class="chip"><i class="fa-solid fa-paperclip"></i> '+att[i].name+'</span>';}el('att').innerHTML=h;}
          el('attb').onclick=function(){el('fpick').click();};
          el('fpick').onchange=function(){
            var fs=el('fpick').files;
            for(var i=0;i<fs.length;i++){(function(f){
              addMsg('YOU','Uploading: '+f.name+' ...');
              fetch('/upload',{method:'POST',headers:{'X-Token':tok,'X-Filename':f.name,'Content-Type':f.type||'application/octet-stream'},body:f}).then(function(r){return r.json();}).then(function(j){if(j.path){att.push({name:f.name,path:j.path});drawAtt();addMsg('AGENT','File received, Boss: '+f.name+' \u2014 now tell me what to do with it (voice or text).');}else{toast(j.error||'Upload failed');}}).catch(function(){toast('Upload failed: '+f.name);});
            })(fs[i]);}
            el('fpick').value='';
          };
          el('mic').onclick=micClick;
          el('sendb').onclick=function(){var v=el('txt').value.trim();el('txt').value='';send(v);};
          el('txt').addEventListener('keydown',function(e){if(e.key==='Enter'){el('sendb').onclick();}});
          if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){};}
          try{
          var c=el('stars'),x=c.getContext('2d');
          function rs(){c.width=innerWidth;c.height=innerHeight;}rs();addEventListener('resize',rs);
          var pts=[];for(var i=0;i<120;i++){pts.push({x:Math.random(),y:Math.random(),z:Math.random()*1.5+0.3,s:Math.random()*0.0006+0.0002});}
          (function anim(){x.clearRect(0,0,c.width,c.height);for(var i=0;i<pts.length;i++){var p=pts[i];p.y-=p.s;if(p.y<0){p.y=1;p.x=Math.random();}x.globalAlpha=0.5*p.z;x.fillStyle='#37c8ff';x.fillRect(p.x*c.width,p.y*c.height,p.z,p.z*3);}x.globalAlpha=1;requestAnimationFrame(anim);})();
