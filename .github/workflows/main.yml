                  invite["roomId"] = new_room_id()
                  invite["userName"] = "there"
                  asyncio.get_event_loop().run_until_complete(HermesCall(invite).run())
                  return

              asyncio.get_event_loop().run_until_complete(main())


          if __name__ == "__main__":
              try:
                  cli()
              except KeyboardInterrupt:
                  sys.exit(0)
          HERMESCALLEOF

          # One-liner Hermes can run itself:  hermes-call USER_ID "message"
