          .search{width:100%;background:rgba(8,12,22,.5);border:none;color:var(--txt);padding:13px 18px 13px 44px;font-size:13.5px;outline:none;font-family:inherit}
          .search::placeholder{color:#5b6779}
          .list{max-height:56vh;overflow-y:auto;padding:8px}
          .list::-webkit-scrollbar{width:9px}
          .list::-webkit-scrollbar-thumb{background:rgba(148,163,184,.18);border-radius:99px}
          .row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;margin:2px 0;border:1px solid transparent;transition:.15s}
          .row:hover{background:rgba(148,163,184,.06)}
          .row.sel{background:rgba(45,212,191,.07);border-color:rgba(45,212,191,.22)}
          .row input{accent-color:var(--acc);width:16px;height:16px;flex:none;cursor:pointer}
