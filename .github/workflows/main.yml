          .chip{margin-left:auto;font-size:12px;font-weight:600;color:var(--dim);border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 14px;cursor:pointer;font-family:inherit;transition:.2s}
          .chip.on{color:var(--acc);border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.08)}
          .sbox{position:relative;border-bottom:1px solid var(--line)}
