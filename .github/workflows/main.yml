          #mic{width:clamp(64px,10vmin,86px);aspect-ratio:1;border-radius:50%;font-size:clamp(24px,4vmin,34px);background:#062c44;border:2px solid #1d6f9b;color:#7ee6ff;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
          #mic.on{background:#053b2a;border-color:#31ff9e;box-shadow:0 0 28px #31ff9e;animation:pulse 1.2s ease-in-out infinite}
          #opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
          #engine{font-size:10px;letter-spacing:.2em;color:#3f7f99;text-align:center}
          #right{display:flex;flex-direction:column;min-height:0;gap:8px}
          #log{flex:1;min-height:0;overflow-y:auto;background:rgba(4,18,32,.72);border:1px solid #0e4a66;border-radius:12px;padding:14px}
          .msg{margin-bottom:12px;max-width:100%}
          .msg b{font-family:Orbitron;font-size:11px;letter-spacing:.2em;color:#57cfff}
          .msg.YOU b{color:#ffd479}
          .msg pre{white-space:pre-wrap;word-break:break-word;font-family:Rajdhani;font-size:clamp(14px,1.4vw,16px);color:#d9f6ff;margin-top:3px;line-height:1.45}
          #live{min-height:22px;font-style:italic;color:#57cfff;padding:0 6px;font-size:15px}
          #inrow{display:flex;gap:8px}
          #attb{padding:10px 12px}
          #att{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
          .chip{background:#062c44;border:1px solid #1d6f9b;color:#7ee6ff;border-radius:8px;padding:3px 8px;font-size:12px}
          #txt{flex:1;min-width:0;background:#04121f;border:1px solid #12557a;color:#bdeeff;padding:12px;border-radius:10px;font-family:Rajdhani;font-size:16px}
