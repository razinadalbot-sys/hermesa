          [ -n "$LIVEVIEW_URL" ] && LIVEVIEW_URL="${LIVEVIEW_URL}/vnc.html"
          echo "::notice title=🔭 Live desktop view::${LIVEVIEW_URL:-tunnel failed}"
          TG_API="https://api.telegram.org"
          curl -s -X POST "${TG_API}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d text="🟢 Hermes Agent ONLINE (Telegram + Slack, NVIDIA/Mistral pool)
          🎛️ Model panel: ${PANEL_URL}
          🖥️ Hermes WebUI: ${WEBUI_URL:-not available}
          🔭 Live desktop: ${LIVEVIEW_URL:-not available} (pass: first 8 chars of PANEL_TOKEN)
          🤖 Agent HUD: ${JARVIS_URL:-not available} (token: your PANEL_TOKEN)
          🔑 Password: your PANEL_TOKEN secret
          Use /model in Telegram or !model in Slack to switch models" > /dev/null

      # ── 13. Run gateway with time budget + anti-stuck watchdog ──
      - name: Run Hermes gateway
        run: |
          # Shared virtual display :99 (browser + agent GUI + live view all
          # render here; normally started in step 4 — this is just a safety
          # net). Every terminal the agent opens inherits DISPLAY=:99.
          if ! pgrep -f "Xvfb :99" >/dev/null; then
            Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb99.log 2>&1 &
            sleep 2
          fi
          export DISPLAY=:99

          # ── SMART SESSION RESET ──
          # Only start a fresh chat session when the saved context is actually
          # huge. Blindly resetting every run loses the conversation the user
          # was in the middle of — that caused real data loss before.
          python3 - <<'PYSESS'
          import json, os, re, sqlite3
          home = os.path.expanduser("~/.hermes")
          sf = os.path.join(home, "sessions", "sessions.json")
          db = os.path.join(home, "state.db")
          try:
              raw = open(sf).read()
              ids = set(re.findall(r"\d{8}_\d{6}_[0-9a-f]+", raw))
              worst = 0
              if ids and os.path.exists(db):
                  con = sqlite3.connect(db)
                  for sid in ids:
                      n = con.execute(
                          "SELECT COALESCE(SUM(token_count),0) FROM messages WHERE session_id=?",
                          (sid,),
                      ).fetchone()[0]
                      worst = max(worst, n or 0)
                  con.close()
              if worst > 45000:
                  os.remove(sf)
                  print("session context too big (%d tokens) - fresh session" % worst)
              else:
                  print("keeping sessions (max %d tokens)" % worst)
          except Exception as e:
              print("session check skipped:", e)
          PYSESS

          # watchdog: if the LiteLLM router hangs (rate-limit deadlock etc.),
          # auto-restart it — no more force-stopping the whole Action run
          cat > /tmp/watchdog.sh <<'EOF'
          #!/bin/bash
          fails=0
          while true; do
            sleep 60
            # ZOMBIE detection: LiteLLM's per-worker request counter can LEAK
            # (climbs 39 -> 80 -> 272 and never resets). The catalog endpoint
            # still answers, so a plain health check passes while every real
            # completion gets 500 "Worker local total request limit reached".
            # Restart immediately when that error shows up in recent logs.
            if docker logs litellm --since 90s 2>&1 | grep -q "Worker local total request limit reached"; then
              echo "$(date) Router counter leak detected — restarting litellm container"
              # -t 2: kill fast. Default docker restart waits 10s for graceful
              # stop; that downtime is what burns the gateway's quick retries.
              docker restart -t 2 litellm >/dev/null 2>&1 || true
              fails=0
              continue
            fi
            if curl -fs -m 15 http://localhost:4000/v1/models >/dev/null 2>&1; then
              fails=0
            else
              fails=$((fails+1))
              echo "$(date) LiteLLM health check failed ($fails/3)"
              if [ "$fails" -ge 3 ]; then
                echo "$(date) Router stuck — restarting litellm container"
                docker restart -t 2 litellm >/dev/null 2>&1 || true
                fails=0
              fi
            fi
          done
          EOF
          chmod +x /tmp/watchdog.sh
          nohup /tmp/watchdog.sh > /tmp/watchdog.log 2>&1 &

          JOB_START=$(cat /tmp/job_start)
          END=$(( JOB_START + RUN_MINUTES * 60 ))
          while true; do
            NOW=$(date +%s)
            REMAIN=$(( (END - NOW) / 60 ))
            if [ "$REMAIN" -le 2 ]; then
              echo "Time budget exhausted"; break
            fi
            # keep "pool-auto" as default on every gateway (re)start — it
            # always reflects the CURRENT pool you applied from the panel
            hermes config set model.default "pool-auto" || true
            echo "Starting gateway (${REMAIN}m remaining)..."
            timeout -k 60 "${REMAIN}m" hermes gateway || true
            # 60s (not 10s): Telegram holds the previous gateway's getUpdates
            # session open for up to ~1 min after a crash. Restarting too fast
            # causes "Conflict: terminated by other getUpdates request" and a
            # fatal polling-conflict loop.
            echo "Gateway exited, restarting in 60s..."
            sleep 60
          done

      # ── 14. Final push to data repo (main) ──
      - name: Final data push
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          rm -rf /tmp/final && mkdir -p /tmp/final
          rsync -a --exclude='.env' --exclude='.git' --exclude='*.log' --exclude='hermes-agent' \
            --exclude='browser-profile/cache2' --exclude='browser-profile/startupCache' \
            --exclude='browser-profile/shader-cache' \
            "$HERMES_HOME/" /tmp/final/ || true
          cd /tmp/final
          find . -type f -size +90M | while read -r f; do
            split -b 90M -d -a 3 "$f" "$f.gh-chunk."
            rm -f "$f"
          done
          cat > .gitignore <<'EOF'
          .env
          *.log
          EOF
          git init -q -b main
          git config user.email "bot@hermes" && git config user.name "hermes-bot"
          git add -A && git commit -q -m "final save $(date -u +%FT%TZ)" || true
          git push -f "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" main

      # ── 15. Start next run (24/7 chaining) ──
      # Dispatches a fresh run of THIS workflow when the current one ends.
      # The concurrency group makes the new run QUEUE until this one exits,
      # so two gateways never overlap (no Telegram polling conflict).
      # Cancelling a run manually BREAKS the chain (if: !cancelled()) -
      # cancel = stop for good, let it finish = runs 24/7.
      - name: Start next run (24/7 chain)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF_FILE="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          WF_FILE="${WF_FILE%%@*}"
          echo "Chaining next run of ${WF_FILE} on ${GITHUB_REF_NAME}..."
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" \
            && echo "Next run queued OK" || echo "::warning::Could not queue next run"

      # ── 16. Notify failure ──
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          TG_API="https://api.telegram.org"
          curl -s -X POST "${TG_API}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d text="🔴 Hermes Agent run FAILED — check Actions logs" > /dev/null
