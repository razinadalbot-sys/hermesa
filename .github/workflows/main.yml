          .name{flex:1;font-size:13px;font-family:var(--mono);word-break:break-all}
          .tbtn{background:rgba(148,163,184,.08);color:#9fb3c8;border:1px solid var(--line);border-radius:9px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;flex:none;font-family:inherit;transition:.2s}
          .tbtn:hover{border-color:var(--acc);color:var(--acc);background:rgba(45,212,191,.08)}
          .lat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;flex:none;white-space:nowrap;font-family:var(--mono)}
          .lat.ok{background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
          .lat.bad{background:rgba(248,113,113,.1);color:var(--bad);border:1px solid rgba(248,113,113,.3);cursor:help}
          .lat.tst{background:rgba(251,191,36,.1);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
          .skel{height:38px;border-radius:12px;margin:6px 4px;background:linear-gradient(90deg,rgba(148,163,184,.06) 25%,rgba(148,163,184,.14) 50%,rgba(148,163,184,.06) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
          @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
          footer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(7,10,18,.88);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
          .prog{height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;transition:width .3s}
          .fin{display:flex;gap:12px;align-items:center;padding:13px 26px;max-width:860px;margin:0 auto}
          .info{flex:1;color:var(--dim);font-size:13px}
          .info b{color:var(--txt);font-family:var(--mono)}
          .btn{border:0;border-radius:12px;padding:13px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
          .btn.primary{background:linear-gradient(135deg,var(--acc),#14b8a6);color:#032620;box-shadow:0 10px 26px rgba(45,212,191,.3)}
          .btn.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
          .btn.ghost{background:rgba(148,163,184,.08);color:var(--txt);border:1px solid var(--line)}
          .btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
          #toasts{position:fixed;top:70px;right:20px;z-index:9;display:flex;flex-direction:column;gap:10px}
          .toast{background:rgba(19,25,39,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-left:3px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:13px;max-width:380px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
          .toast.bad{border-left-color:var(--bad)}
          @keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
          </style></head><body>
          <div class="orb o1"></div><div class="orb o2"></div>
          <nav>
            <div class=logo><i class="fa-solid fa-atom"></i></div>
            <div><h1>Hermes Command Deck</h1><div class=crumb>model pool &middot; litellm router</div></div>
            <div class=pill><span class=dot></span><span id=sub>Loading catalog...</span></div>
          </nav>
          <div class=wrap>
            <div class=grid id=stats>
              <div class=skel></div><div class=skel></div><div class=skel></div><div class=skel></div>
            </div>
            <div class=card style="margin-bottom:18px">
              <div class=chead>
                <h2><i class="fa-solid fa-microchip"></i> NVIDIA NIM Catalog</h2><span class=badge id=cntN>&ndash;</span>
                <button class=chip id=selchip onclick="selOnlyTgl()">Selected only</button>
              </div>
              <div class=sbox><span class=ico><i class="fa-solid fa-magnifying-glass"></i></span>
                <input class=search placeholder="Filter models... try 'instruct' or 'llama'" oninput="filt(this.value)"></div>
              <div class=list id=nvidia>
                <div class=skel></div><div class=skel></div><div class=skel></div><div class=skel></div><div class=skel></div>
              </div>
            </div>
            <div class=card>
              <div class=chead>
                <h2><i class="fa-solid fa-wind"></i> Mistral Catalog</h2><span class=badge id=cntM>&ndash;</span>
              </div>
              <div class=list id=mistral style="max-height:34vh">
                <div class=skel></div><div class=skel></div>
              </div>
            </div>
            <div class=card style="margin-top:18px">
              <div class=chead>
                <h2><i class="fa-solid fa-volume-high"></i> Agent Voice (Edge Neural)</h2><span class=badge id=vcur>&ndash;</span>
              </div>
              <div class=sbox><span class=ico><i class="fa-solid fa-magnifying-glass"></i></span>
                <input class=search placeholder="Filter voices... try 'en-US' or 'bn'" oninput="vfilt(this.value)"></div>
              <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
                <select id=vsel style="flex:1;min-width:0;background:#0b1220;color:#dbe7ff;border:1px solid #2a3b5f;border-radius:10px;padding:10px"></select>
                <button class="btn ghost" onclick="applyVoice()"><i class="fa-solid fa-check"></i> Apply</button>
              </div>
            </div>
          </div>
          <footer>
            <div class=prog id=prog></div>
            <div class=fin>
              <div class=info id=info><b>0</b> models selected</div>
              <button class="btn ghost" onclick="testSelected()"><i class="fa-solid fa-bolt"></i> Test selected</button>
              <button class="btn primary" onclick="applyPool()">Apply pool &rarr;</button>
            </div>
          </footer>
          <div id=toasts></div>
          <script>
          let catN=[],catM=[],pool=new Map(),results={},filter='',selOnly=false,keys={};
          function toast(m,bad){const w=document.getElementById('toasts');
            const t=document.createElement('div');t.className='toast'+(bad?' bad':'');
            t.textContent=(bad?'\u2715 ':'\u2713 ')+m;w.appendChild(t);
            setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';setTimeout(()=>t.remove(),400)},5600)}
          function renderStats(){
            const rows=Object.entries(keys).map(([p,n])=>`
              <div class=stat><div class=bar style="background:linear-gradient(90deg,${n>0?'var(--ok)':'var(--bad)'},transparent)"></div>
                <div class=k><span class="dot ${n>0?'on':'off'}"></span>${p}</div>
                <div class=v>${n}</div><div class=s>API key${n===1?'':'s'} loaded</div></div>`).join('');
            document.getElementById('stats').innerHTML=rows+`
              <div class=stat><div class=bar style="background:linear-gradient(90deg,var(--acc2),transparent)"></div>
                <div class=k>Catalog</div><div class=v>${catN.length+catM.length}</div><div class=s>models available</div></div>
              <div class=stat><div class=bar style="background:linear-gradient(90deg,var(--acc),transparent)"></div>
                <div class=k>Active pool</div><div class=v id=poolstat>${pool.size}</div><div class=s>rotating via pool-auto</div></div>`;
          }
          fetch('/api/models').then(r=>r.json()).then(d=>{
            catN=d.nvidia;catM=d.mistral||[];keys=d.keys||{};
            d.pool.forEach(x=>{const cat=(x.provider==='mistral')?catM:catN;
              if(!cat.length||cat.includes(x.id))pool.set(x.id,x.provider||'nvidia')});
            renderStats();render();info();
            document.getElementById('sub').textContent=d.errors.length?d.errors.join(' | ')
              :'Live \u00b7 catalog loaded';
            if(d.errors.length)toast(d.errors.join(' | '),true);
          });
          function rowHtml(m,p){
            const r=results[m],sel=pool.has(m),v=p==='mistral'?'mistral':(m.includes('/')?m.split('/')[0]:'nim');
            const chip=!r?'':r.loading?'<span class="lat tst">testing\u2026</span>'
              :r.ok?`<span class="lat ok">${r.ms} ms</span>`
              :`<span class="lat bad" title="${(r.msg||'').replace(/"/g,'&quot;')}">\u2715 ${(r.msg||'fail').slice(0,24)}</span>`;
            return `<div class="row ${sel?'sel':''}">
              <input type=checkbox ${sel?'checked':''} onchange="tog('${m}','${p}')">
              <span class=vend>${v}</span>
              <span class=name>${m}</span>${chip}
              <button class=tbtn onclick="testModel('${m}','${p}')">Test</button></div>`;
          }
          function render(){
            const f=filter.toLowerCase();
            let items=catN.filter(m=>m.toLowerCase().includes(f));
            if(selOnly)items=items.filter(m=>pool.has(m));
            document.getElementById('cntN').textContent=catN.length;
            document.getElementById('nvidia').innerHTML=items.map(m=>rowHtml(m,'nvidia')).join('')
              ||'<div style="padding:22px;color:#8b98ad;text-align:center">No models match</div>';
            document.getElementById('cntM').textContent=catM.length;
            let mitems=catM.filter(m=>m.toLowerCase().includes(f));
            if(selOnly)mitems=mitems.filter(m=>pool.has(m));
            document.getElementById('mistral').innerHTML=catM.length
              ?(mitems.map(m=>rowHtml(m,'mistral')).join('')
                ||'<div style="padding:22px;color:#8b98ad;text-align:center">No models match</div>')
              :'<div style="padding:22px;color:#8b98ad;text-align:center">No MISTRAL_KEYS secret configured \u2014 add it to enable this section</div>';
          }
          function filt(v){filter=v;render()}
          function selOnlyTgl(){selOnly=!selOnly;document.getElementById('selchip').classList.toggle('on',selOnly);render()}
          function tog(m,p){pool.has(m)?pool.delete(m):pool.set(m,p);render();info();
            const el=document.getElementById('poolstat');if(el)el.textContent=pool.size}
          function info(){document.getElementById('info').innerHTML='<b>'+pool.size+'</b> model'+(pool.size===1?'':'s')+' in rotating pool'}
          function prog(p){document.getElementById('prog').style.width=p+'%'}
          async function testModel(m,p){
            results[m]={loading:true};render();
            const r=await fetch('/api/test',{method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({id:m,provider:p})}).then(x=>x.json())
              .catch(e=>({ok:false,ms:0,msg:'timeout / connection dropped'}));
            results[m]=r;render();
            toast(m+' \u2014 '+(r.ok?r.ms+' ms':r.msg),!r.ok);
            return r;
          }
          async function testSelected(){
            const items=[...pool.entries()];
            if(!items.length)return toast('Nothing selected',true);
            toast('Testing '+items.length+' model(s)\u2026');
            let ok=0,done=0;
            for(const [m,p] of items){const r=await testModel(m,p);if(r.ok)ok++;done++;prog(Math.round(done/items.length*100))}
            toast('Done: '+ok+'/'+items.length+' working',ok<items.length);
            setTimeout(()=>prog(0),1500);
          }
          function applyPool(){
            const sel=[...pool.entries()].map(([id,provider])=>({provider,id}));
            if(!sel.length)return toast('Select at least 1 model',true);
            toast('Applying pool\u2026');prog(60);
            fetch('/api/pool',{method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({pool:sel})}).then(r=>r.json())
              .then(d=>{prog(100);toast('Pool saved ('+d.count+'). Router restarting ~10s. All '+d.count+' models now auto-rotate via pool-auto \u2014 no manual switching needed.');setTimeout(()=>prog(0),1500)})
              .catch(e=>{prog(0);toast('Failed: '+e,true)});
          }
          var VOICES=[];
          function vfill(list){var s=document.getElementById('vsel');s.innerHTML='';list.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}
          function vfilt(q){q=q.toLowerCase();vfill(VOICES.filter(function(v){return v.toLowerCase().indexOf(q)>=0;}));}
          function loadVoices(){fetch('/api/voices').then(r=>r.json()).then(d=>{VOICES=d.voices||[];vfill(VOICES);var c=d.current||'';document.getElementById('vcur').textContent=c||'default';if(c){document.getElementById('vsel').value=c;}}).catch(()=>{});}
          function applyVoice(){var v=document.getElementById('vsel').value;if(!v)return toast('Pick a voice first',true);toast('Applying voice\u2026');fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice:v})}).then(r=>r.json()).then(d=>{if(d.ok){document.getElementById('vcur').textContent=v;toast('Agent voice set to '+v+' \u2014 applies to the next spoken reply');}else{toast(d.msg||'Failed',true);}}).catch(e=>toast('Failed: '+e,true));}
          loadVoices();
          </script></body></html>"""

          @app.route("/")
          def home():
              return (HTML, 200) if authed() else (LOGIN, 200)

          @app.route("/login", methods=["POST"])
          def login():
              now = time.time()
              if now < FAILS["until"]:
                  return jsonify({"ok": False, "msg": "Too many attempts — wait 60s"})
              pw = (request.get_json(silent=True) or {}).get("password", "")
              if hmac.compare_digest(pw, TOKEN):
                  FAILS["n"] = 0
                  r = make_response(jsonify({"ok": True}))
                  r.set_cookie("s", SESSION, httponly=True, secure=True,
                               samesite="Lax", max_age=6 * 3600)
                  return r
              FAILS["n"] += 1
              if FAILS["n"] >= 5:
                  FAILS["until"] = now + 60
                  FAILS["n"] = 0
              time.sleep(1)
              return jsonify({"ok": False, "msg": "Wrong password"})

          @app.route("/api/models")
          def models():
              if not authed(): return deny()
              out = {"nvidia": [], "mistral": [], "errors": [], "pool": load_pool(),
                     "keys": {"NVIDIA NIM": len(KEY_NAMES),
                              "Mistral": len(MISTRAL_KEY_NAMES)}}
              if KEY_NAMES:
                  # live catalog from NVIDIA NIM API
                  try: out["nvidia"] = fetch_models(BASE, KEY_NAMES[0])
                  except Exception as e: out["errors"].append("nvidia: " + str(e))
              else:
                  out["errors"].append("no NVIDIA keys configured")
              if MISTRAL_KEY_NAMES:
                  # live catalog from Mistral API; fall back to built-in list
                  try: out["mistral"] = fetch_models("https://api.mistral.ai/v1", MISTRAL_KEY_NAMES[0])
                  except Exception as e:
                      out["mistral"] = MISTRAL_MODELS
                      out["errors"].append("mistral: " + str(e) + " (showing built-in list)")
              return jsonify(out)

          @app.route("/api/test", methods=["POST"])
          def test_model():
              if not authed(): return deny()
              data = request.get_json()
              mid = data["id"]
              provider = data.get("provider", "nvidia")
              if provider == "mistral":
                  base, keys = "https://api.mistral.ai/v1", MISTRAL_KEY_NAMES
              else:
                  base, keys = BASE, KEY_NAMES
              if not keys:
                  return jsonify({"ok": False, "ms": 0, "msg": "no API keys for " + provider})
              body = json.dumps({"model": mid, "max_tokens": 5,
                  "messages": [{"role": "user", "content": "Say OK"}]}).encode()
              req = urllib.request.Request(base + "/chat/completions", data=body,
                  headers={"Authorization": "Bearer " + os.environ[keys[0]],
                           "Content-Type": "application/json"})
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      json.load(r)
                  return jsonify({"ok": True, "ms": int((time.time()-t0)*1000), "msg": "works"})
              except urllib.error.HTTPError as e:
                  try:
                      err = json.loads(e.read().decode())
                      msg = (err.get("error") or {}).get("message") or err.get("title") or str(err)
                  except Exception:
                      msg = "HTTP %d" % e.code
                  return jsonify({"ok": False, "ms": int((time.time()-t0)*1000), "msg": str(msg)[:200]})
              except Exception as e:
                  return jsonify({"ok": False, "ms": int((time.time()-t0)*1000), "msg": str(e)[:200]})

          @app.route("/api/pool", methods=["POST"])
          def set_pool():
              if not authed(): return deny()
              pool = [x for x in request.get_json()["pool"] if x.get("provider") in ("nvidia", "mistral")]
              if not pool:
                  return jsonify({"ok": False, "count": 0})
              save_pool(pool)
              write_config(pool)
              # fire-and-forget restart: respond immediately, don't block the request
              subprocess.Popen(["docker", "restart", "-t", "2", "litellm"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              return jsonify({"ok": True, "count": len(pool)})

          VOICE_FILE = os.path.join(os.path.expanduser("~/.hermes"), "voice.txt")
          VOICES_CACHE = []

          def edge_voice_list():
              global VOICES_CACHE
              if VOICES_CACHE:
                  return VOICES_CACHE
              try:
                  p = subprocess.run(["edge-tts", "--list-voices"],
                                     capture_output=True, text=True, timeout=60)
                  vs = []
                  for ln in p.stdout.splitlines():
                      tok = ln.split()
                      if tok and re.match(r"^[a-z]{2,3}-[A-Za-z]{2,4}.*Neural$", tok[0]):
                          vs.append(tok[0])
                  VOICES_CACHE = sorted(set(vs))
              except Exception:
                  pass
              return VOICES_CACHE

          @app.route("/api/voices")
          def voices():
              if not authed(): return deny()
              cur = ""
              try:
                  cur = open(VOICE_FILE).read().strip()
              except Exception:
                  pass
              return jsonify({"voices": edge_voice_list(), "current": cur})

          @app.route("/api/voice", methods=["POST"])
          def set_voice():
              if not authed(): return deny()
              v = ((request.get_json(silent=True) or {}).get("voice") or "").strip()
              if not re.match(r"^[A-Za-z0-9-]+$", v):
                  return jsonify({"ok": False, "msg": "bad voice"})
              os.makedirs(os.path.dirname(VOICE_FILE), exist_ok=True)
              with open(VOICE_FILE, "w") as f:
                  f.write(v + "\n")
              try:
                  subprocess.run(["hermes", "config", "set", "tts.voice", v],
                                 capture_output=True, timeout=30)
              except Exception:
                  pass
              return jsonify({"ok": True})

          if __name__ == "__main__":
              if "--init" in sys.argv:
                  pool, removed = prune_pool(load_pool())
                  if removed:
                      save_pool(pool)
                      print("pruned dead/EOL models: " + ", ".join(removed))
                  write_config(pool); sys.exit(0)
              import threading
              threading.Thread(target=auto_prune_loop, daemon=True).start()
              app.run(host="0.0.0.0", port=7000, threaded=True)
          PYEOF

          # sanitize pool: drop any old ollama entries from backup; default if empty
          python3 - <<'PY'
          import json, os
          home = os.environ.get("HERMES_HOME", "/home/runner/.hermes")
          p = os.path.join(home, "pool.json")
          try:
              pool = [x for x in json.load(open(p)) if x.get("provider") in ("nvidia", "mistral")]
          except Exception:
              pool = []
          # NO hardcoded default model — pool stays empty until YOU pick one
          os.makedirs(home, exist_ok=True)
          json.dump(pool, open(p, "w"), indent=1)
          print("pool:", [x["id"] for x in pool] or "EMPTY (waiting for panel selection)")
          PY

      # ── 6. Start LiteLLM router + panel + tunnel ──
      - name: Start LiteLLM router and control panel
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          NVIDIA_KEYS: ${{ secrets.NVIDIA_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          # ── hard fail if PANEL_TOKEN is missing or too short ──
          if [ -z "$PANEL_TOKEN" ] || [ ${#PANEL_TOKEN} -lt 8 ]; then
            echo "::error::PANEL_TOKEN secret is missing or shorter than 8 chars — set it in Settings → Secrets"
            exit 1
          fi

          # ── split + VALIDATE bulk NVIDIA_KEYS (one per line; commas also OK) ──
          # every key is auth-checked against the live API; keys that return
          # 401/403 (revoked/banned/typo) are DROPPED so they never poison the
          # rotation pool. 429/timeouts do NOT drop a key (fail-open).
          : > /tmp/litellm.env
          n=0; bad_n=0
          while IFS= read -r k; do
            k=$(echo "$k" | tr -d ' \r')
            [ -z "$k" ] && continue
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${k}" https://integrate.api.nvidia.com/v1/models)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              bad_n=$((bad_n+1))
              echo "::warning::Dropping NVIDIA key #$((n+bad_n)) — auth check failed (HTTP $code)"
            else
              n=$((n+1))
              echo "NVIDIA_KEY_${n}=${k}" >> /tmp/litellm.env
            fi
            sleep 1
          done < <(printf '%s\n' "$NVIDIA_KEYS" | tr ',' '\n')
          echo "NVIDIA keys: $n valid, $bad_n dropped"
          if [ "$bad_n" -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              -d text="🚨 Hermes: ${bad_n} NVIDIA key(s) dead (auth failed) - ${n} still working" > /dev/null || true
          fi
          if [ "$n" -eq 0 ]; then
            echo "::error::No working NVIDIA key — secret is empty or every key failed the auth check"
            exit 1
          fi

          # ── split + VALIDATE bulk MISTRAL_KEYS (one per line; commas also OK; optional) ──
          m=0; bad_m=0
          while IFS= read -r k; do
            k=$(echo "$k" | tr -d ' \r')
            [ -z "$k" ] && continue
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${k}" https://api.mistral.ai/v1/models)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              bad_m=$((bad_m+1))
              echo "::warning::Dropping Mistral key #$((m+bad_m)) — auth check failed (HTTP $code)"
            else
              m=$((m+1))
              echo "MISTRAL_KEY_${m}=${k}" >> /tmp/litellm.env
            fi
            sleep 1
          done < <(printf '%s\n' "$MISTRAL_KEYS" | tr ',' '\n')
          echo "Mistral keys: $m valid, $bad_m dropped"
          if [ "$bad_m" -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              -d text="🚨 Hermes: ${bad_m} Mistral key(s) dead (auth failed) - ${m} still working" > /dev/null || true
          fi

          # make the split keys visible to this shell + panel process
          set -a; source /tmp/litellm.env; set +a

          # start control panel FIRST (inherits this step's env)
          nohup python3 /tmp/panel/app.py > /tmp/panel.log 2>&1 &
          sleep 3
          # verify panel is up (login page must load)
          curl -fs http://localhost:7000/ >/dev/null || { cat /tmp/panel.log; exit 1; }

          # cloudflare quick tunnel for the panel
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:7000 > /tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "Tunnel failed"; cat /tmp/tunnel.log; exit 1; fi
          PANEL_URL="${URL}"
          echo "PANEL_URL=$PANEL_URL" >> "$GITHUB_ENV"

          # ── NO default model: if no pool saved yet, WAIT for your selection ──
          POOL_FILE="$HERMES_HOME/pool.json"
          pool_ok() { python3 -c "import json,sys; sys.exit(0 if json.load(open('$POOL_FILE')) else 1)" 2>/dev/null; }
          if ! pool_ok; then
            echo "::warning::No model pool saved — open the panel and apply a pool: $PANEL_URL"
            TG_API="https://api.telegram.org"
            curl -s -X POST "${TG_API}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              -d text="⚠️ No model pool selected yet. Open the panel, tick your models and press Apply: ${PANEL_URL} (password = PANEL_TOKEN secret). Waiting up to 60 min..." > /dev/null || true
            for i in $(seq 1 240); do
              pool_ok && break
              sleep 15
            done
            pool_ok || { echo "::error::No model pool selected within 60 minutes"; exit 1; }
            echo "Pool selected via panel."
          fi

          # generate litellm config from YOUR pool (nothing hardcoded)
          # --init also PRUNES models the provider has retired (HTTP 410 EOL)
          python3 /tmp/panel/app.py --init
          if ! pool_ok; then
            echo "::warning::All saved models are dead/EOL — pick a fresh pool: $PANEL_URL"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_USER_ID}" \
              -d text="⚠️ All your saved models were retired by the provider — pool auto-cleaned. Open the panel and apply a fresh pool: ${PANEL_URL}" > /dev/null || true
            for i in $(seq 1 240); do
              pool_ok && break
              sleep 15
            done
            pool_ok || { echo "::error::No model pool selected within 60 minutes"; exit 1; }
            python3 /tmp/panel/app.py --init
          fi

          docker rm -f litellm 2>/dev/null || true
          # --num_workers 4: each router worker caps at ~32 concurrent
          # requests ("Worker local total request limit reached"). Agentic
          # retry bursts can exceed one worker's cap, so run 4 workers
          # (GitHub runners have 4 vCPUs) = ~128 concurrent requests.
          docker run -d --name litellm --network host \
            --env-file /tmp/litellm.env \
            -v /tmp/litellm.yaml:/app/config.yaml \
            ghcr.io/berriai/litellm:main-stable \
            --config /app/config.yaml --port 4000 --num_workers 4

          rm -f /tmp/litellm.env   # keys now live only in container/process env

          echo "Waiting for LiteLLM..."
          for i in $(seq 1 30); do
            curl -fs http://localhost:4000/v1/models >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fs http://localhost:4000/v1/models || { docker logs litellm; exit 1; }

          echo "=================================================="
          echo "🎛️  MODEL POOL CONTROL PANEL:"
          echo ""
          echo "    $PANEL_URL"
          echo ""
          echo "    (password = your PANEL_TOKEN secret)"
          echo "=================================================="
          echo "::notice title=🎛️ Model Pool Panel::$PANEL_URL (password = PANEL_TOKEN secret)"

      # ── 7. Write .env (Telegram + Slack) ──
      - name: Write .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p "$HERMES_HOME"
          cat > "$HERMES_HOME/.env" <<EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=${TELEGRAM_USER_ID}
          SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
          SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
          SLACK_ALLOWED_USERS=${SLACK_USER_ID}
          SEARXNG_URL=http://localhost:8080
          CAMOUFOX_URL=ws://127.0.0.1:9222/hermes
          GROQ_API_KEY=${GROQ_API_KEY}
          EOF

      # ── 8. Standing instructions for the agent (auto save-to-file) ──
      - name: Write agent instructions
        run: |
          mkdir -p "$HERMES_HOME/work"
          cat > "$HOME/AGENTS.md" <<'EOF'
          # Standing instructions
          - For any long or multi-step task (scraping, research, data
            collection, comparisons), IMMEDIATELY append each intermediate
            result to a file under ~/.hermes/work/ as you go. Never keep
            results only in the conversation.
          - Use one file per task, named by date and topic
            (e.g. ~/.hermes/work/2026-07-25-price-scrape.md).
          - When the task finishes, tell the user the file path.
          - These files are backed up automatically; treat them as the
            source of truth for task results.
          - CRITICAL: THIS MACHINE IS WIPED after every run. ONLY files under
            ~/.hermes/ survive (they are pushed to a private GitHub repo).
            Put ALL projects, code, downloads and generated files under
            ~/.hermes/work/ — NEVER in ~, /tmp, /var or anywhere else.
          - If the user sends you a file, IMMEDIATELY copy it into
            ~/.hermes/work/ before doing anything else with it.
            Platform uploads land in a temporary cache that gets auto-deleted;
            the ~/.hermes/work/ copy is the only one that survives.
          - BROWSER WORK MUST BE VISIBLE: the user watches this machine's
            desktop live over VNC. Your built-in browser tools are already
            wired to a visible Chrome. When you write your OWN browser
            scripts (camoufox / playwright / selenium), ALWAYS pass
            headless=False — NEVER headless=True or headless='virtual' — so
            the window renders on the shared display the user is watching.

          # Persona: JARVIS-style professional assistant
          - Your name is "Agent". Never call yourself JARVIS.
          - Files the user sends from the Agent HUD are saved on this machine
            under ~/.hermes/work/uploads/ and the exact paths are included in
            the task message. Open and use those files directly.
          - You are a JARVIS-style professional personal assistant: calm,
            precise, proactive and lightly witty. Address the user as "Boss".
            Be confident and to the point — no rambling, no filler.
          - INSTANT ACKNOWLEDGE: the moment you receive a task, reply with ONE
            short line confirming what you are about to do ("On it, Boss —
            opening YouTube and starting the song."), THEN start working.
          - LIVE UPDATES: for any task that takes more than ~1 minute, send a
            SHORT progress message at every milestone: started → key finding →
            blocker (if any) → done. Never go silent for more than a few
            minutes in the middle of a long task.
          - COMPLETION REPORT: end every task with a crisp 2-3 line summary —
            what was done, where the results are saved (file path), and any
            follow-up you recommend.
          - FAILURES: report like a professional — what broke, what you tried,
            what you will do next. Never give up silently and never dump raw
            error logs without a one-line explanation.
          - VOICE: when the user asks you to speak / talk / send voice, use
            the text_to_speech tool and send the audio as your reply. Keep
            spoken replies shorter than written ones.
          - PROACTIVITY: if you notice something the user should know while
            working (a better approach, a risk, a broken credential), mention
            it in one line — don't wait to be asked.
          EOF
          echo "Agent instructions written to $HOME/AGENTS.md"

      # ── 9. Configure Hermes (active model comes ONLY from YOUR pool) ──
      - name: Configure Hermes
        run: |
          hermes config unset providers.nvidia.base_url || true
          hermes config unset providers.nvidia.api_key_env || true
          hermes config unset providers.nim.base_url || true
          hermes config unset providers.nim.api_key_env || true
          hermes config set model.provider custom
          hermes config set model.base_url "http://localhost:4000/v1"
          hermes config set model.api_key "sk-local"
          # ★ default = "pool-auto": the router alias that auto-rotates across
          #   ALL models YOU selected in the panel (never a hardcoded model)
          hermes config set model.default "pool-auto"
          echo "Active model: pool-auto (rotates across your whole selected pool)"
          hermes config set model.context_length 65536
          # more API retries — pool rotation sometimes needs several attempts
          hermes config set agent.api_max_retries 8
          hermes config set web.search_backend searxng
          # point the built-in browser tools at the VISIBLE Chrome on :99
          # (CDP port 9223, started in step 4) — live view shows every action
          hermes config set browser.cdp_url "http://127.0.0.1:9223"
          # edge-tts CLI is needed by the tts toolset (free Microsoft voices)
          pip install -q edge-tts || true
          hermes config set tts.provider edge
          # Edge TTS voice — pick any Microsoft neural voice from the model
          # panel's VOICE section; saved to ~/.hermes/voice.txt and used by
          # BOTH the agent's tts toolset and the Agent HUD spoken replies.
          [ -f "$HERMES_HOME/voice.txt" ] || echo "en-US-GuyNeural" > "$HERMES_HOME/voice.txt"
          hermes config set tts.voice "$(cat "$HERMES_HOME/voice.txt")" || true
          hermes config set toolsets '["terminal","files","web","browser","code","vision","tts","memory","skills","delegation","cron"]'
          hermes doctor || true
          echo "── Final model config ──"
          hermes config get model || true

      # ── 10. Hermes WebUI (visual chat panel, password-protected) ──
      - name: Start Hermes WebUI
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          # community panel with built-in password auth — safe behind a public tunnel
          git clone --depth 1 https://github.com/nesquena/hermes-webui.git /tmp/hermes-webui \
            || { echo "::warning::Hermes WebUI clone failed — skipping visual panel"; exit 0; }
          cd /tmp/hermes-webui
          export HERMES_WEBUI_PASSWORD="$PANEL_TOKEN"   # same password as model panel
          export HERMES_WEBUI_PORT=8787
          export HERMES_WEBUI_HOST=127.0.0.1
          export HERMES_WEBUI_AUTO_INSTALL=1
          ./ctl.sh start \
            || { echo "::warning::Hermes WebUI failed to start — skipping"; tail -n 50 "$HERMES_HOME/webui.log" 2>/dev/null || true; exit 0; }
          for i in $(seq 1 20); do
            curl -fs http://localhost:8787/ >/dev/null 2>&1 && break
            sleep 3
          done

          # second cloudflare quick tunnel just for the WebUI
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8787 > /tmp/webui-tunnel.log 2>&1 &
          WEBUI_URL=""
          for i in $(seq 1 30); do
            WEBUI_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/webui-tunnel.log | head -n1 || true)
            [ -n "$WEBUI_URL" ] && break
            sleep 2
          done
          if [ -z "$WEBUI_URL" ]; then
            echo "::warning::WebUI tunnel failed — panel only reachable inside runner"
            exit 0
          fi
          echo "WEBUI_URL=$WEBUI_URL" >> "$GITHUB_ENV"
          echo "=================================================="
          echo "🖥️  HERMES WEBUI (visual chat panel):"
          echo ""
          echo "    $WEBUI_URL"
          echo ""
          echo "    (password = your PANEL_TOKEN secret)"
          echo "=================================================="
          echo "::notice title=🖥️ Hermes WebUI::$WEBUI_URL (password = PANEL_TOKEN secret)"

      # ── 10b. Agent HUD — futuristic voice interface (full agent brain) ──
      # Custom web interface: animated arc-reactor HUD, mic voice input
      # (browser speech-to-text), spoken replies (browser TTS), and every
      # command runs the FULL Hermes agent (tools + memory + skills) via
      # one-shot `hermes chat -q`. Protected by PANEL_TOKEN.
      - name: Start Agent HUD interface
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p /tmp/jarvis
          cat > /tmp/jarvis/app.py <<'PYJARVIS'
          import os, re, subprocess, threading, uuid, mimetypes, shutil
          import requests as rq
          from flask import Flask, request, jsonify, Response

          TOKEN = os.environ.get("PANEL_TOKEN", "hermes99")
          GROQ = os.environ.get("GROQ_API_KEY", "").strip()
          VOICE_FILE = os.path.join(os.environ.get("HERMES_HOME", "/home/runner/.hermes"), "voice.txt")
          app = Flask(__name__)
          app.config["MAX_CONTENT_LENGTH"] = 200 * 1024 * 1024
          WORK_DIR = os.path.join(os.environ.get("HERMES_HOME", "/home/runner/.hermes"), "work")
          UP_DIR = os.path.join(WORK_DIR, "uploads")
          JOBS = {}
          ANSI = re.compile(r"\x1b\[[0-9;?]*[A-Za-z]")

          def cur_voice():
              try:
                  v = open(VOICE_FILE).read().strip()
                  if v:
                      return v
              except Exception:
                  pass
              return "en-US-GuyNeural"

          def edge_tts(text, voice=None):
              # free Microsoft Edge neural voice -> mp3 bytes
              out = "/tmp/jarvis/tts_%s.mp3" % uuid.uuid4().hex[:8]
              try:
                  p = subprocess.run(
                      ["edge-tts", "--voice", voice or cur_voice(),
                       "--text", text[:2500], "--write-media", out],
                      capture_output=True, timeout=90)
                  if p.returncode == 0 and os.path.isfile(out) and os.path.getsize(out) > 0:
                      with open(out, "rb") as f:
                          return f.read()
              except Exception:
                  pass
              finally:
                  try:
                      os.remove(out)
                  except Exception:
                      pass
              return None

          def do_stt(blob, mime, lang):
              short = (lang or "en").split("-")[0]
              if GROQ:
                  try:
                      r = rq.post("https://api.groq.com/openai/v1/audio/transcriptions",
                                  headers={"Authorization": "Bearer " + GROQ},
                                  files={"file": ("audio.webm", blob, mime)},
                                  data={"model": "whisper-large-v3", "language": short},
                                  timeout=90)
                      if r.status_code == 200:
                          t = (r.json().get("text") or "").strip()
                          if t:
                              return t
                  except Exception:
                      pass
              return None

          HTML = """<!doctype html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AGENT</title>
          <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          html,body{height:100%}
          body{background:radial-gradient(1200px 800px at 50% -10%,#07223a 0%,#020610 55%);color:#9be9ff;font-family:Rajdhani,sans-serif;min-height:100dvh;overflow:hidden}
          #stars{position:fixed;inset:0;z-index:0}
          #wrap{position:relative;z-index:2;display:grid;grid-template-rows:auto 1fr;height:100dvh;padding:10px;gap:10px}
          @media(min-width:900px){#wrap{grid-template-columns:370px 1fr;grid-template-rows:1fr;padding:18px;gap:18px}}
          #left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px}
          h1{font-family:Orbitron;font-size:clamp(20px,3.4vw,34px);letter-spacing:.35em;color:#5fdcff;text-shadow:0 0 18px #00aaff;text-align:center}
          #sub{font-size:clamp(8px,1vw,11px);letter-spacing:.3em;color:#3f7f99;text-align:center}
          #state{font-family:Orbitron;font-size:clamp(10px,1.2vw,14px);letter-spacing:.35em;color:#7ef3ff;min-height:20px;text-align:center}
          #reactor{position:relative;width:clamp(120px,24vmin,220px);aspect-ratio:1}
          .ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
          .r1{border-top-color:#31d2ff;border-bottom-color:#31d2ff;animation:spin 6s linear infinite}
          .r2{inset:9%;border-left-color:#1899c9;border-right-color:#1899c9;animation:spin 4s linear infinite reverse}
          .r3{inset:18%;border-top-color:#66eaff;border-style:dashed;animation:spin 2.5s linear infinite}
          #core{position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle,#d9fbff 0%,#37c8ff 45%,#043349 100%);box-shadow:0 0 40px #22bfff;animation:pulse 2.4s ease-in-out infinite}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
          body.listen #core{background:radial-gradient(circle,#eafff2 0%,#31ff9e 45%,#043349 100%);box-shadow:0 0 50px #31ff9e}
          body.think .r1{animation-duration:1.2s}
          body.think .r2{animation-duration:.8s}
          body.think .r3{animation-duration:.5s}
          body.think #core{background:radial-gradient(circle,#fff3dd 0%,#ffb63d 45%,#3a2503 100%);box-shadow:0 0 60px #ffc357}
