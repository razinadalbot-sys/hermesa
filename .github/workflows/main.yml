      # ── 13. Run gateway with time budget + anti-stuck watchdog ──
      - name: Run Hermes gateway
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Shared virtual display :99 (browser + agent GUI + live view all
          # render here; normally started in step 4 — this is just a safety
          # net). Every terminal the agent opens inherits DISPLAY=:99.
          if ! pgrep -f "Xvfb :99" >/dev/null; then
            Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb99.log 2>&1 &
            sleep 2
          fi
          export DISPLAY=:99

          # ── SMART SESSION RESET ──
          # Only start a fresh chat session when the saved context is actually
          # huge. Blindly resetting every run loses the conversation the user
          # was in the middle of — that caused real data loss before.
          python3 - <<'PYSESS'
          import json, os, re, sqlite3
          home = os.path.expanduser("~/.hermes")
          sf = os.path.join(home, "sessions", "sessions.json")
          db = os.path.join(home, "state.db")
          try:
              raw = open(sf).read()
              ids = set(re.findall(r"\d{8}_\d{6}_[0-9a-f]+", raw))
              worst = 0
              if ids and os.path.exists(db):
                  con = sqlite3.connect(db)
                  for sid in ids:
                      n = con.execute(
                          "SELECT COALESCE(SUM(token_count),0) FROM messages WHERE session_id=?",
                          (sid,),
                      ).fetchone()[0]
                      worst = max(worst, n or 0)
                  con.close()
              if worst > 45000:
                  os.remove(sf)
                  print("session context too big (%d tokens) - fresh session" % worst)
              else:
                  print("keeping sessions (max %d tokens)" % worst)
          except Exception as e:
              print("session check skipped:", e)
          PYSESS

          # watchdog: if the LiteLLM router hangs (rate-limit deadlock etc.),
          # auto-restart it — no more force-stopping the whole Action run
          cat > /tmp/watchdog.sh <<'EOF'
          #!/bin/bash
          fails=0
          while true; do
            sleep 60
            # ZOMBIE detection: LiteLLM's per-worker request counter can LEAK
            # (climbs 39 -> 80 -> 272 and never resets). The catalog endpoint
            # still answers, so a plain health check passes while every real
            # completion gets 500 "Worker local total request limit reached".
            # Restart immediately when that error shows up in recent logs.
            if docker logs litellm --since 90s 2>&1 | grep -q "Worker local total request limit reached"; then
              echo "$(date) Router counter leak detected — restarting litellm container"
              # -t 2: kill fast. Default docker restart waits 10s for graceful
              # stop; that downtime is what burns the gateway's quick retries.
              docker restart -t 2 litellm >/dev/null 2>&1 || true
              fails=0
              continue
            fi
            if curl -fs -m 15 http://localhost:4000/v1/models >/dev/null 2>&1; then
              fails=0
            else
              fails=$((fails+1))
              echo "$(date) LiteLLM health check failed ($fails/3)"
              if [ "$fails" -ge 3 ]; then
                echo "$(date) Router stuck — restarting litellm container"
                docker restart -t 2 litellm >/dev/null 2>&1 || true
                fails=0
              fi
            fi
          done
          EOF
          chmod +x /tmp/watchdog.sh
          nohup /tmp/watchdog.sh > /tmp/watchdog.log 2>&1 &

          # ── TELEGRAM POLLING SLOT RECLAIM ──
          # When a previous run dies by SIGKILL / OOM / VM death, no exit path
          # runs, so Telegram keeps that dead session's getUpdates slot open.
          # Every new gateway then hits "Conflict: terminated by other
          # getUpdates request" and gives up fatally. Issuing our OWN getUpdates
          # call evicts the stale poller, so we claim the slot BEFORE starting.
          TG_HOST="api.telegram.org"
          tg_claim() {
            if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
              echo "No bot token in env - skipping Telegram slot reclaim"
              return 0
            fi
            TG_API="https://${TG_HOST}/bot${TELEGRAM_BOT_TOKEN}"
            # keep pending messages: anything sent while we were down still arrives
            curl -s -m 20 "${TG_API}/deleteWebhook" -d "drop_pending_updates=false" >/dev/null 2>&1 || true
            ok=0
            i=0
            while [ "$i" -lt 12 ]; do
              i=$((i+1))
              resp=$(curl -s -m 25 "${TG_API}/getUpdates?offset=-1&timeout=0" 2>/dev/null || echo "")
              case "$resp" in
                *'"ok":true'*)
                  ok=$((ok+1))
                  echo "  Telegram slot free (confirm $ok/2)"
                  ;;
                *Conflict*)
                  ok=0
                  echo "  Stale poller still holding the slot (attempt $i/12) - evicting"
                  ;;
                *)
                  ok=0
                  echo "  Telegram unreachable or error (attempt $i/12)"
                  ;;
              esac
              if [ "$ok" -ge 2 ]; then
                echo "Telegram polling slot reclaimed - safe to start gateway."
                return 0
              fi
              sleep 5
            done
            echo "::warning::Telegram slot still contested after 12 attempts - starting anyway"
            return 0
          }

          # Kill any Hermes/gateway leftovers from an earlier attempt in THIS vm
          # before we claim the slot, so we never fight ourselves.
          pkill -f "hermes gateway" >/dev/null 2>&1 || true
          sleep 2

          # Manual run-hours input (short test runs). Clamped 6..345 min so a
          # typo can neither instant-kill the run nor blow past the GitHub 6h
          # job limit (job timeout-minutes: 350). Empty input = default 330.
          if [ -n "$RUN_HOURS_INPUT" ]; then
            RUN_MINUTES=$(awk -v h="$RUN_HOURS_INPUT" 'BEGIN{m=int(h*60+0.5); if(m<6)m=6; if(m>345)m=345; print m}')
            echo "Manual duration selected: ${RUN_HOURS_INPUT}h -> ${RUN_MINUTES} minutes"
          fi
          JOB_START=$(cat /tmp/job_start)
          END=$(( JOB_START + RUN_MINUTES * 60 ))
          while true; do
            NOW=$(date +%s)
            REMAIN=$(( (END - NOW) / 60 ))
            if [ "$REMAIN" -le 2 ]; then
              echo "Time budget exhausted"; break
            fi
            # keep "pool-auto" as default on every gateway (re)start — it
            # always reflects the CURRENT pool you applied from the panel
            hermes config set model.default "pool-auto" || true
            tg_claim
            echo "Starting gateway (${REMAIN}m remaining)..."
            timeout -k 60 "${REMAIN}m" hermes gateway || true
            # 60s (not 10s): Telegram holds the previous gateway's getUpdates
            # session open for up to ~1 min after a crash. Restarting too fast
            # causes "Conflict: terminated by other getUpdates request" and a
            # fatal polling-conflict loop.
            # tg_claim already frees the slot, so no need to idle a full
            # minute; a short pause just avoids a hot crash-loop.
            pkill -f "hermes gateway" >/dev/null 2>&1 || true
            echo "Gateway exited, reclaiming Telegram slot and restarting in 15s..."
            sleep 15
          done

      # ── 13b. EMERGENCY SAVE ──
      # Runs first on ANY exit - including "Cancel workflow". Small and fast
      # (seconds), so skills / brain / tasks / memory reach the repo even when
      # the runner is about to be killed and the big final push never finishes.
      - name: Emergency state save
        if: always()
        timeout-minutes: 4
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          [ -f /tmp/save.env ] && . /tmp/save.env || true
          export HERMES_HOME="${HERMES_HOME:-/home/runner/.hermes}"
          export DATA_REPO="$DATA_REPO" DATA_REPO_TOKEN="$DATA_REPO_TOKEN"
          if [ -x /tmp/hotsave.sh ]; then
            /tmp/hotsave.sh || echo "::warning::hot save failed"
          else
            echo "::warning::hotsave.sh missing - nothing to save yet"
          fi

      # ── 14. Final push to data repo (main) ──
      - name: Final data push
        if: always()
        timeout-minutes: 12
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # ── STATE MIRROR: capture EVERYTHING Hermes stores outside the tree ──
          # skills / brain / tasks / memory / config live in the (excluded)
          # agent dir and in ~/.config, ~/.local — mirror them INTO ~/.hermes
          # so every backup push carries them to the privatestorage repo.
          mkdir -p "$HERMES_HOME/xdg-mirror/config" "$HERMES_HOME/xdg-mirror/share" "$HERMES_HOME/xdg-mirror/state" "$HERMES_HOME/agent-state"
          for d in "$HOME/.config"/hermes* "$HOME/.config"/nous*; do [ -e "$d" ] && rsync -a --delete "$d" "$HERMES_HOME/xdg-mirror/config/" || true; done
          for d in "$HOME/.local/share"/hermes* "$HOME/.local/share"/nous*; do [ -e "$d" ] && rsync -a --delete "$d" "$HERMES_HOME/xdg-mirror/share/" || true; done
          for d in "$HOME/.local/state"/hermes* "$HOME/.local/state"/nous*; do [ -e "$d" ] && rsync -a --delete "$d" "$HERMES_HOME/xdg-mirror/state/" || true; done
          for d in skills skill brain brains memory memories tasks task knowledge notes sessions session prompts plugins agents config configs data db; do
            [ -e "$HERMES_HOME/hermes-agent/$d" ] && rsync -a --delete "$HERMES_HOME/hermes-agent/$d" "$HERMES_HOME/agent-state/" || true
          done
          find "$HERMES_HOME/hermes-agent" -maxdepth 1 -type f \( -name '*.json' -o -name '*.yaml' -o -name '*.yml' -o -name '*.md' -o -name '*.txt' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -exec cp -a {} "$HERMES_HOME/agent-state/" \; 2>/dev/null || true
          # critical state first - if this step gets killed mid-way, the
          # important files are already safely on the `hot` branch
          [ -x /tmp/hotsave.sh ] && /tmp/hotsave.sh || true
          rm -rf /tmp/final && mkdir -p /tmp/final
          rsync -a --exclude='.env' --exclude='.git' --exclude='*.log' --exclude='hermes-agent' \
            --exclude='browser-profile/cache2' --exclude='browser-profile/startupCache' \
            --exclude='browser-profile/shader-cache' \
            --exclude='chrome-profile/Default/Cache' --exclude='chrome-profile/Default/Code Cache' \
            --exclude='chrome-profile/Default/GPUCache' --exclude='chrome-profile/ShaderCache' \
            --exclude='chrome-profile/GraphiteDawnCache' \
            "$HERMES_HOME/" /tmp/final/ || true
          cd /tmp/final
          find . -type f -size +90M | while read -r f; do
            split -b 90M -d -a 3 "$f" "$f.gh-chunk."
            rm -f "$f"
          done
          cat > .gitignore <<'EOF'
          .env
          *.log
          EOF
          echo "# Hermes final save (main) - saved $(date -u +%FT%TZ)" > BACKUP-STATUS.md
          echo "- skills: $(find skills -name SKILL.md 2>/dev/null | wc -l) skill file(s)" >> BACKUP-STATUS.md
          echo "- memory files: $(find memories -type f 2>/dev/null | wc -l)" >> BACKUP-STATUS.md
          echo "- session db: $(du -h state.db 2>/dev/null | cut -f1)" >> BACKUP-STATUS.md
          echo "- total size: $(du -sh . 2>/dev/null | cut -f1)" >> BACKUP-STATUS.md
          git init -q -b main
          git config user.email "bot@hermes" && git config user.name "hermes-bot"
          git add -A && git commit -q -m "final save $(date -u +%FT%TZ)" || true
          git push -f "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" main

      # ── 16. Notify failure ──
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          TG_API="https://api.telegram.org"
          curl -s -X POST "${TG_API}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            --data-urlencode text="🔴 Hermes Agent run FAILED — check Actions logs" > /dev/null
