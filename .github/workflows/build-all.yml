name: Build All Apps

# ============================================================================
# ONE run builds the Android APK + the Windows desktop app (optionally Linux /
# macOS too). Push the WHOLE bundle to ONE GitHub repository - the repo root
# must contain the `desktop/` and `app/` folders side by side:
#
#   your-repo/
#     .github/workflows/build-all.yml   <- this file
#     desktop/   (Flutter app -> Windows / Linux / macOS)
#     app/       (native Android app -> APK)
#     index.html, zedge1..4.yml, ...
#
# Then:  GitHub -> Actions -> "Build All Apps" -> Run workflow
#        -> pick targets (default: android+windows) -> Run workflow.
# When it finishes: open the run -> Artifacts -> download the APK and/or the
# Windows installer / portable zip.
#
# Tag a version to publish ONE GitHub Release with everything attached:
#   git tag v27.13.0 && git push --tags
#
# Per-person setting: BUILD_PROFILE below (e.g. shimul) - it is
# compiled into the desktop app and used in the artifact file names.
#
# Android signing secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# If they are NOT set, a throwaway keystore is generated so the APK is still
# installable for testing - but every build gets a different key, so users
# won't be able to update in place. Add real secrets before distributing.
#
# The old per-folder workflows (desktop/.github/workflows/build-desktop.yml
# and app/.github/workflows/release-apk.yml) still work if you push each
# folder as its own repo; GitHub ignores them when you use this unified file
# (workflows are only read from the repo root's .github/workflows).
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to build"
        type: choice
        default: android+windows
        options:
          - android+windows
          - android
          - windows
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release on tag pushes

env:
  # --- per-person: change to your profile name (e.g. shimul) ---
  BUILD_PROFILE: shimul
  # --- Flutter desktop settings (pinned on purpose: newer stable releases made
  # `IconData` a final class, which breaks font_awesome_flutter 10.x) ---
  FLUTTER_VERSION: "3.35.x"
  FLUTTER_CHANNEL: stable
  # Sub-folder that contains the desktop pubspec.yaml, or "auto" to find it
  # (repo root, ./desktop or ./automation_hub_desktop).
  PROJECT_DIR: auto
  # --- Android settings ---
  GRADLE_VERSION: "8.9"

jobs:
  # --------------------------------------------------------------- Android
  android:
    name: Android APK
    if: ${{ github.event_name == 'push' || inputs.targets == 'android+windows' || inputs.targets == 'android' || inputs.targets == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_DIR: app   # the Gradle project lives in ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        # The repo ships without gradlew / gradle-wrapper.jar, so we install
        # Gradle directly. Also enables dependency + build caching.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Prepare signing keystore
        id: keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_PATH="$RUNNER_TEMP/release.keystore"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Using keystore from repository secrets."
            echo "${KEYSTORE_BASE64}" | base64 --decode > "$KS_PATH"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS}"                 >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"           >> "$GITHUB_ENV"
            echo "signed_with=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found - generating a throwaway keystore. Add signing secrets before distributing this APK."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" -storetype PKCS12 \
              -alias contentstudio -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tempstorepass -keypass tempstorepass \
              -dname "CN=Content Studio CI, OU=CI, O=ContentStudio, C=US"
            echo "KEYSTORE_PASSWORD=tempstorepass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=contentstudio"         >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=tempstorepass"     >> "$GITHUB_ENV"
            echo "signed_with=throwaway" >> "$GITHUB_OUTPUT"
          fi

          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleRelease
          fi

      - name: Collect APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under app/build/outputs/apk/release"
            exit 1
          fi

          # Pull versionName from app/build.gradle.kts, fall back to the tag / run number
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          OUT_NAME="MetaHawladar-${BUILD_PROFILE}-v${VERSION}-release.apk"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$APK" "$RUNNER_TEMP/dist/$OUT_NAME"

          echo "Built: $OUT_NAME ($(du -h "$APK" | cut -f1))"
          echo "path=$RUNNER_TEMP/dist/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    if: ${{ github.event_name == 'push' || inputs.targets == 'android+windows' || inputs.targets == 'windows' || inputs.targets == 'all' }}
    # windows-2022 = Visual Studio 2022 (v17). `windows-latest` now ships
    # Visual Studio 2026 (v18), which Flutter 3.35 does not detect
    # ("could not find any instance of Visual Studio").
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: dir
        shell: bash
        run: |
          set -euo pipefail
          DIR="${PROJECT_DIR}"
          if [ "$DIR" = "auto" ]; then
            for c in . desktop automation_hub_desktop; do
              if [ -f "$c/pubspec.yaml" ]; then DIR="$c"; break; fi
            done
          fi
          if [ ! -f "$DIR/pubspec.yaml" ]; then echo "::error::pubspec.yaml not found"; exit 1; fi
          VERSION=$(grep -E '^version:' "$DIR/pubspec.yaml" | head -n1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR  version: $VERSION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Windows runner (first time only)
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-windows-desktop
          if [ ! -d windows ]; then
            flutter create . --platforms=windows --project-name automation_hub_desktop --org com.automationhub
            # v40.6: `flutter create` adds a default test/widget_test.dart that uses MyApp -> analyze fails
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi

      - name: Apply app icon + product name (replaces the Flutter default icon)
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cp -f assets/icon/app_icon.ico windows/runner/resources/app_icon.ico
          # exe metadata shown in Properties / Task Manager
          sed -i 's/VALUE "FileDescription", "automation_hub_desktop"/VALUE "FileDescription", "Meta Hawladar - Zedge Content Studio"/; s/VALUE "ProductName", "automation_hub_desktop"/VALUE "ProductName", "Meta Hawladar"/; s/VALUE "CompanyName", "com.automationhub"/VALUE "CompanyName", "Meta Hawladar"/' windows/runner/Runner.rc || true
          ls -la windows/runner/resources/
          # exe name (MetaHawladar.exe instead of automation_hub_desktop.exe) + initial window title
          sed -i 's/set(BINARY_NAME "automation_hub_desktop")/set(BINARY_NAME "MetaHawladar")/' windows/CMakeLists.txt || true
          sed -i 's/L"automation_hub_desktop"/L"Meta Hawladar"/g' windows/runner/main.cpp || true
          grep -n BINARY_NAME windows/CMakeLists.txt | head -n 2

      - name: Pub get
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter pub get

      - name: Analyze (errors only)
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: bash
        run: |
          # v40.6: drop Flutter's default test (uses MyApp, which this app does not have)
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter build windows --release --dart-define=BUILD=${{ env.BUILD_PROFILE }}

      - name: Package
        id: pkg
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: pwsh
        run: |
          $out = "MetaHawladar-${env:BUILD_PROFILE}-windows-x64-v${{ steps.dir.outputs.version }}"
          $rel = Get-ChildItem -Directory -Recurse build/windows | Where-Object { $_.FullName -match 'runner\\Release$' } | Select-Object -First 1
          if (-not $rel) { Write-Error "Release folder not found under build/windows"; exit 1 }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/dist/$out" | Out-Null
          Copy-Item -Path "$($rel.FullName)/*" -Destination "$env:RUNNER_TEMP/dist/$out" -Recurse
          Copy-Item -Path README.md -Destination "$env:RUNNER_TEMP/dist/$out/README.md" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:RUNNER_TEMP/dist/$out" -DestinationPath "$env:RUNNER_TEMP/dist/$out.zip" -Force
          "path=$env:RUNNER_TEMP/dist/$out.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $out.zip"

      - name: Upload artifact (portable zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Real Windows installer (setup.exe) built with Inno Setup 6, which is
      # pre-installed on the GitHub windows runners. Script + wizard images
      # live in installer/ (installer/windows.iss).
      - name: Build Windows installer (Inno Setup)
        id: inst
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: pwsh
        run: |
          # exit codes are checked explicitly below (native stderr chatter must not abort the step)
          $ErrorActionPreference = "Continue"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found on runner - installing via Chocolatey"
            choco install innosetup --no-progress -y | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found at $iscc"; exit 1 }
          $rel = Get-ChildItem -Directory -Recurse build/windows | Where-Object { $_.FullName -match 'runner\\Release$' } | Select-Object -First 1
          if (-not $rel) { Write-Error "Release folder not found under build/windows"; exit 1 }
          $ver  = "${{ steps.dir.outputs.version }}"
          $name = "MetaHawladar-${env:BUILD_PROFILE}-windows-x64-setup-v$ver"
          $outDir = Join-Path $env:RUNNER_TEMP "dist-installer"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exeFile = Get-ChildItem -Path $rel.FullName -Filter *.exe -File | Select-Object -First 1
          if (-not $exeFile) { Write-Error "No .exe in $($rel.FullName)"; exit 1 }
          & $iscc "/DMyAppExeName=$($exeFile.Name)" "/DMyAppVersion=$ver" "/DMyProfile=${env:BUILD_PROFILE}" "/DMySourceDir=$($rel.FullName)" "/DMyOutputDir=$outDir" "/DMyOutputBaseFilename=$name" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed ($LASTEXITCODE)"; exit 1 }
          $exe = Join-Path $outDir "$name.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installer not produced: $exe"; exit 1 }
          Get-Item $exe | Format-List Name, Length
          "path=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $name.exe"

      - name: Upload artifact (Windows installer)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inst.outputs.name }}
          path: ${{ steps.inst.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux x64
    if: ${{ github.event_name == 'push' || inputs.targets == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: dir
        run: |
          set -euo pipefail
          DIR="${PROJECT_DIR}"
          if [ "$DIR" = "auto" ]; then
            for c in . desktop automation_hub_desktop; do
              if [ -f "$c/pubspec.yaml" ]; then DIR="$c"; break; fi
            done
          fi
          if [ ! -f "$DIR/pubspec.yaml" ]; then echo "::error::pubspec.yaml not found"; exit 1; fi
          VERSION=$(grep -E '^version:' "$DIR/pubspec.yaml" | head -n1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Linux runner (first time only)
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          if [ ! -d linux ]; then
            flutter create . --platforms=linux --project-name automation_hub_desktop --org com.automationhub
            # v40.6: `flutter create` adds a default test/widget_test.dart that uses MyApp -> analyze fails
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi

      - name: Apply app icon (GTK window icon)
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          # app_icon_256.png ships inside flutter_assets; my_application.cc sets it on the GTK window at start-up
          python3 - <<'PY'
          p = 'linux/runner/my_application.cc'
          s = open(p).read()
          if 'app_icon_256.png' not in s:
              hook = 'gtk_widget_show(GTK_WIDGET(window));'
              inject = hook + '''
            {
              g_autofree gchar* exe = g_file_read_link("/proc/self/exe", nullptr);
              if (exe != nullptr) {
                g_autofree gchar* dir = g_path_get_dirname(exe);
                g_autofree gchar* icon = g_build_filename(dir, "data", "flutter_assets", "assets", "icon", "app_icon_256.png", nullptr);
                gtk_window_set_icon_from_file(window, icon, nullptr);
              }
            }'''
              s = s.replace(hook, inject, 1)
              open(p, 'w').write(s)
          PY
          sed -i 's/"automation_hub_desktop"/"Meta Hawladar"/g' linux/runner/my_application.cc || true
          grep -n "app_icon_256" linux/runner/my_application.cc || echo "::warning::could not patch my_application.cc (default icon kept)"

      - name: Pub get
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter pub get

      - name: Build Linux release
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter build linux --release --dart-define=BUILD=${{ env.BUILD_PROFILE }}

      - name: Package
        id: pkg
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          OUT="MetaHawladar-${BUILD_PROFILE}-linux-x64-v${{ steps.dir.outputs.version }}"
          BUNDLE=$(find build/linux -type d -path '*/release/bundle' | head -n1)
          [ -n "$BUNDLE" ] || { echo "::error::bundle not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist/$OUT"
          cp -r "$BUNDLE"/. "$RUNNER_TEMP/dist/$OUT/"
          cp README.md "$RUNNER_TEMP/dist/$OUT/" || true
          tar -C "$RUNNER_TEMP/dist" -czf "$RUNNER_TEMP/dist/$OUT.tar.gz" "$OUT"
          echo "path=$RUNNER_TEMP/dist/$OUT.tar.gz" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS (universal)
    if: ${{ github.event_name == 'push' || inputs.targets == 'all' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: dir
        run: |
          set -euo pipefail
          DIR="${PROJECT_DIR}"
          if [ "$DIR" = "auto" ]; then
            for c in . desktop automation_hub_desktop; do
              if [ -f "$c/pubspec.yaml" ]; then DIR="$c"; break; fi
            done
          fi
          if [ ! -f "$DIR/pubspec.yaml" ]; then echo "::error::pubspec.yaml not found"; exit 1; fi
          VERSION=$(grep -E '^version:' "$DIR/pubspec.yaml" | head -n1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate macOS runner (first time only)
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          flutter config --enable-macos-desktop
          if [ ! -d macos ]; then
            flutter create . --platforms=macos --project-name automation_hub_desktop --org com.automationhub
            # v40.6: `flutter create` adds a default test/widget_test.dart that uses MyApp -> analyze fails
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi
          # app icon (replaces the Flutter default icon set)
          ICONSET=macos/Runner/Assets.xcassets/AppIcon.appiconset
          for s in 16 32 64 128 256 512 1024; do cp -f "assets/icon/macos/app_icon_$s.png" "$ICONSET/app_icon_$s.png"; done
          sed -i '' 's/PRODUCT_NAME = automation_hub_desktop/PRODUCT_NAME = Meta Hawladar/' macos/Runner/Configs/AppInfo.xcconfig || true
          # The app talks to Firebase / R2 / GitHub and opens local files.
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            if ! grep -q 'com.apple.security.network.client' "$f"; then
              /usr/libexec/PlistBuddy -c 'Add :com.apple.security.network.client bool true' "$f"
            fi
            if ! grep -q 'com.apple.security.files.user-selected.read-write' "$f"; then
              /usr/libexec/PlistBuddy -c 'Add :com.apple.security.files.user-selected.read-write bool true' "$f"
            fi
          done

      - name: Pub get
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter pub get

      - name: Build macOS release
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter build macos --release --dart-define=BUILD=${{ env.BUILD_PROFILE }}

      - name: Package
        id: pkg
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          OUT="MetaHawladar-${BUILD_PROFILE}-macos-v${{ steps.dir.outputs.version }}"
          APP=$(find build/macos -type d -name '*.app' -path '*/Release/*' | head -n1)
          [ -n "$APP" ] || { echo "::error::.app not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/dist/$OUT.zip"
          echo "path=$RUNNER_TEMP/dist/$OUT.zip" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------- Release (tags only)
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Meta Hawladar ${{ github.ref_name }} (${{ env.BUILD_PROFILE }})
          files: dist/**
          generate_release_notes: true
          body: |
            Meta Hawladar **${{ github.ref_name }}** - profile `${{ env.BUILD_PROFILE }}` - Android + Desktop, built in one run.

            * **Android**: install `MetaHawladar-...-release.apk` (Min Android 8.0 / API 26). Signed with the repo keystore secrets if set, otherwise a throwaway CI key (reinstall needed on key change).
            * **Windows (recommended)**: run `MetaHawladar-...-windows-x64-setup-v....exe` -> Next -> Install (Start-menu + Desktop shortcut, uninstall from Apps & features). Unsigned build: if SmartScreen shows "Windows protected your PC", click *More info -> Run anyway*.
            * **Windows portable**: extract `MetaHawladar-...-windows-x64-v....zip` and run `MetaHawladar.exe` (keep all files together).
            * **Ubuntu / Debian** (`all` targets only): `MetaHawladar-...-linux-x64-v....deb` -> right-click -> Open With "Software Install" -> Install. App appears in the app menu as "Meta Hawladar".
            * **macOS** (`all` targets only): unzip, right-click the app -> Open (unsigned build).
