name: ChatGPT API Server (Cloudflare Tunnel)

# Turns the ChatGPT website into an OpenAI-compatible API behind a
# Cloudflare quick tunnel AND auto-connects it to Hermes:
# when the tunnel URL is ready, it is published into the same Firebase
# vault the config website uses (CUSTOM_API_BASE). The Hermes runner's
# vault-sync picks it up within ~1 min and the pool router starts
# routing to it LIVE - no restart, no copy-paste.
#
# To use it as a model: config website -> Model pool -> Web-API models
# -> add "chatgpt" -> tick it -> Apply pool. After that it behaves like
# any other pool model (also inside pool-auto rotation, as fallback).

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Yahoo Email (optional, defaults to configured secret/value)"
        required: false
        default: ""
      app_password:
        description: "Yahoo 16-character App Password (optional)"
        required: false
        default: ""

jobs:
  run-chatgpt-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Max runtime for GitHub Actions (6 hours)

    env:
      # no hardcoded defaults - pass via run inputs, repo secrets, or the vault
      EMAIL: ${{ inputs.email || secrets.CHATGPT_EMAIL || secrets.EMAIL || '' }}
      YAHOO_APP_PASSWORD: ${{ inputs.app_password || secrets.CHATGPT_APP_PASSWORD || secrets.YAHOO_APP_PASSWORD || '' }}
      PORT: 3000
      # auto-connect to Hermes: the SAME Firebase vault the config website uses
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
      FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
      FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies & Google Chrome & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl xvfb ca-certificates gnupg
          # Ensure Google Chrome is installed
          if ! command -v google-chrome &> /dev/null; then
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Install NPM Packages & Patchright
        run: |
          npm install patchright imapflow mailparser
          npx patchright install chrome || true

      - name: Create Self-Contained OpenAI-Compatible API Server
        run: |
          cat << 'EOF' > server.js
          const http = require("http");
          const path = require("path");
          const { chromium } = require("patchright");
          const { ImapFlow } = require("imapflow");
          const { simpleParser } = require("mailparser");
          const fs = require("fs");
          const os = require("os");
          const https = require("https");

          // NO hardcoded credentials - login identity comes from the config website
          // (vault keys CHATGPT_EMAIL + CHATGPT_APP_PASSWORD) or repo secrets.
          const EMAIL = (process.env.EMAIL || "").trim();
          const YAHOO_APP_PASSWORD = (process.env.YAHOO_APP_PASSWORD || "").replace(/\s+/g, "");
          if (!EMAIL || !YAHOO_APP_PASSWORD) {
            console.error("[Config] ChatGPT login credentials missing.");
            console.error("[Config] Set 'ChatGPT login email' + 'Yahoo app password' on the config website (Web-API section), then start a new run.");
            process.exit(1);
          }
          const PORT = process.env.PORT || 3000;
          const LOGIN_URL = "https://chatgpt.com/auth/login";
          const USER_DATA_DIR = path.join(__dirname, "chrome-profile");

          let pageInstance = null;
          let isReady = false;

          // Request queue to process prompts sequentially without browser conflicts
          const queue = [];
          let processing = false;

          function extractOtp(parsed) {
            const body = `${parsed.subject ?? ""}\n${parsed.text ?? ""}\n${parsed.html ?? ""}`;
            const match = body.match(/\b(\d{6})\b/);
            return match ? match[1] : null;
          }

          async function waitForOtp(sinceDate) {
            const client = new ImapFlow({
              host: "imap.mail.yahoo.com",
              port: 993,
              secure: true,
              auth: { user: EMAIL, pass: YAHOO_APP_PASSWORD },
              logger: false,
            });
            await client.connect();
            const lock = await client.getMailboxLock("INBOX");
            try {
              const scanForOtp = async () => {
                const uids = await client.search({ since: sinceDate, from: "openai.com" });
                if (!uids || uids.length === 0) return null;
                for (const uid of uids.sort((a, b) => b - a)) {
                  const { content } = await client.download(uid);
                  const parsed = await simpleParser(content);
                  if (parsed.date && parsed.date < sinceDate) continue;
                  const otp = extractOtp(parsed);
                  if (otp) return otp;
                }
                return null;
              };
              let otp = await scanForOtp();
              if (otp) return otp;
              console.log("[IMAP] Waiting for OTP email push...");
              otp = await new Promise((resolve, reject) => {
                client.on("exists", async () => {
                  try {
                    const found = await scanForOtp();
                    if (found) resolve(found);
                  } catch (err) {
                    reject(err);
                  }
                });
                client.on("error", reject);
                client.on("close", () => reject(new Error("IMAP connection closed.")));
              });
              return otp;
            } finally {
              lock.release();
              await client.logout().catch(() => {});
            }
          }

          async function initBrowser() {
            console.log("[Browser] Launching Patchright Chrome...");
            const context = await chromium.launchPersistentContext(USER_DATA_DIR, {
              channel: "chrome",
              headless: false,
              viewport: { width: 1280, height: 800 },
              args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"],
            });
            context.setDefaultTimeout(0);
            context.setDefaultNavigationTimeout(0);
            const page = context.pages()[0] || (await context.newPage());
            pageInstance = page;
            console.log("[Browser] Opening ChatGPT login page...");
            await page.goto(LOGIN_URL, { waitUntil: "domcontentloaded" });
            const composer = page.locator("#prompt-textarea");
            const emailInput = page.locator('input[type="email"][name="email"]');
            await Promise.race([
              emailInput.waitFor({ state: "visible" }),
              composer.waitFor({ state: "visible" }),
            ]);
            const alreadyLoggedIn = await composer.isVisible().catch(() => false);
            if (!alreadyLoggedIn) {
              console.log("[Auth] Entering email: " + EMAIL);
              await emailInput.click();
              await emailInput.pressSequentially(EMAIL, { delay: 50 });
              const sinceDate = new Date(Date.now() - 30_000);
              await page.locator('form button[type="submit"]').click();
              console.log("[Auth] Waiting for OTP input...");
              const codeInput = page.locator('input[name="code"]');
              await codeInput.waitFor({ state: "visible" });
              const otp = await waitForOtp(sinceDate);
              console.log("[Auth] Submitting OTP: " + otp);
              await codeInput.click();
              await codeInput.pressSequentially(otp, { delay: 80 });
              await page.locator('button[name="intent"][value="validate"]').click();
              await composer.waitFor({ state: "visible" });
            }
            console.log("[Browser] ✅ ChatGPT is logged in and ready!");
            isReady = true;
          }

          // ── Vision support ───────────────────────────────────────────
          // The ChatGPT WEBSITE supports images natively, so we accept the
          // standard OpenAI vision format (content parts with image_url:
          // data:base64 or http URLs), save them to temp files, and attach
          // them to the composer like a human would. To any client this
          // looks like a normal vision model.

          function contentToText(content) {
            if (typeof content === "string") return content;
            if (Array.isArray(content))
              return content
                .filter((p) => p && p.type === "text")
                .map((p) => p.text || "")
                .join("\n");
            return "";
          }

          function collectImageUrls(messages) {
            const urls = [];
            for (const m of messages) {
              if (!m || m.role !== "user" || !Array.isArray(m.content)) continue;
              for (const p of m.content) {
                if (p && p.type === "image_url") {
                  const u = typeof p.image_url === "string" ? p.image_url : (p.image_url && p.image_url.url);
                  if (u) urls.push(u);
                }
              }
            }
            return urls;
          }

          function fetchUrl(url, redirects = 3) {
            return new Promise((resolve, reject) => {
              const mod = url.startsWith("http:") ? http : https;
              mod.get(url, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location && redirects > 0) {
                  res.resume();
                  return resolve(fetchUrl(res.headers.location, redirects - 1));
                }
                if (res.statusCode !== 200) { res.resume(); return reject(new Error("HTTP " + res.statusCode)); }
                const chunks = [];
                res.on("data", (c) => chunks.push(c));
                res.on("end", () => resolve(Buffer.concat(chunks)));
                res.on("error", reject);
              }).on("error", reject);
            });
          }

          async function materializeImages(urls) {
            const files = [];
            for (const u of urls.slice(0, 4)) { // ChatGPT-safe cap per message
              try {
                let buf, ext = "png";
                if (u.startsWith("data:")) {
                  const m = u.match(/^data:image\/([a-zA-Z0-9.+-]+);base64,(.*)$/s);
                  if (!m) continue;
                  ext = m[1].toLowerCase().replace("jpeg", "jpg").split("+")[0];
                  buf = Buffer.from(m[2], "base64");
                } else if (/^https?:\/\//.test(u)) {
                  buf = await fetchUrl(u);
                  const em = u.split("?")[0].match(/\.(png|jpe?g|webp|gif)$/i);
                  ext = em ? em[1].toLowerCase().replace("jpeg", "jpg") : "png";
                } else continue;
                const f = path.join(os.tmpdir(), "img-" + Date.now() + "-" + Math.random().toString(36).slice(2) + "." + ext);
                fs.writeFileSync(f, buf);
                files.push(f);
              } catch (e) {
                console.error("[Vision] image load failed:", e.message);
              }
            }
            return files;
          }

          async function askChatGPT(prompt, imageFiles = []) {
            const page = pageInstance;
            const composer = page.locator("#prompt-textarea");
            const prevAssistantCount = await page
              .locator('[data-message-author-role="assistant"]')
              .count();
            await composer.waitFor({ state: "visible" });
            if (imageFiles.length > 0) {
              console.log(`[Vision] Attaching ${imageFiles.length} image(s)...`);
              const fileInput = page.locator('input[type="file"]').first();
              await fileInput.setInputFiles(imageFiles);
              // wait for uploads to finish: the send button stays disabled
              // while an image is uploading
              await page.waitForTimeout(1500);
              const sendProbe = page.locator(
                'button[data-testid="send-button"], button[aria-label="Send prompt"], button[data-testid="fruitjuice-send-button"]'
              );
              for (let i = 0; i < 60; i++) {
                const enabled = await sendProbe.isEnabled().catch(() => false);
                if (enabled) break;
                await page.waitForTimeout(1000);
              }
            }
            await composer.click();
            await composer.fill("");
            await page.keyboard.insertText(prompt || "Describe the attached image(s).");
            await page.waitForTimeout(300);
            const sendBtn = page.locator(
              'button[data-testid="send-button"], button[aria-label="Send prompt"], button[data-testid="fruitjuice-send-button"]'
            );
            if (
              (await sendBtn.isVisible().catch(() => false)) &&
              (await sendBtn.isEnabled().catch(() => false))
            ) {
              await sendBtn.click();
            } else {
              await page.keyboard.press("Enter");
            }
            const stopButton = page.locator('button[data-testid="stop-button"]');
            const newAssistantMessage = page
              .locator('[data-message-author-role="assistant"]')
              .nth(prevAssistantCount);
            await Promise.race([
              stopButton.waitFor({ state: "visible", timeout: 10000 }).catch(() => {}),
              newAssistantMessage.waitFor({ state: "attached", timeout: 10000 }).catch(() => {}),
              page.waitForTimeout(3000),
            ]);
            if (await stopButton.isVisible().catch(() => false)) {
              await stopButton.waitFor({ state: "hidden", timeout: 240000 }).catch(() => {});
            }
            await page.waitForTimeout(1000);
            let reply = "";
            if ((await newAssistantMessage.count()) > 0) {
              reply = await newAssistantMessage.innerText();
            } else {
              reply = await page
                .locator('[data-message-author-role="assistant"]')
                .last()
                .innerText();
            }
            return reply.trim();
          }

          async function processQueue() {
            if (processing || queue.length === 0) return;
            processing = true;
            const { prompt, images, resolve, reject } = queue.shift();
            try {
              const reply = await askChatGPT(prompt, images || []);
              resolve(reply);
            } catch (err) {
              reject(err);
            } finally {
              for (const f of images || []) fs.unlink(f, () => {});
              processing = false;
              processQueue();
            }
          }

          function queuePrompt(prompt, images) {
            return new Promise((resolve, reject) => {
              queue.push({ prompt, images, resolve, reject });
              processQueue();
            });
          }

          // ── HTTP API Server (OpenAI Compatible) ─────────────────────────
          const server = http.createServer(async (req, res) => {
            // CORS headers
            res.setHeader("Access-Control-Allow-Origin", "*");
            res.setHeader("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
            res.setHeader("Access-Control-Allow-Headers", "Content-Type, Authorization");
            if (req.method === "OPTIONS") {
              res.writeHead(204);
              return res.end();
            }
            // Health check
            if (req.url === "/" || req.url === "/health") {
              res.writeHead(200, { "Content-Type": "application/json" });
              return res.end(JSON.stringify({ status: isReady ? "ready" : "initializing" }));
            }
            // Models list (OpenAI format)
            if (req.url === "/v1/models" && req.method === "GET") {
              res.writeHead(200, { "Content-Type": "application/json" });
              return res.end(
                JSON.stringify({
                  object: "list",
                  data: [
                    { id: "chatgpt", object: "model", created: Date.now(), owned_by: "openai" },
                    { id: "gpt-4o", object: "model", created: Date.now(), owned_by: "openai" },
                    { id: "gpt-4o-mini", object: "model", created: Date.now(), owned_by: "openai" }
                  ],
                })
              );
            }
            // Chat completions (OpenAI format)
            if (req.url === "/v1/chat/completions" && req.method === "POST") {
              let body = "";
              req.on("data", (chunk) => (body += chunk));
              req.on("end", async () => {
                try {
                  if (!isReady) {
                    res.writeHead(503, { "Content-Type": "application/json" });
                    return res.end(JSON.stringify({ error: { message: "ChatGPT browser is still initializing..." } }));
                  }
                  const data = JSON.parse(body || "{}");
                  const messages = data.messages || [];
                  // Extract last user message (string OR vision content parts)
                  let prompt = "";
                  if (messages.length > 0) {
                    const lastUserMsg = [...messages].reverse().find((m) => m.role === "user");
                    prompt = contentToText(lastUserMsg ? lastUserMsg.content : messages[messages.length - 1].content);
                  } else if (data.prompt) {
                    prompt = data.prompt;
                  }
                  // Vision: pull image_url parts (base64 data URLs or http URLs)
                  const imageUrls = collectImageUrls(messages);
                  const imageFiles = imageUrls.length ? await materializeImages(imageUrls) : [];
                  if (!prompt && imageFiles.length === 0) {
                    res.writeHead(400, { "Content-Type": "application/json" });
                    return res.end(JSON.stringify({ error: { message: "No prompt provided in request" } }));
                  }
                  console.log(`[API] Received prompt (${prompt.length} chars, ${imageFiles.length} image(s)): ${prompt.slice(0, 80)}...`);
                  const reply = await queuePrompt(prompt, imageFiles);
                  const responseJson = {
                    id: "chatcmpl-" + Math.random().toString(36).substring(2),
                    object: "chat.completion",
                    created: Math.floor(Date.now() / 1000),
                    model: data.model || "chatgpt",
                    choices: [
                      {
                        index: 0,
                        message: {
                          role: "assistant",
                          content: reply,
                        },
                        finish_reason: "stop",
                      },
                    ],
                    usage: {
                      prompt_tokens: Math.ceil(prompt.length / 4),
                      completion_tokens: Math.ceil(reply.length / 4),
                      total_tokens: Math.ceil((prompt.length + reply.length) / 4),
                    },
                  };
                  res.writeHead(200, { "Content-Type": "application/json" });
                  res.end(JSON.stringify(responseJson));
                } catch (err) {
                  console.error("[API Error]", err);
                  res.writeHead(500, { "Content-Type": "application/json" });
                  res.end(JSON.stringify({ error: { message: err.message } }));
                }
              });
              return;
            }
            res.writeHead(404, { "Content-Type": "application/json" });
            res.end(JSON.stringify({ error: { message: "Route not found" } }));
          });

          server.listen(PORT, "0.0.0.0", async () => {
            console.log(`[Server] Local HTTP server listening on http://0.0.0.0:${PORT}`);
            try {
              await initBrowser();
            } catch (err) {
              console.error("[Browser Init Failed]", err);
            }
          });
          EOF
          node --check server.js

      - name: Start Server & Cloudflare Tunnel
        run: |
          # 1. Start Xvfb display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          # 2. Start API Server with Xvfb
          node server.js &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"

          # 3. Start Cloudflared Quick Tunnel
          cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!

          # 4. Extract public trycloudflare.com URL
          echo "Waiting for Cloudflare Tunnel URL to be assigned..."
          TUNNEL_URL=""
          for i in {1..40}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to obtain Cloudflare Tunnel URL. Check tunnel.log:"
            cat tunnel.log
            exit 1
          fi
          export TUNNEL_URL

          echo ""
          echo "=========================================================================="
          echo " 🚀 CLOUDFLARE PUBLIC API ENDPOINT GENERATED!"
          echo " Base URL: $TUNNEL_URL/v1"
          echo " Chat Completion URL: $TUNNEL_URL/v1/chat/completions"
          echo " Models URL: $TUNNEL_URL/v1/models"
          echo "=========================================================================="
          echo ""

          # 5. Output to GitHub Step Summary
          echo "## 🌐 ChatGPT OpenAI-Compatible API Online" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Base URL:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$TUNNEL_URL/v1" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hermes auto-connect: this URL is pushed to the Firebase vault as \`CUSTOM_API_BASE\` and the running agent picks it up within ~1 minute." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test via cURL:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "curl $TUNNEL_URL/v1/chat/completions \\" >> $GITHUB_STEP_SUMMARY
          echo "  -H \"Content-Type: application/json\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  -d '{\"model\": \"chatgpt\", \"messages\": [{\"role\": \"user\", \"content\": \"Hello!\"}]}'" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          # 6. ── HERMES AUTO-CONNECT ──
          # Publish this endpoint into the same Firebase vault the config
          # website uses. vault_sync.py on the Hermes runner mirrors it into
          # ~/.hermes/.env within ~45s and the pool router reads it LIVE on
          # every request - no restart, no copy-paste. If "chatgpt" is not
          # in MODEL_POOL yet, it is added automatically (provider "custom")
          # WITHOUT bumping MODEL_POOL_UPDATED, so benched models stay benched.
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_EMAIL" ]; then
            AUTH=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"email\":\"$FIREBASE_EMAIL\",\"password\":\"$FIREBASE_PASSWORD\",\"returnSecureToken\":true}")
            IDTOK=$(printf '%s' "$AUTH" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("idToken",""))' 2>/dev/null || true)
            FUID=$(printf '%s' "$AUTH" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("localId",""))' 2>/dev/null || true)
            if [ -n "$IDTOK" ] && [ -n "$FUID" ]; then
              DB="${FIREBASE_DB_URL%/}"
              CURPOOL=$(curl -s "$DB/secrets/$FUID/MODEL_POOL.json?auth=$IDTOK" || echo 'null')
              export CURMODELS=$(curl -s "$DB/secrets/$FUID/CUSTOM_MODELS.json?auth=$IDTOK" || echo 'null')
              PATCH=$(printf '%s' "$CURPOOL" | python3 -c '
          import sys, json, datetime
          raw = sys.stdin.read().strip()
          try:
              s = json.loads(raw)              # RTDB returns a JSON string or null
              items = json.loads(s) if isinstance(s, str) else (s or [])
              if not isinstance(items, list): items = []
          except Exception:
              items = []
          if not any(isinstance(x, dict) and x.get("provider") == "custom" for x in items):
              items.append({"id": "chatgpt", "provider": "custom"})
          import os
          patch = {"CUSTOM_API_BASE": os.environ["TUNNEL_URL"] + "/v1",
                   "MODEL_POOL": json.dumps(items),
                   "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          cm = os.environ.get("CURMODELS", "null").strip().strip(chr(34))
          if cm in ("", "null"):
              patch["CUSTOM_MODELS"] = "chatgpt"
          print(json.dumps(patch))
          ' 2>/dev/null || echo "")
              if [ -n "$PATCH" ]; then
                curl -s -X PATCH "$DB/secrets/$FUID.json?auth=$IDTOK" \
                  -H "Content-Type: application/json" --data "$PATCH" > /dev/null \
                  && echo "✅ Hermes vault updated: CUSTOM_API_BASE=$TUNNEL_URL/v1 (live on the runner within ~1 min)"
              else
                echo "⚠️ vault patch build failed - set the Web-API base URL on the config website manually"
              fi
            else
              echo "⚠️ Firebase sign-in failed - set the Web-API base URL on the config website manually"
            fi
          else
            echo "ℹ️ FIREBASE_* secrets not set - add them (same values as the Hermes workflow) to auto-connect this API"
          fi

          # 7. Optional Telegram heads-up
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_USER_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_USER_ID" \
              --data-urlencode text="🌐 ChatGPT web-API online: $TUNNEL_URL/v1 — Hermes pool-e auto-connected ('chatgpt' model). Panel > Model pool theke tick/untick kora jabe." > /dev/null || true
          fi

          # 8. Keep workflow running to serve requests
          echo "API Server is running live on $TUNNEL_URL. Streaming logs..."
          wait $SERVER_PID
