name: Build Desktop App

# Builds the Meta Hawladar desktop app (Flutter) for Windows, and optionally
# Linux + macOS, on GitHub's own machines - no Flutter / Visual Studio needed
# on your PC.
#
# How to use (same idea as the Android `release-apk.yml`):
#   1. Push this `desktop` folder to a GitHub repository (the folder itself as
#      the repo root, OR the whole bundle - the workflow finds pubspec.yaml).
#   2. GitHub -> Actions -> "Build Desktop App" -> Run workflow.
#   3. When it finishes, open the run -> Artifacts -> download
#      `MetaHawladar-<profile>-windows-x64-setup-v<version>` -> inside is the
#      real Windows installer (`...-setup-v<version>.exe`, built with Inno
#      Setup): double-click -> Next -> Install. It goes to Program Files (or
#      the per-user Programs folder without admin), adds Start-menu + Desktop
#      shortcuts and an "Apps & features" uninstall entry, and upgrades in
#      place when you install a newer version.
#      The portable build `MetaHawladar-<profile>-windows-x64-v<version>.zip`
#      (extract + run `MetaHawladar.exe`, no install) is still
#      uploaded next to it.
#   4. Push a version tag (`git tag v27.9.0 && git push --tags`) to also get a
#      GitHub Release with every platform attached.
#
# No secrets are required. BUILD_PROFILE selects the customer bundle that is
# compiled in (see lib/config/profile_data.dart).

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which desktop builds to make"
        type: choice
        default: windows
        options:
          - windows
          - windows+linux
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release on tag pushes

env:
  # Flutter version used on the build machines. Pinned on purpose: newer
  # stable releases made `IconData` a final class, which breaks
  # font_awesome_flutter 10.x ("IconData can't be extended outside of its
  # library"). Bump this only after font_awesome_flutter publishes a fix.
  FLUTTER_VERSION: "3.35.x"
  BUILD_PROFILE: shimul
  FLUTTER_CHANNEL: stable
  # Set to the sub-folder that contains pubspec.yaml, or leave "auto" to let the
  # workflow find it (repo root, ./desktop or ./automation_hub_desktop).
  PROJECT_DIR: auto

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    # windows-2022 = Visual Studio 2022 (v17). `windows-latest` now ships
    # Visual Studio 2026 (v18), which Flutter 3.35 does not detect
    # ("could not find any instance of Visual Studio").
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: dir
        shell: bash
        run: |
          set -euo pipefail
          DIR="${PROJECT_DIR}"
          if [ "$DIR" = "auto" ]; then
            for c in . desktop automation_hub_desktop; do
              if [ -f "$c/pubspec.yaml" ]; then DIR="$c"; break; fi
            done
          fi
          if [ ! -f "$DIR/pubspec.yaml" ]; then echo "::error::pubspec.yaml not found"; exit 1; fi
          VERSION=$(grep -E '^version:' "$DIR/pubspec.yaml" | head -n1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR  version: $VERSION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Windows runner (first time only)
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-windows-desktop
          if [ ! -d windows ]; then
            flutter create . --platforms=windows --project-name automation_hub_desktop --org com.automationhub
            # v40.6: `flutter create` adds a default test/widget_test.dart that uses MyApp -> analyze fails
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi

      - name: Apply app icon + product name (replaces the Flutter default icon)
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cp -f assets/icon/app_icon.ico windows/runner/resources/app_icon.ico
          # exe metadata shown in Properties / Task Manager
          sed -i 's/VALUE "FileDescription", "automation_hub_desktop"/VALUE "FileDescription", "Meta Hawladar - Zedge Content Studio"/; s/VALUE "ProductName", "automation_hub_desktop"/VALUE "ProductName", "Meta Hawladar"/; s/VALUE "CompanyName", "com.automationhub"/VALUE "CompanyName", "Meta Hawladar"/' windows/runner/Runner.rc || true
          ls -la windows/runner/resources/
          # exe name (MetaHawladar.exe instead of automation_hub_desktop.exe) + initial window title
          sed -i 's/set(BINARY_NAME "automation_hub_desktop")/set(BINARY_NAME "MetaHawladar")/' windows/CMakeLists.txt || true
          sed -i 's/L"automation_hub_desktop"/L"Meta Hawladar"/g' windows/runner/main.cpp || true
          grep -n BINARY_NAME windows/CMakeLists.txt | head -n 2

      - name: Pub get
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter pub get

      - name: Analyze (errors only)
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: bash
        run: |
          # v40.6: drop Flutter's default test (uses MyApp, which this app does not have)
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter build windows --release --dart-define=BUILD=${{ env.BUILD_PROFILE }}

      - name: Package
        id: pkg
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: pwsh
        run: |
          $out = "MetaHawladar-${env:BUILD_PROFILE}-windows-x64-v${{ steps.dir.outputs.version }}"
          $rel = Get-ChildItem -Directory -Recurse build/windows | Where-Object { $_.FullName -match 'runner\\Release$' } | Select-Object -First 1
          if (-not $rel) { Write-Error "Release folder not found under build/windows"; exit 1 }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/dist/$out" | Out-Null
          Copy-Item -Path "$($rel.FullName)/*" -Destination "$env:RUNNER_TEMP/dist/$out" -Recurse
          Copy-Item -Path README.md -Destination "$env:RUNNER_TEMP/dist/$out/README.md" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:RUNNER_TEMP/dist/$out" -DestinationPath "$env:RUNNER_TEMP/dist/$out.zip" -Force
          "path=$env:RUNNER_TEMP/dist/$out.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $out.zip"

      - name: Upload artifact (portable zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Real Windows installer (setup.exe) built with Inno Setup 6, which is
      # pre-installed on the GitHub windows runners. Script + wizard images
      # live in installer/ (installer/windows.iss).
      - name: Build Windows installer (Inno Setup)
        id: inst
        working-directory: ${{ steps.dir.outputs.dir }}
        shell: pwsh
        run: |
          # exit codes are checked explicitly below (native stderr chatter must not abort the step)
          $ErrorActionPreference = "Continue"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found on runner - installing via Chocolatey"
            choco install innosetup --no-progress -y | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found at $iscc"; exit 1 }
          $rel = Get-ChildItem -Directory -Recurse build/windows | Where-Object { $_.FullName -match 'runner\\Release$' } | Select-Object -First 1
          if (-not $rel) { Write-Error "Release folder not found under build/windows"; exit 1 }
          $ver  = "${{ steps.dir.outputs.version }}"
          $name = "MetaHawladar-${env:BUILD_PROFILE}-windows-x64-setup-v$ver"
          $outDir = Join-Path $env:RUNNER_TEMP "dist-installer"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exeFile = Get-ChildItem -Path $rel.FullName -Filter *.exe -File | Select-Object -First 1
          if (-not $exeFile) { Write-Error "No .exe in $($rel.FullName)"; exit 1 }
          & $iscc "/DMyAppExeName=$($exeFile.Name)" "/DMyAppVersion=$ver" "/DMyProfile=${env:BUILD_PROFILE}" "/DMySourceDir=$($rel.FullName)" "/DMyOutputDir=$outDir" "/DMyOutputBaseFilename=$name" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed ($LASTEXITCODE)"; exit 1 }
          $exe = Join-Path $outDir "$name.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installer not produced: $exe"; exit 1 }
          Get-Item $exe | Format-List Name, Length
          "path=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $name.exe"

      - name: Upload artifact (Windows installer)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inst.outputs.name }}
          path: ${{ steps.inst.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux x64
    if: ${{ github.event_name == 'push' || inputs.platforms == 'windows+linux' || inputs.platforms == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: dir
        run: |
          set -euo pipefail
          DIR="${PROJECT_DIR}"
          if [ "$DIR" = "auto" ]; then
            for c in . desktop automation_hub_desktop; do
              if [ -f "$c/pubspec.yaml" ]; then DIR="$c"; break; fi
            done
          fi
          if [ ! -f "$DIR/pubspec.yaml" ]; then echo "::error::pubspec.yaml not found"; exit 1; fi
          VERSION=$(grep -E '^version:' "$DIR/pubspec.yaml" | head -n1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Linux runner (first time only)
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          if [ ! -d linux ]; then
            flutter create . --platforms=linux --project-name automation_hub_desktop --org com.automationhub
            # v40.6: `flutter create` adds a default test/widget_test.dart that uses MyApp -> analyze fails
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi

      - name: Apply app icon (GTK window icon)
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          # app_icon_256.png ships inside flutter_assets; my_application.cc sets it on the GTK window at start-up
          python3 - <<'PY'
          p = 'linux/runner/my_application.cc'
          s = open(p).read()
          if 'app_icon_256.png' not in s:
              hook = 'gtk_widget_show(GTK_WIDGET(window));'
              inject = hook + '''
            {
              g_autofree gchar* exe = g_file_read_link("/proc/self/exe", nullptr);
              if (exe != nullptr) {
                g_autofree gchar* dir = g_path_get_dirname(exe);
                g_autofree gchar* icon = g_build_filename(dir, "data", "flutter_assets", "assets", "icon", "app_icon_256.png", nullptr);
                gtk_window_set_icon_from_file(window, icon, nullptr);
              }
            }'''
              s = s.replace(hook, inject, 1)
              open(p, 'w').write(s)
          PY
          sed -i 's/"automation_hub_desktop"/"Meta Hawladar"/g' linux/runner/my_application.cc || true
          grep -n "app_icon_256" linux/runner/my_application.cc || echo "::warning::could not patch my_application.cc (default icon kept)"

      - name: Pub get
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter pub get

      - name: Build Linux release
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter build linux --release --dart-define=BUILD=${{ env.BUILD_PROFILE }}

      - name: Package
        id: pkg
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          OUT="MetaHawladar-${BUILD_PROFILE}-linux-x64-v${{ steps.dir.outputs.version }}"
          BUNDLE=$(find build/linux -type d -path '*/release/bundle' | head -n1)
          [ -n "$BUNDLE" ] || { echo "::error::bundle not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist/$OUT"
          cp -r "$BUNDLE"/. "$RUNNER_TEMP/dist/$OUT/"
          cp README.md "$RUNNER_TEMP/dist/$OUT/" || true
          tar -C "$RUNNER_TEMP/dist" -czf "$RUNNER_TEMP/dist/$OUT.tar.gz" "$OUT"
          echo "path=$RUNNER_TEMP/dist/$OUT.tar.gz" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # v27.13: real Ubuntu/Debian installer (.deb) - double-click -> Install. Adds an app-menu entry
      # ("Meta Hawladar"), icon, /usr/bin/metahawladar launcher and pulls libmpv in automatically.
      - name: Build .deb installer (Ubuntu / Debian)
        id: deb
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          VER="${{ steps.dir.outputs.version }}"
          NAME="metahawladar-${BUILD_PROFILE}"
          OUT="MetaHawladar-${BUILD_PROFILE}-linux-x64-v${VER}"
          BUNDLE=$(find build/linux -type d -path '*/release/bundle' | head -n1)
          PKG="$RUNNER_TEMP/deb/$NAME"
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/metahawladar" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps" "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE"/. "$PKG/opt/metahawladar/"
          chmod +x "$PKG/opt/metahawladar/automation_hub_desktop"
          cp assets/icon/app_icon_256.png "$PKG/usr/share/icons/hicolor/256x256/apps/metahawladar.png"
          cp assets/icon/app_icon_512.png "$PKG/usr/share/icons/hicolor/512x512/apps/metahawladar.png"
          cat > "$PKG/usr/bin/metahawladar" <<'SH'
          #!/bin/sh
          exec /opt/metahawladar/automation_hub_desktop "$@"
          SH
          chmod 755 "$PKG/usr/bin/metahawladar"
          # file name MUST equal the binary name (app_id) or GNOME shows a blank taskbar icon
          cat > "$PKG/usr/share/applications/automation_hub_desktop.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Meta Hawladar
          Comment=Zedge Content Studio (${BUILD_PROFILE})
          Exec=/usr/bin/metahawladar
          Icon=metahawladar
          Terminal=false
          Categories=Utility;Network;
          StartupWMClass=automation_hub_desktop
          EOF
          # ---- graphical uninstall: app-menu entry "Uninstall Meta Hawladar" (asks for password via polkit)
          cat > "$PKG/opt/metahawladar/uninstall.sh" <<'SH'
          #!/bin/bash
          PKG="__PKGNAME__"
          if command -v zenity >/dev/null 2>&1; then
            zenity --question --title="Meta Hawladar" --text="Remove Meta Hawladar from this computer?" --ok-label="Uninstall" --cancel-label="Cancel" || exit 0
          fi
          rm -rf "$HOME/.cache/MetaHawladar" "$HOME/MetaHawladar/rtdb_cache" 2>/dev/null
          if pkexec sh -c "apt-get remove -y '$PKG' || dpkg -r '$PKG'"; then
            command -v zenity >/dev/null 2>&1 && zenity --info --title="Meta Hawladar" --text="Meta Hawladar has been uninstalled."
          else
            command -v zenity >/dev/null 2>&1 && zenity --error --title="Meta Hawladar" --text="Uninstall failed. Run in a terminal:\nsudo apt remove $PKG"
          fi
          SH
          sed -i "s/__PKGNAME__/${NAME}/" "$PKG/opt/metahawladar/uninstall.sh"
          chmod 755 "$PKG/opt/metahawladar/uninstall.sh"
          cat > "$PKG/usr/share/applications/metahawladar-uninstall.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Uninstall Meta Hawladar
          Comment=Remove Meta Hawladar from this computer
          Exec=/opt/metahawladar/uninstall.sh
          Icon=edit-delete
          Terminal=false
          Categories=Utility;
          EOF
          # ---- AppStream metadata: lets Ubuntu Software / App Center show the app with icon + "Uninstall" button
          mkdir -p "$PKG/usr/share/metainfo"
          cat > "$PKG/usr/share/metainfo/automation_hub_desktop.metainfo.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>automation_hub_desktop.desktop</id>
            <name>Meta Hawladar</name>
            <summary>Zedge Content Studio (${BUILD_PROFILE})</summary>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>proprietary</project_license>
            <description><p>Desktop control panel for the Zedge upload automation: queue, schedule, VPN and alerts.</p></description>
            <launchable type="desktop-id">automation_hub_desktop.desktop</launchable>
            <provides><binary>metahawladar</binary></provides>
            <releases><release version="${VER}" date="$(date -u +%F)"/></releases>
          </component>
          EOF
          # ---- post-install / post-remove hooks: refresh icon + menu caches so the entry shows up at once
          cat > "$PKG/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          set -e
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          exit 0
          SH
          cat > "$PKG/DEBIAN/postrm" <<'SH'
          #!/bin/sh
          set -e
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          exit 0
          SH
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/postrm"
          SIZE=$(du -sk "$PKG" | cut -f1)
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: ${NAME}
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${SIZE}
          Depends: libgtk-3-0, libmpv2 | libmpv1, ffmpeg
          Recommends: unrar | p7zip-full, zenity, policykit-1 | polkitd
          Maintainer: Meta Hawladar <noreply@example.com>
          Description: Meta Hawladar - Zedge Content Studio (${BUILD_PROFILE})
           Desktop control panel for the Zedge upload automation.
          EOF
          mkdir -p "$RUNNER_TEMP/dist"
          dpkg-deb --build --root-owner-group "$PKG" "$RUNNER_TEMP/dist/$OUT.deb"
          echo "path=$RUNNER_TEMP/dist/$OUT.deb" >> "$GITHUB_OUTPUT"
          echo "name=$OUT-deb" >> "$GITHUB_OUTPUT"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.deb.outputs.name }}
          path: ${{ steps.deb.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS (universal)
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project
        id: dir
        run: |
          set -euo pipefail
          DIR="${PROJECT_DIR}"
          if [ "$DIR" = "auto" ]; then
            for c in . desktop automation_hub_desktop; do
              if [ -f "$c/pubspec.yaml" ]; then DIR="$c"; break; fi
            done
          fi
          if [ ! -f "$DIR/pubspec.yaml" ]; then echo "::error::pubspec.yaml not found"; exit 1; fi
          VERSION=$(grep -E '^version:' "$DIR/pubspec.yaml" | head -n1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate macOS runner (first time only)
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          flutter config --enable-macos-desktop
          if [ ! -d macos ]; then
            flutter create . --platforms=macos --project-name automation_hub_desktop --org com.automationhub
            # v40.6: `flutter create` adds a default test/widget_test.dart that uses MyApp -> analyze fails
            if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          fi
          # app icon (replaces the Flutter default icon set)
          ICONSET=macos/Runner/Assets.xcassets/AppIcon.appiconset
          for s in 16 32 64 128 256 512 1024; do cp -f "assets/icon/macos/app_icon_$s.png" "$ICONSET/app_icon_$s.png"; done
          sed -i '' 's/PRODUCT_NAME = automation_hub_desktop/PRODUCT_NAME = Meta Hawladar/' macos/Runner/Configs/AppInfo.xcconfig || true
          # The app talks to Firebase / R2 / GitHub and opens local files.
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            if ! grep -q 'com.apple.security.network.client' "$f"; then
              /usr/libexec/PlistBuddy -c 'Add :com.apple.security.network.client bool true' "$f"
            fi
            if ! grep -q 'com.apple.security.files.user-selected.read-write' "$f"; then
              /usr/libexec/PlistBuddy -c 'Add :com.apple.security.files.user-selected.read-write bool true' "$f"
            fi
          done

      - name: Pub get
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter pub get

      - name: Build macOS release
        working-directory: ${{ steps.dir.outputs.dir }}
        run: flutter build macos --release --dart-define=BUILD=${{ env.BUILD_PROFILE }}

      - name: Package
        id: pkg
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          set -euo pipefail
          OUT="MetaHawladar-${BUILD_PROFILE}-macos-v${{ steps.dir.outputs.version }}"
          APP=$(find build/macos -type d -name '*.app' -path '*/Release/*' | head -n1)
          [ -n "$APP" ] || { echo "::error::.app not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/dist/$OUT.zip"
          echo "path=$RUNNER_TEMP/dist/$OUT.zip" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Release (tags only)
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Meta Hawladar Desktop ${{ github.ref_name }} (${{ env.BUILD_PROFILE }})
          files: dist/**
          generate_release_notes: true
          body: |
            Meta Hawladar desktop app **${{ github.ref_name }}** - profile `${{ env.BUILD_PROFILE }}`.

            * Windows (recommended): run `MetaHawladar-...-windows-x64-setup-v....exe` -> Next -> Install (Start-menu + Desktop shortcut, uninstall from Apps & features). Unsigned build: if SmartScreen shows "Windows protected your PC", click *More info -> Run anyway*.
            * Windows portable: extract `MetaHawladar-...-windows-x64-v....zip` and run `MetaHawladar.exe` (keep all files together).
            * Ubuntu / Debian (recommended): download `MetaHawladar-...-linux-x64-v....deb` -> right-click -> Open With "Software Install" -> Install (or `sudo apt install ./MetaHawladar-...deb`). App appears in the app menu as "Meta Hawladar". To remove: app menu -> "Uninstall Meta Hawladar" (or `sudo apt remove metahawladar-<profile>`).
            * Other Linux: extract the tar.gz, `chmod +x automation_hub_desktop`, needs `libmpv` (`sudo apt install mpv`).
            * macOS: unzip, right-click the app -> Open (unsigned build).
