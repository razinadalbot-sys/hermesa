                    );
                    await sendTelegramNotification(idleMsg);
                  }
                  // v27.11: report the slot(s) this run could not fill so the gate retries them (if files get added later)
                  await markRemainingGateSlots(i, { status: "idle", error: String(reason).replace(/\s+/g, " ").slice(0, 200) });
                  break;
