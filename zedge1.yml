          // ═══════════════════════════════════════════════════════════════════════════════════════════
          // v30 API ONLY - login + profile + upload via Zedge backend requests (tested in Zedge API Tester ext.)
          //   login : account.zedge.net/v2/auth/password/authorize -> redirect -> upload.zedge.net/auth/token
          //   upload: api-gateway-v2.zedge.net GraphQL (create -> cover/variants -> meta+publish -> status -> archive)
          //   Requests go through Playwright context.request = same cookies, same User-Agent and the SAME proxy as the
          //   browser (Playwright passes the browser/context proxy to it); the VPN tunnel is system-wide, so it covers
          //   these requests too. x-geoipcountry follows the exit IP country (VPN/proxy), like the real site.
          //   No UI login / UI upload: everything is done with requests. Optional variable ZEDGE_GEO_COUNTRY (e.g. US).
          // ═══════════════════════════════════════════════════════════════════════════════════════════
          const ZEDGE_GQL = "https://api-gateway-v2.zedge.net/";
          const Z_NET_ERR = /ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|ENETUNREACH|EHOSTUNREACH|socket hang up|Timeout \d+ms exceeded|net::ERR_|\(HTTP 0\)/i;
          const Z_AUTH_ERR = /Authentication object was not found|unauthori[sz]ed|jwt|token (is )?(expired|invalid)/i;
          const zApi = { ctx: null, country: null, token: null, expiresAt: 0, sessionId: null, cats: {}, ready: false, businessId: null, businessName: null, profiles: null, cur: null, email: null };

          function zSleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
          function zReq() { if (!zApi.ctx) throw new Error("API: browser context not ready"); return zApi.ctx.request; }

          async function zApiToken(force) {
            if (!force && zApi.token && Date.now() < zApi.expiresAt - 90 * 1000) return zApi.token;
            let res = null, body = null;
            for (let i = 1; i <= 3; i++) {
              res = await zReq().post("https://upload.zedge.net/auth/token", {
                data: { scope: "user" }, timeout: 30000,
                headers: { "content-type": "application/json", origin: "https://upload.zedge.net", referer: "https://upload.zedge.net/" }
              }).catch((e) => ({ status: () => 0, json: async () => null, _e: e }));
              body = await res.json().catch(() => null);
              if (body && body.accessToken) break;
              await zSleep(1500 * i);
            }
            if (!body || !body.accessToken) throw new Error("API: /auth/token gave no accessToken (HTTP " + res.status() + ") - not logged in?");
            zApi.token = body.accessToken;
            const exp = Number(body.expiresAt) || 0;                           // seconds
            zApi.expiresAt = exp ? (exp < 1e12 ? exp * 1000 : exp) : Date.now() + 10 * 60 * 1000;
            if (!zApi.sessionId) zApi.sessionId = require("crypto").randomBytes(24).toString("base64").replace(/[^A-Za-z0-9]/g, "").slice(0, 32);
            console.log("API token ready (valid ~" + Math.round((zApi.expiresAt - Date.now()) / 60000) + " min)");
            return zApi.token;
          }

          // x-geoipcountry = country of the CURRENT exit IP (VPN / proxy / runner) - the Zedge site sends the country
          // its server saw for the request, so a VPN in US must say "US", never a hard-coded "BD".
          async function zDetectCountry() {
            if (process.env.ZEDGE_GEO_COUNTRY) { zApi.country = String(process.env.ZEDGE_GEO_COUNTRY).trim().toUpperCase(); return zApi.country; }
            const providers = [
              ["https://ipwho.is/", (d) => d.country_code],
              ["https://ipinfo.io/json", (d) => d.country],
              ["http://ip-api.com/json", (d) => d.countryCode]
            ];
            for (const [u, f] of providers) {
              try {
                const r = await zReq().get(u, { timeout: 15000 });
                const d = await r.json();
                const c = String(f(d) || "").trim().toUpperCase();
                if (/^[A-Z]{2}$/.test(c)) { zApi.country = c; console.log(`API geo: exit IP country ${c} (${u})`); return c; }
              } catch (_) {}
            }
            console.log("API geo: country lookup failed - x-geoipcountry header left out");
            zApi.country = null; return null;
          }

          // Login with requests only (no clicks). Returns {email}. err.badCredentials=true 
          async function zApiLogin(context, email, password) {
            zApi.ctx = context;
            const req = context.request;
            if (!zApi.country) await zDetectCountry();
            const H = { "content-type": "application/json", accept: "*/*", origin: "https://account.zedge.net", referer: "https://account.zedge.net/v2/login-with-email" };
            const t0 = Date.now();
            await req.get("https://account.zedge.net/v2/login?scope=ZEDGE", { timeout: 45000 }).catch((e) => console.log("API login: login page GET failed (" + e.message + ") - continuing"));
            const v = await req.post("https://account.zedge.net/v2/auth/email/verify-request", { data: { email }, headers: H, timeout: 30000 });
            const vj = await v.json().catch(() => null);
            const next = vj && vj.error && vj.error.nextAction;
            console.log("API login · verify-request: HTTP " + v.status() + (next ? " · nextAction " + next : ""));
            if (next && next !== "LOGIN") { const e = new Error("API login: account not ready for password login (nextAction " + next + ")"); e.badCredentials = /REGISTER|SIGNUP/i.test(next); throw e; }
            await zSleep(600 + Math.floor(Math.random() * 900));             // human-ish gap between email and password step
            const a = await req.post("https://account.zedge.net/v2/auth/password/authorize", { data: { username: email, password }, headers: H, timeout: 30000 });
            const aj = await a.json().catch(() => null) || {};
            console.log("API login · password/authorize: HTTP " + a.status() + (aj.redirectUrl ? " · redirect " + aj.redirectUrl : "") + (aj.error ? " · " + (aj.error.detail || aj.error.title || "error") : ""));
            if (aj.error || a.status() >= 400) {
              const e = new Error("API login failed: " + ((aj.error && (aj.error.detail || aj.error.title)) || ("HTTP " + a.status())));
              e.badCredentials = a.status() === 400 || a.status() === 401 || /password|credential|invalid|incorrect/i.test(e.message);
              throw e;
            }
            let target = aj.redirectUrl || "https://upload.zedge.net/";
            try { target = new URL(target, "https://account.zedge.net").href; } catch (_) {}
            const g = await req.get(target, { timeout: 45000 }).catch((e) => { console.log("API login: redirect GET failed (" + e.message + ")"); return null; });
            if (g) console.log("API login · redirect GET -> HTTP " + g.status() + " " + g.url());
            await zApiToken(true);
            const ui = await req.get("https://upload.zedge.net/auth/user-info?scope=user", { timeout: 30000 }).then((r) => r.json()).catch(() => null);
            zApi.email = (ui && ui.email) || email;
            zApi.ready = true;
            console.log(`✅ API login OK in ${Date.now() - t0}ms (account ${zApi.email})`);
            return { email: zApi.email };
          }

          // After a UI login the cookies are in the same context -> just fetch a token.
          async function zApiAttach(context) {
            zApi.ctx = context;
            if (!zApi.country) await zDetectCountry();
            await zApiToken(true);
            zApi.ready = true;
          }

          function zApiHeaders() {
            const h = {
              authorization: "Bearer " + zApi.token,
              "x-auth-v2": "true",
              "x-session-id": zApi.sessionId,
              "x-request-id": require("crypto").randomUUID(),
              origin: "https://upload.zedge.net",
              referer: "https://upload.zedge.net/"
            };
            if (zApi.country) h["x-geoipcountry"] = zApi.country;
            return h;
          }

          // v41.3: generic GraphQL input fixer. Reads "$input got invalid value" errors and patches the input (also nested, e.g. paymentLock).
          function zFixInput(input, msg) {
            if (!input || !msg) return [];
            const notes = [];
            const dflt = (t, f) => /^\[/.test(t) ? [] : /^Boolean/.test(t) ? false : /^(Int|Float)/.test(t) ? 0 : /^String/.test(t) ? ""
              : /Input!?$/.test(t) ? {} : /lock/i.test(t + " " + f) ? "VIDEO" : undefined;
            const walk = (o, keys) => { for (const k of keys) { if (!o || typeof o !== "object") return null; if (!(k in o) || o[k] === null || typeof o[k] !== "object") o[k] = {}; o = o[k]; } return o; };
            const findOwner = (o, key) => { if (!o || typeof o !== "object") return null; if (key in o) return o; for (const v of Object.values(o)) { const r = v && typeof v === "object" && !Array.isArray(v) ? findOwner(v, key) : null; if (r) return r; } return null; };
            for (const seg of msg.split(/;\s*(?=Variable "\$input")/)) {
              const pm = /at "input((?:\.\w+)*)"/.exec(seg), path = pm && pm[1] ? pm[1].slice(1).split(".") : [];
              let m;
              if ((m = /Field "(\w+)" is not defined by type "(\w+)"(?:\. Did you mean "(\w+)")?/.exec(seg))) {
                const o = path.length ? walk(input, path) : findOwner(input, m[1]);
                if (o && m[1] in o) { const v = o[m[1]]; delete o[m[1]]; if (m[3] && !(m[3] in o)) { o[m[3]] = v; notes.push(`${m[1]} -> ${m[3]}`); } else notes.push(`-${m[1]}`); }
              } else if ((m = /Field "(\w+)" of required type "([^"]+)" was not provided/.exec(seg))) {
                const o = walk(input, path), d = dflt(m[2], m[1]);
                if (o && !(m[1] in o) && d !== undefined) { o[m[1]] = d; notes.push(`+${path.concat(m[1]).join(".")}=${JSON.stringify(d)}`); }
              } else if (path.length) {
                const key = path[path.length - 1], o = walk(input, path.slice(0, -1));
                if (o && key in o) {
                  const sug = /Did you mean the enum value "(\w+)"/.exec(seg), nn = /non-nullable type "([^"]+)"/.exec(seg);
                  const old = JSON.stringify(o[key]);
                  if (sug) o[key] = sug[1];
                  else if (nn && dflt(nn[1], key) !== undefined) o[key] = dflt(nn[1], key);
                  else if (key === "categoryId" && typeof o[key] === "number") o[key] = String(o[key]);
                  else delete o[key];
                  if (JSON.stringify(o[key]) !== old) notes.push(`${path.join(".")}=${JSON.stringify(o[key])}`);
                }
              }
            }
            return notes;
          }

          // one GraphQL call. files = [{ path: "variables.file", local: "C:/x.jpg" }] -> multipart (GraphQL upload spec)
          async function zGql(label, query, variables, files, tries) {
            tries = tries || 3;
            variables = JSON.parse(JSON.stringify(variables || {}));
            let lastErr, zFix = 0;
            for (let i = 1; i <= tries; i++) {
              try {
                await zApiToken(false);
                const t0 = Date.now();
                const opts = { headers: zApiHeaders(), timeout: files ? 10 * 60 * 1000 : 60 * 1000 };
                if (files && files.length) {
                  // built by hand: the GraphQL multipart spec needs "operations" and "map" BEFORE the files
                  // (Playwright's multipart option puts files first -> "Misordered multipart fields")
                  const map = {};
                  files.forEach((f, k) => { map[String(k + 1)] = [f.path]; });
                  const boundary = "----WebKitFormBoundary" + require("crypto").randomBytes(12).toString("base64").replace(/[^A-Za-z0-9]/g, "").slice(0, 16);
                  const parts = [];
                  const field = (name, val) => parts.push(Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="${name}"\r\n\r\n${val}\r\n`, "utf8"));
                  field("operations", JSON.stringify({ query, variables }));
                  field("map", JSON.stringify(map));
                  files.forEach((f, k) => {
                    const ext = path.extname(f.local).toLowerCase();
                    const mime = { ".png": "image/png", ".webp": "image/webp", ".gif": "image/gif", ".jpg": "image/jpeg", ".jpeg": "image/jpeg", ".mp4": "video/mp4", ".mov": "video/quicktime", ".webm": "video/webm", ".mp3": "audio/mpeg", ".m4a": "audio/mp4", ".m4r": "audio/mp4", ".aac": "audio/aac", ".wav": "audio/wav", ".ogg": "audio/ogg" }[ext] || "application/octet-stream";
                    const fname = path.basename(f.local).replace(/"/g, "");
                    parts.push(Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="${k + 1}"; filename="${fname}"\r\nContent-Type: ${mime}\r\n\r\n`, "utf8"));
                    parts.push(fs.readFileSync(f.local));
                    parts.push(Buffer.from("\r\n", "utf8"));
                  });
                  parts.push(Buffer.from(`--${boundary}--\r\n`, "utf8"));
                  opts.headers["content-type"] = "multipart/form-data; boundary=" + boundary;
                  opts.data = Buffer.concat(parts);
                } else {
                  opts.headers["content-type"] = "application/json";
                  opts.data = JSON.stringify({ query, variables });
                }
                const res = await zReq().post(ZEDGE_GQL, opts);
                const st = res.status();
                const body = await res.json().catch(() => null);
                if (st === 401 || st === 403) { zApi.token = null; throw new Error("HTTP " + st + " (auth)"); }
                if (!body) throw new Error("HTTP " + st + " (no JSON)");
                if (body.errors && body.errors.length) {
                  const msg = body.errors.map((e) => e.message).join("; ");
                  // unknown input field (e.g. limitedEdition not in ChargeScreenMetaAsUserInput) -> drop it and retry at once
                  // v41.3: invalid input -> auto-fix (unknown field / rename / required missing / nested paymentLock), then retry
                  if (/got invalid value/.test(msg)) console.log(`API ${label}: full validation error -> ${msg}`);
                  if (variables.input && zFix < 8) {
                    const fx = zFixInput(variables.input, msg);
                    if (fx.length) { zFix++; console.log(`API ${label}: input fixed [${fx.join(", ")}] -> ${JSON.stringify(variables.input)}, retrying`); i--; continue; }
                  }
                  // short reason for Telegram: drop the echoed input object, keep the real cause
                  const short = msg.replace(/got invalid value [\s\S]*?;\s*(?=(Field|Expected|Value|In field|Int|Float|String|Boolean|ID)\b)/g, "invalid -> ");
                  const err = new Error(short);
                  if (Z_AUTH_ERR.test(msg)) { zApi.token = null; console.log(`API ${label}: token expired/invalid -> new token`); }
                  else err.noRetry = true;                                    // validation / business errors: don't hammer
                  throw err;
                }
                console.log(`API ${label}: OK in ${Date.now() - t0}ms`);
                return body.data;
              } catch (e) {
                lastErr = e;
                console.log(`API ${label}: try ${i}/${tries} failed - ${e.message}`);
                if (e.noRetry) break;
                // v31: network error through a dead VPN tunnel -> same self-heal as gotoSafe (v40.7), then retry
                if (Z_NET_ERR.test(String(e && e.message)) && !(await netProbe())) {
                  if (VPN_ON && !(await vpnHeal("API " + label + ": " + String(e.message).split("\n")[0]))) throw e;
                  if (!VPN_ON) await zSleep(20000);
                }
                await zSleep(2500 * i);
              }
            }
            throw lastErr;
          }

          // ---- profiles: same list + order as the Zedge "Profiles" page (profilesAsUser size 1000) ----
          async function zApiLoadProfiles() {
            const b = await zGql("businesses", "query businesses { r: businessesAsUser { id businessName } }");
            const biz = (b && b.r) || [];
            if (!biz.length) throw new Error("API: no business on this account");
            zApi.businessId = biz[0].id; zApi.businessName = biz[0].businessName;
            const p = await zGql("profiles", "query profiles($businessId: ID!, $filters: ProfilesFilterInputAsUser) { r: profilesAsUser(businessId: $businessId, filters: $filters) { items { id businessId type name status } total } }",
              { businessId: zApi.businessId, filters: { page: 1, size: 1000 } });
            zApi.profiles = ((p && p.r && p.r.items) || []).map((x, i) => ({ ...x, index: i }));
            console.log(`API profiles (${zApi.businessName}): ` + zApi.profiles.map((x) => `#${x.index + 1} ${x.name} [${x.status}] ${x.id}`).join(" | "));
            return zApi.profiles;
          }
          // v41: Zedge business name -> Firebase dashboardSettings/account (panel / apps show it next to the Z1..Z4 tag)
          function zAccountTag() { const m = String(process.env.FOLDER_NAME || "").match(/(\d+)\s*$/); return m ? "Z" + m[1] : ""; }
          function zAccountLabel(fallback) {
            const base = process.env.FOLDER_NAME || fallback || "Zedge";
            return zApi.businessName ? `${zApi.businessName} · ${base}` : base;
          }
          async function zApiBusiness() {
            if (zApi.businessName) return zApi.businessName;
            try {
              await zApiToken(false);
              const r = await zReq().post(ZEDGE_GQL, { headers: { ...zApiHeaders(), "content-type": "application/json" }, data: JSON.stringify({ query: "query businesses { r: businessesAsUser { id businessName } }" }), timeout: 30000 });
              const j = await r.json().catch(() => null);
              const b = j && j.data && j.data.r && j.data.r[0];
              if (b) { zApi.businessId = b.id; zApi.businessName = b.businessName; }
            } catch (e) { console.log("API business name lookup failed: " + e.message); }
            return zApi.businessName;
          }
          async function zSaveAccountInfo() {
            const db = earnDbUrl();
            if (!db || !zApi.businessName) return;
            const info = { businessName: zApi.businessName, businessId: zApi.businessId || null, email: zApi.email || null, label: process.env.FOLDER_NAME || null, tag: zAccountTag() || null, updatedAt: Date.now() };
            if (zApi.profiles) info.profiles = zApi.profiles.map((p) => ({ name: p.name, status: p.status || null, type: p.type || null }));
            try {
              const r = await fetch(`${db}/dashboardSettings/account.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(info) });
              console.log(`🏷️ Account name "${zApi.businessName}" saved to Firebase dashboardSettings/account (${r.status})`);
            } catch (e) { console.log("account info save failed: " + e.message); }
          }
          function zProfileUrl(pr) { return `https://upload.zedge.net/business/${pr.businessId || zApi.businessId}/profiles/${pr.id}`; }

          // Zedge type -> API ops (strings from the upload.zedge.net bundle + HARs)
          const Z_API_TYPES = {
            WALLPAPER:      { kind: "single", cat: "WALLPAPER", create: "wallpaperCreate($profileId: ID!, $file: Upload!) { r: wallpaperCreateAsUser(profileId: $profileId, file: $file) { id } }",
                              meta: "wallpaperMetaUpdateAndPublish($profileId: ID!, $id: ID!, $input: WallpaperMetaAsUserInput!) { r: wallpaperMetaUpdateAndPublishAsUser(profileId: $profileId, wallpaperId: $id, input: $input) { id } }",
                              get: "wallpaper($profileId: ID!, $id: ID!) { r: wallpaperAsUser(profileId: $profileId, wallpaperId: $id) { id status statusMessage } }", limitedEdition: true,
                              fold: "wallpaperLandscapeImageUpload($profileId: ID!, $wallpaperId: ID!, $file: Upload!) { r: wallpaperSetLandscapeImageAsUser(profileId: $profileId, wallpaperId: $wallpaperId, file: $file) { id landscapeImageUrl } }" },
            AUDIO:          { kind: "single", cat: "AUDIO", create: "ringtoneCreate($profileId: ID!, $file: Upload!, $enrich: Boolean) { r: ringtoneCreateAsUser(profileId: $profileId, file: $file, enrich: $enrich) { id } }",
                              meta: "ringtoneMetaUpdateAndPublish($profileId: ID!, $id: ID!, $input: RingtoneMetaAsUserInput!) { r: ringtoneMetaUpdateAndPublishAsUser(profileId: $profileId, ringtoneId: $id, input: $input) { id status statusMessage } }",
                              get: "ringtone($profileId: ID!, $id: ID!) { r: ringtoneAsUser(profileId: $profileId, ringtoneId: $id) { id status statusMessage } }", enrich: true },
            LIVE_WALLPAPER: { kind: "single", cat: "LIVE_WALLPAPER", create: "liveWallpaperCreate($profileId: ID!, $file: Upload!) { r: liveWallpaperCreateAsUser(profileId: $profileId, file: $file) { id } }",
                              cover: "liveWallpaperCoverImageUpload($profileId: ID!, $input: LiveWallpaperCoverImageUploadAsUserInput!) { r: liveWallpaperCoverImageUploadAsUser(profileId: $profileId, input: $input) { id } }", coverKey: "liveWallpaperId",
                              meta: "liveWallpaperMetaUpdateAndPublish($profileId: ID!, $id: ID!, $input: LiveWallpaperMetaAsUserInput!) { r: liveWallpaperMetaUpdateAndPublishAsUser(profileId: $profileId, liveWallpaperId: $id, input: $input) { id } }",
                              get: "liveWallpaper($profileId: ID!, $id: ID!) { r: liveWallpaperAsUser(profileId: $profileId, liveWallpaperId: $id) { id status statusMessage } }", limitedEdition: true },
            CHARGE_SCREEN:  { kind: "single", cat: "CHARGE_SCREEN", create: "chargeScreenCreate($profileId: ID!, $file: Upload!) { r: chargeScreenCreateAsUser(profileId: $profileId, file: $file) { id } }",
                              cover: "chargeScreenCoverImageUpload($profileId: ID!, $input: ChargeScreenCoverImageUploadAsUserInput!) { r: chargeScreenCoverImageUploadAsUser(profileId: $profileId, input: $input) { id } }", coverKey: "chargeScreenId",
                              meta: "chargeScreenMetaUpdateAndPublish($profileId: ID!, $id: ID!, $input: ChargeScreenMetaAsUserInput!) { r: chargeScreenMetaUpdateAndPublishAsUser(profileId: $profileId, chargeScreenId: $id, input: $input) { id } }",
                              get: "chargeScreen($profileId: ID!, $id: ID!) { r: chargeScreenAsUser(profileId: $profileId, chargeScreenId: $id) { id status statusMessage } }" },
            DYNAMIC_24H_WALLPAPER:           { kind: "multi", n: 4, cat: "DYNAMIC_24H_WALLPAPER", p: "dynamicWallpaper", getOp: "dynamicWallpaperGetAsUser", metaOp: "dynamicWallpaperUpdateMetadataAsUser" },
            DYNAMIC_DUAL_LOCK_WALLPAPER:     { kind: "multi", n: 2, cat: "DYNAMIC_DUAL_LOCK_WALLPAPER", p: "dualLockWallpaper", getOp: "dualLockWallpaperGetAsUser", metaOp: "dualLockWallpaperUpdateMetadataAsUser" },
            DYNAMIC_BATTERY_LEVEL_WALLPAPER: { kind: "multi", n: 6, cat: "DYNAMIC_BATTERY_LEVEL_WALLPAPER", p: "batteryLevelWallpaper", getOp: "batteryLevelWallpaperGetAsUser", metaOp: "batteryLevelWallpaperUpdateMetadataAsUser" }
          };

          async function zCategoryId(catType, name) {
            if (!zApi.cats[catType] || !zApi.cats[catType].length) {
              const d = await zGql("categories " + catType, "query contentCategories($contentType: ContentType!) { r: contentCategoriesAsUser(contentType: $contentType) { id name } }", { contentType: catType });
              zApi.cats[catType] = (d && d.r) || [];
            }
            const list = zApi.cats[catType];
            if (!name) return null;
            const norm = (s) => String(s || "").toUpperCase().replace(/&/g, " N ").replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
            const key = norm(name);
            const hit = list.find((c) => norm(c.name) === key)
              || list.find((c) => norm(c.name).replace(/_N_/g, "_") === key.replace(/_N_/g, "_").replace(/_AND_/g, "_"))
              || list.find((c) => norm(c.name).startsWith(key) || key.startsWith(norm(c.name)));
            if (!hit) { const e = new Error(`category "${name}" not found for ${catType} (have: ${list.map((c) => c.name).join(", ")})`); e.noFallback = true; throw e; }
            return Number(hit.id);
          }

          function zMetaInput(meta, cfg, categoryId) {
            const tags = String(meta.tags || "").split(",").map((t) => t.trim()).filter((t) => t.length >= 2).slice(0, 10);
            const input = {
              name: String(meta.title || "").slice(0, 30),
              description: String(meta.description || "").slice(0, 200),
              categoryId: categoryId,
              tags: tags,
              lockType: "VIDEO",          // same as the UI path ("Video ad")
              priceUsd: null,
              isMatureContent: false,
              externalId: null
            };
            if (cfg.limitedEdition) input.limitedEdition = null;
            // v41.3: Dual / Battery / 24H use DynamicWallpaperMetadataUpdateInput (matureContent + paymentLock instead of lockType/priceUsd)
            if (cfg.kind === "multi") {
              return { name: input.name, description: input.description, categoryId: input.categoryId, tags: input.tags,
                externalId: null, matureContent: false, paymentLock: { lockType: "VIDEO", priceUsd: null } };   // exact shape from upload.zedge.net HAR (dual / 24h / battery)
            }
            return input;
          }

          async function zArchive(id) {
            return zGql("archive (remove)", "mutation premiumContentArchive($contentId: ID!) { r: premiumContentArchiveAsUser(contentId: $contentId) { id } }", { contentId: id }, null, 2);
          }

          // full upload. returns { id, cfg } after publish was requested. err.apiCreatedId is set if an item was already made.
          async function zApiUploadAndPublish(profileId, zType, meta, localFiles, coverImage, foldImage) {
            const cfg = Z_API_TYPES[zType];
            if (!cfg) throw new Error("no API mapping for type " + zType);
            const files = (Array.isArray(localFiles) ? localFiles : [localFiles]).filter(Boolean);
            if (!files.length || files.some((f) => !fs.existsSync(f))) throw new Error("local file(s) missing: " + files.join(", "));
            if (cfg.kind === "multi" && files.length !== cfg.n) throw new Error(`${zType} needs ${cfg.n} images, got ${files.length}`);

            // checks BEFORE creating anything (nothing created yet)
            const lim = await zGql("uploadLimits", "query businessUploadLimits { r: premium_business_uploadLimits { uploadAllowed uploadLimit uploadLimitDurationDays } }").catch((e) => { console.log("uploadLimits check skipped: " + e.message); return null; });
            if (lim && lim.r && lim.r.uploadAllowed === false) { const e = new Error(`Zedge upload limit reached (${lim.r.uploadLimit} per ${lim.r.uploadLimitDurationDays} days)`); e.noFallback = true; throw e; }
            const categoryId = meta.category ? await zCategoryId(cfg.cat, meta.category) : null;
            const input = zMetaInput(meta, cfg, categoryId);
            console.log(`API meta: name="${input.name}" categoryId=${categoryId} tags=[${input.tags.join(", ")}] lock=${input.lockType || (input.paymentLock && input.paymentLock.lockType)}`);

            let id = null, fold = null;
            try {
              if (cfg.kind === "single") {
                const vars = { profileId, file: null };
                if (cfg.enrich) vars.enrich = false;
                const d = await zGql("create " + zType, "mutation " + cfg.create, vars, [{ path: "variables.file", local: files[0] }], 2);
                id = d.r.id;
                console.log(`API: ${zType} created -> ${id}`);
                // v41.5: the site ALWAYS sends a cover for live / charging (HAR). No thumbnail or cover upload fails -> frame from the video (ffmpeg)
                const autoCover = () => {
                  try {
                    const ff = findFfmpeg(); if (!ff) return null;
                    const out = files[0].replace(/\.[^.\\/]+$/, "") + "-autocover.jpg";
                    for (const ss of ["1", "0"]) {
                      try { require("child_process").execFileSync(ff, ["-y", "-loglevel", "error", "-ss", ss, "-i", files[0], "-frames:v", "1", "-q:v", "2", out], { stdio: "ignore", timeout: 60000 }); } catch (x) {}
                      if (fs.existsSync(out) && fs.statSync(out).size > 1000) { console.log(`🖼️ auto cover from video frame (${ss}s)`); return out; }
                    }
                  } catch (x) { console.warn("auto cover failed: " + x.message); }
                  return null;
                };
                if (cfg.cover) {
                  let cv = coverImage && fs.existsSync(coverImage) ? coverImage : autoCover();
                  const upCover = (f) => zGql("cover image", "mutation " + cfg.cover, { profileId, input: { [cfg.coverKey]: id, file: null } }, [{ path: "variables.input.file", local: f }], 2);
                  if (!cv) console.warn("⚠️ no cover image (no thumbnail, ffmpeg frame failed) - continuing without cover");
                  else {
                    try { await upCover(cv); }
                    catch (ce) {
                      console.warn("API cover upload issue: " + ce.message);
                      const af = cv === coverImage ? autoCover() : null;
                      if (af) { try { await upCover(af); } catch (ce2) { console.warn("auto cover upload also failed (continuing): " + ce2.message); } }
                    }
                  }
                }
                // v31: foldable / tablet landscape companion (before publish, like the site). A failure never blocks the wallpaper.
                if (cfg.fold && foldImage && fs.existsSync(foldImage)) {
                  try {
                    const fd = await zGql("foldable image", "mutation " + cfg.fold, { profileId, wallpaperId: id, file: null }, [{ path: "variables.file", local: foldImage }], 2);
                    fold = fd && fd.r && fd.r.landscapeImageUrl ? "ok" : "no url";
                    console.log(fold === "ok" ? "📱 API: foldable image set" : "⚠️ API: foldable upload returned no landscapeImageUrl");
                  } catch (fe) { fold = "failed: " + fe.message; console.warn("⚠️ API foldable image failed (wallpaper continues): " + fe.message); }
                }
                await waitForExactTarget("Publish");   // v26.2 exact-time hold, same as UI path
                await zGql("meta+publish", "mutation " + cfg.meta, { profileId, id, input }, null, 2);
              } else {
                const P = cfg.p;
                const d = await zGql("create " + zType, `mutation ${P}Create($profileId: ID!) { r: ${P}CreateAsUser(profileId: $profileId) { id } }`, { profileId }, null, 2);
                id = d.r.id;
                console.log(`API: ${zType} created -> ${id}`);
                for (let k = 0; k < files.length; k++) {
                  await zGql(`image ${k + 1}/${files.length}`,
                    `mutation ${P}SetImageVariant($profileId: ID!, $contentId: ID!, $imageVariantIndex: Int!, $file: Upload!) { r: ${P}SetImageVariantAsUser(profileId: $profileId, contentId: $contentId, imageVariantIndex: $imageVariantIndex, file: $file) { id } }`,
                    { profileId, contentId: id, imageVariantIndex: k, file: null }, [{ path: "variables.file", local: files[k] }], 2);
                }
                await zGql("meta", `mutation ${P}MetaUpdate($profileId: ID!, $contentId: ID!, $input: DynamicWallpaperMetadataUpdateInput!) { r: ${cfg.metaOp}(profileId: $profileId, contentId: $contentId, input: $input) { id } }`, { profileId, contentId: id, input }, null, 2);
                await waitForExactTarget("Publish");
                await zGql("publish", "mutation premiumContentPublish($contentId: ID!) { r: premiumContentPublishAsUser(contentId: $contentId) { id } }", { contentId: id }, null, 2);
              }
              console.log(`API: publish requested for ${id}`);
              return { id, cfg, fold };
            } catch (e) {
              if (id) e.apiCreatedId = id;
              throw e;
            }
          }

          async function zApiGetStatus(profileId, zType, id) {
            const cfg = Z_API_TYPES[zType];
            const q = cfg.kind === "single" ? "query " + cfg.get
              : `query g($profileId: ID!, $id: ID!) { r: ${cfg.getOp}(profileId: $profileId, contentId: $id) { id status itemStatus } }`;
            const d = await zGql("status", q, { profileId, id }, null, 2);
            const r = (d && d.r) || {};
            return { status: String(r.status || r.itemStatus || "UNKNOWN").toUpperCase(), message: r.statusMessage || null };
          }

          // same contract as the old status check: { removed, statusName }
          // poll: every 3s for 2 min, then every 10s, then every 20s (max ~17 min, like the old 50 x 20s UI loop)
          async function zApiVerifyStatus(profileId, zType, id) {
            const WAITING = ["DRAFT", "IN_PROCESS", "PROCESSING", "PUBLISHING", "UPLOADING", "UNKNOWN"];
            const REMOVE = ["PENDING", "IN_REVIEW", "REJECTED", "FAILED"];
            const t0 = Date.now(); let a = 0, last = "";
            while (Date.now() - t0 < 17 * 60 * 1000) {
              a++;
              const el = Date.now() - t0;
              await zSleep(el < 120000 ? 3000 : el < 600000 ? 10000 : 20000);
              let st;
              try { st = await zApiGetStatus(profileId, zType, id); }
              catch (e) { console.log(`API status check #${a} failed: ${e.message}`); continue; }
              if (st.status !== last || a % 10 === 0) console.log(`API status #${a} (${Math.round((Date.now() - t0) / 1000)}s): ${st.status}${st.message ? " - " + st.message : ""}`);
              last = st.status;
              if (st.status === "PUBLISHED") return { removed: false, statusName: "PUBLISHED" };
              if (REMOVE.includes(st.status)) {
                const statusName = st.status === "IN_REVIEW" ? "IN REVIEW" : st.status;
                console.log(`Status is ${statusName}${st.message ? " (" + st.message + ")" : ""}. Removing via API (archive)...`);
                await zArchive(id).catch((e) => console.warn("API archive failed: " + e.message));
                return { removed: true, statusName, message: st.message || null };
              }
              if (!WAITING.includes(st.status)) console.log("API: unexpected status " + st.status + " - keep waiting");
            }
            console.log("Warning: API status check timed out. Proceeding anyway.");
            return { removed: false, statusName: "UNKNOWN" };
          }
          // ═══════════════════════════════ end v30 API ONLY ═══════════════════════════════


          // --- PROFILE ROTATION STATE MANAGER ---

          // Returns the next profile index whose upload count is still below perProfileLimit.
          // Returns -1 if every profile has reached its limit for today.
          function getNextAvailableProfile(lastUsedIndex, uploadCounts, total, perProfileLimit) {
            let next = (lastUsedIndex + 1) % total;
            for (let i = 0; i < total; i++) {
              if ((uploadCounts[next] || 0) < perProfileLimit) return next;
              next = (next + 1) % total;
            }
            return -1; // all profiles at their limit
          }

          async function getProfileState(totalProfilesCount) {
            console.log("Checking profile rotation state...");

            // Get current date in Dhaka timezone (e.g. "5/1/2026")
            const today = new Date().toLocaleString("en-US", { timeZone: "Asia/Dhaka" }).split(",")[0];

            let state;
            try {
              state = await firebaseGet("uploadState");
            } catch (e) {
              state = null;
            }

            if (!state) {
              state = {
                lastUploadDate: "",
                totalUploadsToday: 0,
                lastUsedProfileIndex: -1,
                totalProfilesAvailable: totalProfilesCount,
                profileUploadCounts: {}
              };
            }

            state.totalProfilesAvailable = totalProfilesCount;

            // Backward-compat: older records may have profilesUsedToday array instead
            if (typeof state.profileUploadCounts !== "object" || Array.isArray(state.profileUploadCounts)) {
              state.profileUploadCounts = {};
            }

            if (state.lastUploadDate !== today) {
              console.log("New day detected! Resetting daily upload count and profile usage.");
              // ── Rotate upload type each new day through all 7 content types ──
              const TYPE_CYCLE = ["AUDIO", "WALLPAPER", "WALLPAPER_24H", "WALLPAPER_DUAL", "WALLPAPER_BATTERY", "LIVE_WALLPAPER", "CHARGING_ANIMATION"];
              const DAY_LABELS = { AUDIO: "🎵 Ringtone", WALLPAPER: "🖼️ Wallpaper", WALLPAPER_24H: "🌅 24H Wallpaper", WALLPAPER_DUAL: "🔒 Dual Wallpaper", WALLPAPER_BATTERY: "🔋 Battery Wallpaper", LIVE_WALLPAPER: "🎬 Live Wallpaper", CHARGING_ANIMATION: "⚡ Charging Animation" };
              const prevType = TYPE_CYCLE.includes(state.uploadDayType) ? state.uploadDayType : TYPE_CYCLE[TYPE_CYCLE.length - 1]; // if no record yet, cycle lands on AUDIO for Day 1
              state.uploadDayType = TYPE_CYCLE[(TYPE_CYCLE.indexOf(prevType) + 1) % TYPE_CYCLE.length];
              console.log(`📅 Day changed — today's upload type: ${state.uploadDayType} (${DAY_LABELS[state.uploadDayType]} day)`);
              state.lastUploadDate = today;
              state.totalUploadsToday = 0;
              state.profileUploadCounts = {};
              // lastUsedProfileIndex is intentionally NOT reset here so the rotation
              // continues from where it left off across days.
              // e.g. 6 profiles, limit 3/day: Day1→0,1,2  Day2→3,4,5  Day3→0,1,2 ...
            }

            // Ensure uploadDayType is always initialized (very first run ever)
            if (!state.uploadDayType) {
              state.uploadDayType = "AUDIO"; // First day defaults to ringtone
              console.log("📅 First-ever run — defaulting to AUDIO (🎵 Ringtone) day");
            }

            const ZEDGE_DAILY_LIMIT = 3; // Zedge max uploads per day
            if (state.totalUploadsToday >= ZEDGE_DAILY_LIMIT) {
              console.log(`🛑 Zedge daily limit of ${ZEDGE_DAILY_LIMIT} uploads reached. Exiting safely.`);
              await markRemainingGateSlots(0, { status: "skipped-limit", error: "daily limit of 3 uploads already reached" });   // v27.11: nothing is missing -> no retry
              process.exit(0); 
            }

            // How many uploads each profile may do today.
            // Spreads the daily limit as evenly as possible across available profiles:
            //   1 profile  → 3 uploads each
            //   2 profiles → 2 uploads for first, 1 for second  (total = 3)
            //   3+ profiles → 1 upload each
            const perProfileLimit = Math.ceil(ZEDGE_DAILY_LIMIT / totalProfilesCount);

            const nextProfileIndex = getNextAvailableProfile(state.lastUsedProfileIndex, state.profileUploadCounts, totalProfilesCount, perProfileLimit);

            if (nextProfileIndex === -1) {
              console.log("🛑 All profiles have reached their daily upload limit. Exiting safely.");
              process.exit(0);
            }

            const countsDisplay = Object.entries(state.profileUploadCounts).map(([k,v]) => `P${k}:${v}`).join(", ") || "none";
            console.log(`Upload counts today: {${countsDisplay}} | Per-profile limit: ${perProfileLimit} | Next: ${nextProfileIndex}`);
            return { state, nextProfileIndex, perProfileLimit };
          }

          async function updateProfileStateAfterUpload(state, usedProfileIndex) {
            console.log(`Updating state: Profile ${usedProfileIndex} was used. Total today is now ${state.totalUploadsToday + 1}`);

            const profileUploadCounts = { ...(state.profileUploadCounts || {}) };
            profileUploadCounts[usedProfileIndex] = (profileUploadCounts[usedProfileIndex] || 0) + 1;

            await firebasePatch("uploadState", {
              lastUploadDate: state.lastUploadDate,
              totalUploadsToday: state.totalUploadsToday + 1,
              lastUsedProfileIndex: usedProfileIndex,
              totalProfilesAvailable: state.totalProfilesAvailable,
              profileUploadCounts,
              uploadDayType: state.uploadDayType
            });
          }
          // ----------------------------------------

          const SET_SLOTS = {
            WALLPAPER_24H: ["morning", "afternoon", "evening", "night"],
            WALLPAPER_DUAL: ["lock", "home"],
            WALLPAPER_BATTERY: ["critical", "low", "mid", "high", "full", "charging"]
          };
          const VIDEO_TYPES = ["LIVE_WALLPAPER", "CHARGING_ANIMATION"];

          function getItemContentType(item) {
            if (item && item.contentType) return item.contentType;
            const mp3 = item && (item.isMp3 || (item.name && item.name.toLowerCase().endsWith(".mp3")));
            return mp3 ? "RINGTONE" : "WALLPAPER";
          }

          function slotFileUrl(item, slot) {
            const v = item && item.files ? item.files[slot] : null;
            return typeof v === "string" ? v : ((v && v.fileUrl) || "");
          }

          // ── v31 FOLDABLE (landscape) companion for single wallpapers ───────────────────────────────
          // Source (same as the AI Image Studio): queue item foldUrl, or files["wallpaper-landscape"]
          // (studio record), or landscapeUrl. Zedge rule: JPEG, >= 2800x2400, 7:6, max 25 MP / 8 MB.
          const FOLD_RULE = { w: 2800, h: 2400, maxBytes: 8 * 1024 * 1024, maxMP: 25 };
          function foldSourceUrl(item) {
            if (!item) return "";
            return String(item.foldUrl || slotFileUrl(item, "wallpaper-landscape") || item.landscapeUrl || "").trim();
          }
          function jpegSize(buf) {
            if (!buf || buf.length < 4 || buf[0] !== 0xff || buf[1] !== 0xd8) return null;
            let i = 2;
            while (i + 9 < buf.length) {
              if (buf[i] !== 0xff) { i++; continue; }
              const m = buf[i + 1];
              if (m >= 0xc0 && m <= 0xcf && m !== 0xc4 && m !== 0xc8 && m !== 0xcc) return { h: buf.readUInt16BE(i + 5), w: buf.readUInt16BE(i + 7) };
              i += 2 + buf.readUInt16BE(i + 2);
            }
            return null;
          }
          function foldProblems(file) {
            const buf = fs.readFileSync(file); const d = jpegSize(buf); const p = [];
            if (!d) { p.push("not a JPEG"); return { p, d }; }
            if (buf.length > FOLD_RULE.maxBytes) p.push(`${(buf.length / 1048576).toFixed(1)} MB > 8 MB`);
            if (d.w < FOLD_RULE.w || d.h < FOLD_RULE.h) p.push(`${d.w}x${d.h} < 2800x2400`);
            if (d.w * d.h / 1e6 > FOLD_RULE.maxMP) p.push(`${(d.w * d.h / 1e6).toFixed(1)} MP > 25 MP`);
            if (Math.abs(d.w / d.h - 7 / 6) / (7 / 6) > 0.02) p.push(`ratio ${(d.w / d.h).toFixed(3)} != 7:6`);
            return { p, d };
          }
          // Same fit as the studio: centred trim to 7:6, scale to exactly 2800x2400, JPEG under 8 MB.
          function foldFit(src, dst) {
            const { execFileSync } = require("child_process");
            const ff = findFfmpeg(); if (!ff) throw new Error("ffmpeg not found");
            for (const q of [2, 3, 4, 6, 8]) {
              execFileSync(ff, ["-y", "-loglevel", "error", "-i", src, "-vf",
                "crop='if(gt(iw/ih,7/6),ih*7/6,iw)':'if(gt(iw/ih,7/6),ih,iw*6/7)',scale=2800:2400:flags=bicubic",
                "-q:v", String(q), "-frames:v", "1", dst], { stdio: "ignore", timeout: 120000 });
              if (fs.existsSync(dst) && fs.statSync(dst).size <= FOLD_RULE.maxBytes - 65536) return dst;
            }
            return dst;
          }
          async function prepareFold(item, localDir, id) {
            const url = foldSourceUrl(item);
            if (!url) return null;
            const raw = path.join(localDir, `${id}-landscape-src`);
            try {
              const res = await fetch(url);
              if (!res.ok) throw new Error("HTTP " + res.status);
              fs.writeFileSync(raw, Buffer.from(await res.arrayBuffer()));
            } catch (e) { console.warn(`⚠️ Foldable image download failed (${e.message}) - wallpaper will upload without it`); return { file: null, note: "download failed" }; }
            let chk = foldProblems(raw);
            if (!chk.p.length) { const f = path.join(localDir, `${id}-landscape.jpg`); fs.renameSync(raw, f); console.log(`📱 Foldable image ready ${chk.d.w}x${chk.d.h}`); return { file: f, note: null }; }
            const d = chk.d;
            if (d && (d.w / d.h < 0.99 || d.w / d.h > 1.52)) { console.warn(`⚠️ Foldable image is not landscape (${d.w}x${d.h}) - skipped`); return { file: null, note: `not landscape ${d.w}x${d.h}` }; }
            try {
              const f = foldFit(raw, path.join(localDir, `${id}-landscape.jpg`));
              chk = foldProblems(f);
              if (chk.p.length) throw new Error(chk.p.join(", "));
              console.log(`📱 Foldable image auto-fitted to ${chk.d.w}x${chk.d.h} (was: ${foldProblems(raw).p.join(", ")})`);
              return { file: f, note: null };
            } catch (e) { console.warn(`⚠️ Foldable image does not match Zedge rules and auto-fit failed (${e.message}) - skipped`); return { file: null, note: e.message }; }
          }

          // ── v23 metadata guard helpers ───────────────────────────────────────────
          // Required for upload: title + tags + category (same rule as the generator + app + panel).
          function metadataMissingFields(item) {
            const txt = (v) => Array.isArray(v) ? v.map(x => String(x || "").trim()).filter(Boolean).join(",") : String(v ?? "").trim();
            const missing = [];
            if (!txt(item?.title)) missing.push("title");
            if (!txt(item?.tags)) missing.push("tags");
            if (!txt(item?.category)) missing.push("category");
            return missing;
          }
          function hasRequiredMetadata(item) { return metadataMissingFields(item).length === 0; }

          async function publishMetadataAlerts(missingEntries) {
            const items = {};
            for (const [id, item] of missingEntries) {
              items[id] = { name: item.name || item.title || id, contentType: getItemContentType(item), missing: metadataMissingFields(item), createdAt: item.createdAt || null };
            }
            const ids = Object.keys(items).sort();
            const key = ids.join("|");
            if (ids.length) {
              console.log(`META_MISSING => ${ids.length} queued file(s) skipped (no metadata): ` + ids.map(id => `"${items[id].name}" [${items[id].missing.join(",")}]`).join("; "));
            }
            let prev = null;
            try { prev = await firebaseGet("dashboardSettings/metadataAlerts"); } catch (e) { console.log(`metadataAlerts read failed: ${e.message}`); }
            try {
              const res = await fetch(`${firebaseDatabaseURL}/dashboardSettings/metadataAlerts.json`, {
                method: "PUT", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ count: ids.length, items, key, updatedAt: Date.now(), updatedDhaka: fmtDhakaTime(), runId: process.env.GITHUB_RUN_ID || "", notifiedKey: prev && prev.notifiedKey ? prev.notifiedKey : "" })
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
            } catch (e) { console.log(`metadataAlerts write failed: ${e.message}`); }
            // Telegram: only when the set of metadata-less files changed (no spam on every run)
            if (ids.length && (!prev || prev.notifiedKey !== key)) {
              const lines = ids.slice(0, 10).map(id => `• ${tgEscape(items[id].name)} <i>(${items[id].missing.join(", ")})</i>`);
              if (ids.length > 10) lines.push(`… এবং আরও ${ids.length - 10} টি`);
              const msg = [
                `⚠️ <b>মেটাডাটা নেই - ${ids.length} টি ফাইল আপলোড হবে না</b>`,
                "━━━━━━━━━━━━━━━━",
                `📁 প্রজেক্ট: ${tgEscape(process.env.FOLDER_NAME || "Zedge Bot")}`,
                `🕒 সময়: ${fmtDhakaTime()}`,
                "📝 ফাইল:",
                lines.join("\n"),
                "",
                "💡 অ্যাপ / প্যানেল থেকে title, tags, category দিন - অথবা generator.yml (metadata mode) চালান। মেটাডাটা না দেওয়া পর্যন্ত এই ফাইলগুলো স্কিপ হবে।"
              ].join("\n");
              await sendTelegramNotification(msg);
              try { await firebasePatch("dashboardSettings/metadataAlerts", { notifiedKey: key, notifiedAt: Date.now() }); } catch (_) {}
            }
          }

          function hasSetFiles(item) {
            const slots = SET_SLOTS[getItemContentType(item)];
            if (!slots) return false;
            return slots.every(s => slotFileUrl(item, s));
          }

          async function getNextWallpaperFromRealtimeDB(dayType, dayTypeLocked = false, variety = null) {
            console.log(`Checking Firebase Realtime Database queue... (Today's type: ${dayType}${dayTypeLocked ? " - LOCKED for today" : ""})`);
            console.log(`ACTIVE_DB: ${firebaseDatabaseURL}`);
            const data = await firebaseGet(queuePath);
            if (!data) throw new Error(`No items found in Realtime Database (${firebaseDatabaseURL})`);

            // STALE CLAIM RECOVERY: if a previous run crashed hard (runner killed),
            // an item can stay stuck in "processing" forever and would never upload.
            // Recover claims older than 3h back to "queued" (max 2 recoveries, then "failed"
            // so a repeatedly-crashing item can never be uploaded twice by accident).
            const STALE_CLAIM_MS = 3 * 60 * 60 * 1000;
            for (const [sid, sitem] of Object.entries(data)) {
              if (!sitem || sitem.status !== "processing") continue;
              const claimAge = Date.now() - (sitem.processingAt || 0);
              if (claimAge <= STALE_CLAIM_MS) continue;
              const recoveries = (sitem.staleRecoveries || 0) + 1;
              if (recoveries > 2) {
                console.log(`STALE_CLAIM => "${sitem.name || sid}" crashed ${recoveries} times - marking failed (manual requeue needed).`);
                await firebasePatch(`${queuePath}/${sid}`, { status: "failed", error: "Stale processing claim - run crashed repeatedly", failedAt: Date.now() });
                sitem.status = "failed";
              } else {
                console.log(`STALE_CLAIM => "${sitem.name || sid}" stuck in processing for ${Math.round(claimAge / 60000)} min - recovering to queued (recovery #${recoveries}).`);
                await firebasePatch(`${queuePath}/${sid}`, { status: "queued", claimToken: null, processingAt: null, staleRecoveries: recoveries });
                sitem.status = "queued";
              }
            }

            const uploadable = Object.entries(data).filter(([_, item]) =>
              item &&
              item.status === "queued" &&
              (item.fileBase64 || item.imageBase64 || item.fileUrl || hasSetFiles(item))
            );

            // v23 METADATA GUARD: a file without title / tags / category NEVER goes to Zedge.
            // Such files stay "queued" (so the generator / app / panel can fill them) but are
            // invisible to the picker below. The list is published to Firebase so the app + panel
            // can show a "metadata missing" alert, and Telegram is pinged once per distinct set.
            const missingMeta = uploadable.filter(([_, item]) => !hasRequiredMetadata(item));
            const allQueued = uploadable.filter(([_, item]) => hasRequiredMetadata(item));
            await publishMetadataAlerts(missingMeta);

            const typeCounts = {};
            allQueued.forEach(([_, item]) => {
              const t = getItemContentType(item);
              typeCounts[t] = (typeCounts[t] || 0) + 1;
            });
            console.log(`QUEUE_COMPOSITION => total:${allQueued.length} | ${JSON.stringify(typeCounts)} | dayType:${dayType}`);

            // Which queue content type belongs to today's day type
            const wantedType = dayType === "AUDIO" ? "RINGTONE" : dayType;

            // Pinned scheduling: items pinned to today's date (or overdue) take priority over the rotation
            const todayKey = new Date(Date.now() + 6 * 3600 * 1000).toISOString().slice(0, 10);
            const pinnedEntries = allQueued
              .filter(([_, item]) => item.scheduledDate && item.scheduledDate <= todayKey)
              .sort((a, b) =>
                String(a[1].scheduledDate).localeCompare(String(b[1].scheduledDate)) ||
                ((a[1].createdAt || 0) - (b[1].createdAt || 0))
              );
            if (pinnedEntries.length) {
              console.log(`PINNED_QUEUE => ${pinnedEntries.length} item(s) pinned for <= ${todayKey}; pinned item overrides rotation type.`);
            }

            // Oldest-first queued entries of one content type (not scheduled for a future day)
            const entriesOfType = (t) => allQueued
              .filter(([_, item]) => (!item.scheduledDate || item.scheduledDate <= todayKey) && getItemContentType(item) === t)
              .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

            // DAY-TYPE SKIP (strict "each content on its own day"):
            // If today's type has nothing queued (and nothing is pinned), we do NOT borrow
            // another type onto this day. Instead the DAY ITSELF becomes the next type in the
            // cycle that actually has stock, and the rotation continues from there.
            //   e.g. WALLPAPER day, 0 wallpapers, 0 24H, 4 dual  ->  today becomes DUAL day,
            //        tomorrow is BATTERY day, and so on.
            // The new day type is persisted to Firebase so all runs today + tomorrow's rotation agree.
            // FULL-DAY RULE: a content type only gets a day when it has a FULL day of stock
            // (MIN_STOCK_FOR_DAY = 3). Types with 1-2 items WAIT until restocked (or are pinned
            // manually). Once a rotation upload happens the day type is LOCKED - it never
            // switches mid-day, so a day always shows exactly one content type.
            const MIN_STOCK_FOR_DAY = 3;
            let pickedType = wantedType;
            let effectiveDayType = dayType;
            let dayTypeSwitchedTo = null;
            let entries = pinnedEntries.length ? pinnedEntries : entriesOfType(wantedType);
            // v25 MIX MODE (dashboardSettings/variety.enabled): every slot of the day uploads a DIFFERENT
            // content type. Slot k takes order[k] (order rotates daily so the first slot is not always the
            // same type). Types already uploaded today are skipped; a type with no stock is skipped for
            // the next unused type. strict=true -> never repeat a type on the same day (wait instead).
            let varietyPick = null;
            if (variety && variety.enabled && !pinnedEntries.length) {
              const used = Array.isArray(variety.usedToday) ? variety.usedToday : [];
              const unused = variety.order.filter(t => !used.includes(t));
              const seq = unused.length ? unused : (variety.strict ? [] : variety.order.slice());
              let chosen = null;
              const empty = [];
              for (const t of seq) { const found = entriesOfType(t); if (found.length) { chosen = { t, found }; break; } empty.push(t); }
              // v27.11 GAP FILL: the type(s) this slot wanted have no stock (e.g. only 2 content types have files
              // but the day has 3 slots) -> NEVER leave the slot blank. Take the type with the FEWEST uploads today
              // that still has stock (least-repeated first, then today's order). Applies in strict mode too: strict
              // now only sets the preference (different type first) - an empty slot is worse than a repeated type,
              // 3 slots must always mean 3 uploads.
              let gapFill = false;
              if (!chosen) {
                const cnt = (t) => used.filter(u => u === t).length;
                const ranked = variety.order.slice().sort((a, b) => cnt(a) - cnt(b) || variety.order.indexOf(a) - variety.order.indexOf(b));
                for (const t of ranked) { const found = entriesOfType(t); if (found.length) { chosen = { t, found }; gapFill = true; break; } }
              }
              if (!chosen) {
                const metaNote = missingMeta.length ? ` NO_METADATA => ${missingMeta.length} file(s) are waiting for metadata and were not counted.` : "";
                throw new Error(`MIX_MODE_WAIT => mix mode is ON and no queued file exists for ANY content type today (used today: [${used.join(", ") || "none"}], empty: [${empty.join(", ")}]). Add files or pin an item.${metaNote}`);
              }
              pickedType = chosen.t;
              entries = chosen.found;
              varietyPick = chosen.t;
              console.log(`MIX_MODE => slot ${used.length + 1}: uploading ${chosen.t} (${chosen.found.length} queued)${gapFill ? " [GAP FILL - wanted type(s) " + (empty.join(", ") || "-") + " have no stock, repeating the least-used type so the slot is not left empty]" : ""}. Used today: [${used.join(", ") || "none"}] | order today: ${variety.order.join(" > ")}${empty.length && !gapFill ? ` | skipped (empty): ${empty.join(", ")}` : ""}`);
            }
            if (varietyPick) {
              // handled above - day-type rotation / lock rules do not apply in mix mode
            } else if (!pinnedEntries.length) {
              if (dayTypeLocked) {
                if (!entries.length) {
                  throw new Error(`DAY_LOCKED => today is a ${dayType} day (locked) and no more ${wantedType} queued. Not switching type mid-day - nothing more to upload today.`);
                }
              } else if (entries.length < MIN_STOCK_FOR_DAY) {
                const TYPE_CYCLE_SKIP = ["AUDIO", "WALLPAPER", "WALLPAPER_24H", "WALLPAPER_DUAL", "WALLPAPER_BATTERY", "LIVE_WALLPAPER", "CHARGING_ANIMATION"];
                const startIdx = Math.max(0, TYPE_CYCLE_SKIP.indexOf(dayType));
                const waiting = [];
                if (entries.length) waiting.push(`${wantedType}:${entries.length}/${MIN_STOCK_FOR_DAY}`);
                let chosen = null;
                for (let step = 1; step < TYPE_CYCLE_SKIP.length && !chosen; step++) {
                  const tryDayType = TYPE_CYCLE_SKIP[(startIdx + step) % TYPE_CYCLE_SKIP.length];
                  const tryType = tryDayType === "AUDIO" ? "RINGTONE" : tryDayType;
                  const found = entriesOfType(tryType);
                  if (found.length >= MIN_STOCK_FOR_DAY) {
                    chosen = { tryDayType, tryType, found };
                  } else if (found.length) {
                    waiting.push(`${tryType}:${found.length}/${MIN_STOCK_FOR_DAY}`);
                  }
                }
                if (!chosen) {
                  const metaNote = missingMeta.length ? ` NO_METADATA => ${missingMeta.length} file(s) are waiting for metadata and were not counted.` : "";
                  throw new Error(`WAIT_FOR_STOCK => no content type has a full day of stock (>= ${MIN_STOCK_FOR_DAY}). Waiting: [${waiting.join(", ")}]. Add more files or pin an item manually. Nothing uploaded.${metaNote}`);
                }
                pickedType = chosen.tryType;
                effectiveDayType = chosen.tryDayType;
                dayTypeSwitchedTo = chosen.tryDayType;
                entries = chosen.found;
                console.log(`DAY_TYPE_SKIP => ${dayType} day has only ${entriesOfType(wantedType).length}/${MIN_STOCK_FOR_DAY} ${wantedType}; today is now a ${chosen.tryDayType} day (${chosen.found.length} available). Waiting for restock: [${waiting.join(", ") || "none"}]`);
                // Persist immediately so the dashboard + later runs today see the switched type
                await firebasePatch("uploadState", { uploadDayType: dayTypeSwitchedTo });
              }
            }

            if (!entries.length) {
              const metaNote = missingMeta.length ? ` NO_METADATA => ${missingMeta.length} queued file(s) skipped because metadata is missing.` : "";
              throw new Error(`Queue is completely EMPTY - no uploadable item of ANY type found. Queue => ${JSON.stringify(typeCounts)}.${metaNote} DB=${firebaseDatabaseURL}`);
            }

            const [id, item] = entries[0];
            const localDir = path.join(process.cwd(), "downloads");
            fs.mkdirSync(localDir, { recursive: true });

            const contentType = getItemContentType(item);
            const isMp3 = contentType === "RINGTONE";

            // Defensive guard (double-check); pinned and fallback picks may legally differ from the rotation type
            const isPinnedPick = Boolean(item.scheduledDate && item.scheduledDate <= todayKey);
            if (isPinnedPick) {
              console.log(`PINNED_PICK => "${item.name || id}" was scheduled for ${item.scheduledDate} (today: ${todayKey})`);
            } else if (contentType !== pickedType) {
              throw new Error(`Day/type mismatch guard triggered. dayType=${effectiveDayType}, pickedType=${pickedType}, item=${item.name || id}, contentType=${contentType}`);
            } else if (dayTypeSwitchedTo) {
              console.log(`DAY_TYPE_SKIP_UPLOAD => uploading ${contentType} "${item.name || id}" - day switched ${dayType} -> ${dayTypeSwitchedTo} (no ${wantedType} queued).`);
            }

            // ANTI DOUBLE-UPLOAD GUARD: claim this item FIRST with a unique token,
            // then verify we own the claim. If any other run already claimed this file,
            // abort immediately so the same file can NEVER be uploaded twice.
            const claimToken = `claim-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            await firebasePatch(`${queuePath}/${id}`, {
              status: "processing",
              processingAt: Date.now(),
              claimToken
            });
            const claimCheck = await firebaseGet(`${queuePath}/${id}`);
            if (!claimCheck || claimCheck.claimToken !== claimToken) {
              throw new Error(`Queue item ${id} was already claimed by another run - aborting to prevent double upload.`);
            }

            async function downloadToFile(url, filePath, label) {
              console.log(`Downloading ${label} from R2: ${url}`);
              const res = await fetch(url);
              if (!res.ok) throw new Error(`Failed to download ${label} from R2: HTTP ${res.status}`);
              const arrayBuffer = await res.arrayBuffer();
              fs.writeFileSync(filePath, Buffer.from(arrayBuffer));
            }

            let localFile;
            let localFiles = [];
            let fileUrls = [];
            let localThumb = null;
            let localFold = null, foldNote = null;

            if (SET_SLOTS[contentType]) {
              // Multi-image set (24H / Dual / Battery) - download every slot image in order
              if (!hasSetFiles(item)) {
                throw new Error(`${contentType} item ${id} is missing one or more slot images (${SET_SLOTS[contentType].join(", ")})`);
              }
              for (const slot of SET_SLOTS[contentType]) {
                const slotUrl = slotFileUrl(item, slot);
                const slotFile = path.join(localDir, `${id}-${slot}.jpg`);
                await downloadToFile(slotUrl, slotFile, `${contentType} ${slot} image`);
                localFiles.push(slotFile);
                fileUrls.push(slotUrl);
              }
              localFile = localFiles[0];
              console.log(`${contentType} set ready - ${localFiles.length} images downloaded`);
            } else if (VIDEO_TYPES.includes(contentType)) {
              // Video content (Live Wallpaper / Charging Animation) + auto thumbnail
              const isMov = item.name && item.name.toLowerCase().endsWith(".mov");
              localFile = path.join(localDir, `${id}${isMov ? ".mov" : ".mp4"}`);
              await downloadToFile(item.fileUrl, localFile, item.name || id);
              localFiles = [localFile];
              fileUrls = [item.fileUrl];
              if (item.thumbUrl) {
                localThumb = path.join(localDir, `${id}-thumb.jpg`);
                await downloadToFile(item.thumbUrl, localThumb, "cover thumbnail");
                fileUrls.push(item.thumbUrl);
              } else {
                console.warn(`${contentType} item ${id} has no thumbUrl - cover image step will be skipped`);
              }
            } else {
              const isJpeg = item.name && item.name.toLowerCase().endsWith(".jpeg");
              const ext = isMp3 ? ".mp3" : (isJpeg ? ".jpeg" : ".jpg");
              localFile = path.join(localDir, `${id}${ext}`);

              console.log(`Saving queued item: ${item.name || id} as ${ext}`);
              if (item.fileUrl) {
                await downloadToFile(item.fileUrl, localFile, item.name || id);
              } else {
                const base64Data = item.fileBase64 || item.imageBase64;
                if (base64Data) {
                  const base64 = base64Data.includes(",")
                    ? base64Data.split(",")[1]
                    : base64Data;
                  fs.writeFileSync(localFile, Buffer.from(base64, "base64"));
                } else {
                  throw new Error(`Queue item ${id} is missing both fileUrl and base64 data`);
                }
              }
              localFiles = [localFile];
              if (item.fileUrl) fileUrls = [item.fileUrl];
              if (!isMp3 && contentType === "WALLPAPER") {
                const fp = await prepareFold(item, localDir, id);
                if (fp) { localFold = fp.file; foldNote = fp.note; fileUrls.push(foldSourceUrl(item)); }   // R2 cleanup after upload
              }
            }

            // Item already claimed above (anti double-upload guard) - no re-claim needed.

            return {
              id,
              localFile,
              localFiles,
              localThumb,
              localFold,
              foldNote,
              hasFoldSource: !!foldSourceUrl(item),
              contentType,
              isMp3,
              dayTypeSwitchedTo,
              varietyType: varietyPick,
              isPinnedPick,
              name:        item.name || id,
              title:       item.title || "",
              tags:        item.tags || "",
              category:    item.category || "",
              description: item.description || "",
              fileUrl:     item.fileUrl || "",
              fileUrls
            };
          }

          async function markWallpaperDoneAndDelete(id, name, fileUrlOrUrls) {
            console.log(`Upload successful - deleting "${name}" from Firebase...`);
            await firebaseDelete(`${queuePath}/${id}`);
            console.log(`"${name}" permanently removed from Firebase queue`);

            const urls = (Array.isArray(fileUrlOrUrls) ? fileUrlOrUrls : [fileUrlOrUrls]).filter(Boolean);

            for (const fileUrl of urls) {
              let fileKey = "";
              try {
                const u = new URL(fileUrl);
                fileKey = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
              } catch {
                // fallback for malformed URL strings
                fileKey = String(fileUrl).replace(/^https?:\/\/[^/]+\//i, "");
              }

              try {
                console.log(`R2 delete request => fileUrl: ${fileUrl}`);
                console.log(`R2 delete request => parsed key: ${fileKey}`);

                const res = await fetch(r2WorkerUrl, {
                  method: "DELETE",
                  headers: {
                    "X-File-Name": fileKey
                  }
                });

                const body = await res.text().catch(() => "");
                if (res.ok) {
                  console.log(`Successfully deleted key "${fileKey}" from Cloudflare R2. Status=${res.status} Body=${body}`);
                } else {
                  console.warn(`R2 delete failed for key "${fileKey}". Status=${res.status} Body=${body}`);
                }
              } catch (err) {
                console.error(`Failed to delete "${fileKey}" from R2:`, err.message);
              }
            }
          }

          async function markWallpaperFailed(id, error) {
            await firebasePatch(`${queuePath}/${id}`, {
              status: "failed",
              error: String(error).slice(0, 1000),
              failedAt: Date.now()
            });
          }

          async function getProxyTimezone(browser) {
            const providers = [
              { url: "https://ipwho.is/", parse: d => d.timezone?.id },
              { url: "https://ipinfo.io/json", parse: d => d.timezone },
              { url: "http://ip-api.com/json", parse: d => d.timezone }
            ];

            for (const provider of providers) {
              let ctx;
              try {
                ctx = await browser.newContext({ ignoreHTTPSErrors: true });
                const page = await ctx.newPage();
                console.log(`Checking timezone via ${provider.url}`);
                await page.goto(provider.url, { waitUntil: "domcontentloaded" });
                const text = await page.locator("body").innerText();
                if (!text || !text.trim().startsWith("{")) throw new Error("Response is not JSON");
                const data = JSON.parse(text);
                const tz = provider.parse(data);
                if (!tz) throw new Error("No timezone found");
                await ctx.close();
                console.log(`Detected timezone: ${tz}`);
                return tz;
              } catch (err) {
                console.log(`Timezone provider failed: ${err.message}`);
                if (ctx) await ctx.close().catch(() => {});
              }
            }

            console.log("Using fallback timezone: Asia/Dhaka");
            return "Asia/Dhaka";
          }




          async function scrollFullPage(page) {
            await page.evaluate(async () => {
              await new Promise(resolve => {
                let lastY = -1;
                const step = () => {
                  window.scrollBy(0, 500);
                  if (window.scrollY === lastY || window.scrollY + window.innerHeight >= document.body.scrollHeight) {
                    resolve();
                    return;
                  }
                  lastY = window.scrollY;
                  requestAnimationFrame(step);
                };
                step();
              });
            });
          }



